<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浏览器小模型聊天</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f6f8;
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }
    .chat-container {
      width: 520px;
      max-width: 100%;
      height: 700px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 16px;
      font-weight: 600;
      font-size: 16px;
      border-bottom: 1px solid #eee;
    }

    /* ===== 进度条样式 ===== */
    .progress-wrapper {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      display: none; /* 默认隐藏，加载时显示 */
    }
    .progress-wrapper.active { display: block; }
    .progress-text {
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #1677ff, #4096ff);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .status-msg {
      padding: 8px 16px;
      font-size: 13px;
      color: #666;
      border-bottom: 1px solid #f0f0f0;
    }
    .status-msg.error { color: #d9363e; }
    .status-msg.success { color: #389e0d; }

    /* ===== 聊天区域 ===== */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }
    .user {
      align-self: flex-end;
      background: #1677ff;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #f2f3f5;
      color: #222;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eee;
    }
    input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px 14px;
      outline: none;
      font-size: 14px;
    }
    input:focus { border-color: #1677ff; }
    button {
      border: none;
      background: #1677ff;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { opacity: 0.9; }
    button:disabled { background: #bbb; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">🤖 浏览器小模型聊天</div>

    <!-- 进度条区域 -->
    <div class="progress-wrapper" id="progressWrapper">
      <div class="progress-text">
        <span id="progressLabel">正在加载模型...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- 状态消息 -->
    <div class="status-msg" id="statusMsg">正在初始化...</div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input id="input" placeholder="输入消息，例如：你好" disabled />
      <button id="sendBtn" disabled>发送</button>
    </div>
  </div>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // DOM 元素
    const progressWrapper = document.getElementById("progressWrapper");
    const progressBar     = document.getElementById("progressBar");
    const progressLabel   = document.getElementById("progressLabel");
    const progressPercent = document.getElementById("progressPercent");
    const statusMsg       = document.getElementById("statusMsg");
    const messagesEl      = document.getElementById("messages");
    const inputEl         = document.getElementById("input");
    const sendBtn         = document.getElementById("sendBtn");

    let engine = null;
    const history = [
      { role: "system", content: "你是一个友好的中文聊天助手。请用简短、自然、口语化的方式回答。不要长篇大论。" }
    ];

    // ========== 工具函数 ==========
    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "message " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = "status-msg " + type;
    }

    function updateProgress(progress) {
      progressWrapper.classList.add("active");
      const pct = Math.round((progress.progress || 0) * 100);
      progressBar.style.width = pct + "%";
      progressPercent.textContent = pct + "%";

      // 显示当前正在下载的文件名或阶段描述
      if (progress.text) {
        progressLabel.textContent = progress.text;
      }
    }

    function hideProgress() {
      progressWrapper.classList.remove("active");
    }

    // ========== 加载模型 ==========
    async function loadModel() {
      // 检测 WebGPU
      if (!navigator.gpu) {
        setStatus("❌ 您的浏览器不支持 WebGPU，请使用最新版 Chrome 或 Edge。", "error");
        return;
      }

      try {
        setStatus("⏳ 正在加载模型，首次需下载约 300-500MB，请耐心等待...");

        engine = await webllm.CreateMLCEngine(
          "Qwen2.5-0.5B-Instruct-q4f32_1-MLC",
          {
            initProgressCallback: (progress) => {
              updateProgress(progress);
              // 同时更新状态栏文字
              if (progress.text) {
                setStatus("⏳ " + progress.text);
              }
            }
          }
        );

        hideProgress();
        setStatus("✅ 模型加载完成，可以开始聊天了！", "success");
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        addMessage("模型已就绪，你可以跟我说话了 😊", "bot");

      } catch (err) {
        console.error(err);
        hideProgress();
        setStatus("❌ 加载失败：" + err.message + "。请检查网络或更换模型。", "error");
      }
    }

    // ========== 发送消息 ==========
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !engine) return;

      addMessage(text, "user");
      inputEl.value = "";
      sendBtn.disabled = true;
      inputEl.disabled = true;

      history.push({ role: "user", content: text });

      try {
        setStatus("🤔 思考中...");
        const response = await engine.chat.completions.create({
          messages: history.slice(-8),
          temperature: 0.7,
          max_tokens: 256
        });

        const reply = response.choices[0]?.message?.content || "抱歉，我没有生成回复。";
        history.push({ role: "assistant", content: reply });
        addMessage(reply, "bot");
        setStatus("✅ 模型加载完成，可以开始聊天了！", "success");

      } catch (err) {
        console.error(err);
        addMessage("生成失败：" + err.message, "bot");
        setStatus("❌ 生成出错：" + err.message, "error");
      } finally {
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    // ========== 事件绑定 ==========
    sendBtn.onclick = sendMessage;
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 启动
    loadModel();
  </script>
</body>
</html>
