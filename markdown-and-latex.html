  return wrap;
}

/* ---------- 高亮 + 行号 ---------- */
function wrapHighlightedLines(codeEl){
  const frag = document.createDocumentFragment();
  let lineNo=0, active=[], line, content, cur;
  function newLine(){
    lineNo++;
    line=document.createElement('div'); line.className='code-line';
    const num=document.createElement('span'); num.className='line-no'; num.setAttribute('aria-hidden','true'); num.textContent=lineNo;
    content=document.createElement('span'); content.className='line-content';
    line.appendChild(num); line.appendChild(content); frag.appendChild(line);
    cur=content;
    active.forEach(a=>{ const el=document.createElement(a.tag); if(a.cls) el.className=a.cls; cur.appendChild(el); cur=el; });
  }
  function addText(t){
    t.split('\n').forEach((part,i)=>{ if(i>0) newLine(); if(part) cur.appendChild(document.createTextNode(part)); });
  }
  function walk(node){
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType===3){ addText(ch.nodeValue); }
      else if(ch.nodeType===1){
        const tag=ch.tagName.toLowerCase(), cls=ch.getAttribute('class')||'';
        active.push({tag,cls});
        const clone=ch.cloneNode(false); if(cls) clone.className=cls;
        cur.appendChild(clone);
        const prev=cur; cur=clone; walk(ch); cur=prev; active.pop();
      }
    });
  }
  newLine(); walk(codeEl);
  codeEl.innerHTML=''; codeEl.appendChild(frag);
}
function enhanceCodeBlocks(root){
  root.querySelectorAll('.code-block-wrapper pre code').forEach(code=>{
    const raw = code.dataset.raw !== undefined ? code.dataset.raw : code.textContent;
    code.dataset.raw = raw; code.textContent = raw; code.classList.remove('hljs');
    if(window.hljs && !code.classList.contains('nohighlight')){
      try{ hljs.highlightElement(code); }catch(e){}
    }
    wrapHighlightedLines(code);
  });
}

/* =========================================================
   思维导图引擎 v2
   宽容解析 Mermaid mindmap 语法（中文 / 任意形状 / 图标 / 注释 /
   任意缩进 / 带不带 id 都行），自研纯 SVG 渲染 6 种布局：
   右向树 / 左向树 / 向下树 / 向上树 / 双侧对称 / 中心放射。
   官方 Mermaid 只负责 flowchart、sequence 等其它图。
   ========================================================= */
let mmInited = false, mmUid = 0;
/* 实时渲染会重建整块 DOM，这里按源码指纹记住每张图的布局 / 缩放 / 折叠状态 */
let mmPersist = {};
function mmSrcKey(src){
  let h=5381; const s=String(src||'');
  for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0;
  return 'k'+h.toString(36)+'_'+s.length;
}
function captureMindmapStates(){
  const old={};
  output.querySelectorAll('.mermaid-card.mm-card').forEach(card=>{
    const src=card._mmSrc; if(!src) return;
    old[mmSrcKey(src)]={
      layout:card.dataset.mmLayout||'right',
      scale:card.dataset.mmScale||'1',
      collapsed:Array.from(card._mmCollapsed||[])
    };
  });
  if(Object.keys(old).length) mmPersist=Object.assign(mmPersist,old);
}
const MM_LAYOUTS = [
  {k:'right',  n:'右向树',   i:'→'},
  {k:'left',   n:'左向树',   i:'←'},
  {k:'down',   n:'向下树',   i:'↓'},
  {k:'up',     n:'向上树',   i:'↑'},
  {k:'split',  n:'双侧对称', i:'⇆'},
  {k:'radial', n:'中心放射', i:'✺'}
];
const MM_ALIAS = {
  lr:'right', r:'right', right:'right', '右':'right', '右向':'right', '向右':'right', '横向':'right',
  rl:'left', l:'left', left:'left', '左':'left', '左向':'left', '向左':'left',
  tb:'down', td:'down', d:'down', down:'down', '下':'down', '向下':'down', '竖向':'down', '树状':'down',
  bt:'up', u:'up', up:'up', '上':'up', '向上':'up',
  split:'split', bilateral:'split', symmetric:'split', fishbone:'split',
  '双侧':'split', '对称':'split', '鱼骨':'split', '左右':'split',
  radial:'radial', orbit:'radial', circle:'radial', sun:'radial',
  '放射':'radial', '辐射':'radial', '环形':'radial', '中心':'radial', '圆形':'radial', '圆环':'radial'
};
const MM_PAL_LIGHT = [
  ['#7c5cff','#a855f7'], ['#2f7cf6','#38bdf8'], ['#0e9f8a','#34d399'],
  ['#e2761b','#f59e0b'], ['#dc3f7a','#f472b6'], ['#5b6ee1','#818cf8']
];
const MM_PAL_NIGHT = [
  ['#a78bfa','#c084fc'], ['#60a5fa','#38bdf8'], ['#34d399','#6ee7b7'],
  ['#fbbf24','#f59e0b'], ['#f472b6','#fb7185'], ['#818cf8','#a5b4fc']
];
function mmNormLayout(v){
  if(!v) return null;
  const k=String(v).trim().toLowerCase();
  return MM_ALIAS[k] || (MM_LAYOUTS.some(x=>x.k===k) ? k : null);
}
function mmLayoutName(k){ const x=MM_LAYOUTS.find(y=>y.k===k); return x?x.n:'右向树'; }
function mmColor(branch,theme){
  const pal=theme==='night'?MM_PAL_NIGHT:MM_PAL_LIGHT;
  return pal[(Math.max(1,branch)-1)%pal.length];
}
function mmHexA(hex,a){
  const h=String(hex).replace('#','');
  const s=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(s,16)||0;
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function mmCleanText(t){
  return String(t||'')
    .replace(/<br\s*\/?>/gi,'\n').replace(/\\n/g,'\n')
    .replace(/\*\*([\s\S]+?)\*\*/g,'$1').replace(/\*([^*\n]+)\*/g,'$1')
    .replace(/::icon\([^)]*\)/gi,'').replace(/:::\S+/g,'')
    .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<')
    .replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'")
    .replace(/^["'「『]|["'」』]$/g,'')
    .replace(/:([a-z0-9_+\-]{1,24}):/gi,(m,k)=>{
      const v=EMOJI[k.toLowerCase()]; return v||m;
    })
    .replace(/[ \t]+/g,' ').trim();
}
/* 节点行：支持全部 Mermaid 形状 + 裸文本，前缀 id 可有可无 */
function mmParseLabel(raw){
  let s=String(raw||'').trim();
  let icon='', cls='';
  const im=s.match(/::icon\(([^)]*)\)/i); if(im) icon=im[1].trim();
  const cm=s.match(/:::([A-Za-z0-9_\-]+)\s*$/); if(cm) cls=cm[1];
  s=s.replace(/\s*::icon\([^)]*\)\s*/gi,' ').replace(/\s*:::[A-Za-z0-9_\-]+\s*$/,'').trim();
  const tries=[
    [/^([^\s()]*)\)\)([\s\S]+)\(\($/, 'bang'],
    [/^([^\s{}]*)\{\{([\s\S]+)\}\}$/,   'hexagon'],
    [/^([^\s\[\]]*)\[\[([\s\S]+)\]\]$/,'rect'],
    [/^([^\s\[\]]*)\[([\s\S]+)\]$/,    'rect'],
    [/^([^\s()]*)\(\(([\s\S]+)\)\)$/,  'circle'],
    [/^([^\s()]*)\(([\s\S]+)\)$/,      'rounded'],
    [/^([^\s()]*)\)([\s\S]+)\($/,      'cloud'],
    [/^([^\s>\]]*)>([\s\S]+)\]$/,      'banner'],
    [/^([^\s{}]*)\{([\s\S]+)\}$/,      'diamond']
  ];
  let id='', text='', shape='default';
  for(const [re,k] of tries){
    const m=s.match(re);
    if(m){ id=(m[1]||'').trim(); text=(m[2]||'').trim(); shape=k; break; }
  }
  if(shape==='default'){ text=s; id=''; }
  text=mmCleanText(text);
  if(!text) text=mmCleanText(id)||'节点';
  return {text, shape, id, icon, cls};
}
/* 主解析：返回 {root, layout, count}；非 mindmap 返回 null */
function mmParse(src){
  let text=String(src||'').replace(/\r/g,''), layout=null;
  // %%{init: {"mindmap":{"layout":"radial"}}}%%
  text=text.replace(/%%\{\s*init\s*:\s*([\s\S]*?)\s*\}%%/gi,(m,json)=>{
    try{
      const o=JSON.parse(json.replace(/,\s*([}\]])/g,'$1'));
      const c=(o&&o.mindmap)||o||{};
      layout=mmNormLayout(c.layout||c.mindmapLayout||c.direction||o.layout)||layout;
    }catch(e){}
    return '';
  });
  // %% layout: radial
  text=text.replace(/^[ \t]*%%[ \t]*(?:layout|布局|方向)[ \t]*[:：][ \t]*(\S+)[ \t]*$/gim,(m,v)=>{
    layout=mmNormLayout(v)||layout; return '';
  });
  const lines=text.split('\n');
  let start=-1;
  for(let i=0;i<lines.length;i++){
    const t=lines[i].trim();
    if(!t || t.indexOf('%%')===0) continue;
    const m=t.match(/^(?:mindmap|思维导图)(?:[-:：\s]+([\w\u4e00-\u9fa5]+))?\s*$/i);
    if(m){ layout=mmNormLayout(m[1])||layout; start=i+1; }
    else if(/^mindmap/i.test(t)){ start=i+1; }
    break;
  }
  if(start<0) return null;   // 不是 mindmap，交给官方 Mermaid

  const stack=[]; let root=null, uid=0, last=null;
  for(let i=start;i<lines.length;i++){
    const line=lines[i].replace(/\t/g,'  ');
    if(!line.trim()) continue;
    const t=line.trim();
    if(t.indexOf('%%')===0) continue;
    if(/^(classDef|class|style|click|linkStyle)\b/i.test(t)) continue;
    // 纯指令行：图标 / 类，挂在最近创建的节点上，不生成新节点
    if(/^::icon\(/i.test(t)){ if(last) last.icon=t.replace(/^::icon\(/i,'').replace(/\)$/,'').trim(); continue; }
    if(/^:::/.test(t)){ if(last) last.cls=t.slice(3).trim(); continue; }
    const indent=(line.match(/^[ \t]*/)||[''])[0].length;
    while(stack.length && indent<=stack[stack.length-1].indent) stack.pop();
    let parent=stack.length?stack[stack.length-1].node:null;
    if(!parent && root) parent=root;   // 完全不缩进时也能成树
    const p=mmParseLabel(t);
    const node={ id:'mm'+(++uid), label:p.text, shape:p.shape, icon:p.icon, cls:p.cls,
                 depth:parent?parent.depth+1:0, children:[], hidden:0, branch:0 };
    if(parent) parent.children.push(node); else root=node;
    stack.push({indent,node}); last=node;
  }
  if(!root) return null;
  let count=0; (function w(n){ count++; n.children.forEach(w); })(root);
  const assign=(n,d)=>{ n.children.forEach((c,i)=>{ c.branch=d===0?i+1:n.branch; assign(c,d+1); }); };
  assign(root,0);
  return {root, layout, count};
}

/* ---------- 尺寸测量 ---------- */
function mmMeasure(n){
  const fs=n.depth===0?15.5:(n.depth===1?13.5:12.5);
  const cu=c=>/[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef]/.test(c)?1:0.56;
  const cw=s=>Array.from(s).reduce((a,c)=>a+cu(c),0);
  // 长文本按字符宽度自动折行，避免被硬截断（中文 1 单位 / 西文 .56）
  const lines=[];
  n.label.split('\n').forEach(seg=>{
    let cur='', units=0;
    Array.from(seg).forEach(c=>{
      const u=cu(c);
      if(units+u>14 && cur){ lines.push(cur.trim()); cur=''; units=0; }
      cur+=c; units+=u;
    });
    lines.push(cur.trim());
  });
  while(lines.length>1 && !lines[lines.length-1]) lines.pop();
  if(!lines.length) lines.push('节点');
  let maxW=0; lines.forEach(l=>{ maxW=Math.max(maxW,cw(l)*fs); });
  const padX=(n.shape==='circle'||n.shape==='bang'||n.shape==='cloud')?19:16;
  let w=Math.max(48,maxW+padX*2);
  let h=Math.max(32,lines.length*fs*1.5+20);
  if(n.shape==='circle'||n.shape==='bang'||n.shape==='cloud'){
    const d=Math.max(w,h*1.18); w=d; h=Math.max(36,d*.78);
  }
  if(n.shape==='hexagon'||n.shape==='diamond'||n.shape==='banner') w+=18;
  return {w,h,fs,lines};
}
function mmVisible(root,collapsed){
  const cp=(n,d)=>{
    const o={id:n.id,label:n.label,shape:n.shape,icon:n.icon,cls:n.cls,
             branch:n.branch,depth:d,children:[],hidden:0};
    if(collapsed.has(n.id)) o.hidden=n.children.length;
    else n.children.forEach(c=>o.children.push(cp(c,d+1)));
    return o;
  };
  return cp(root,0);
}

/* ---------- 六种布局 ---------- */
function mmCompute(root,layout,theme){
  const all=[]; (function w(n){ all.push(n); n.children.forEach(w); })(root);
  all.forEach(n=>{ n.m=mmMeasure(n); });
  const maxD=all.reduce((a,n)=>Math.max(a,n.depth),0);
  const lw=[],lh=[];
  all.forEach(n=>{ lw[n.depth]=Math.max(lw[n.depth]||0,n.m.w); lh[n.depth]=Math.max(lh[n.depth]||0,n.m.h); });
  const GX=72, GY=16;
  const xs=[], ys=[]; let cx=0, cy=0;
  for(let d=0;d<=maxD;d++){ xs[d]=cx; cx+=(lw[d]||60)+GX; }
  for(let d=0;d<=maxD;d++){ ys[d]=cy; cy+=(lh[d]||34)+GX; }

  if(layout==='right'||layout==='left'){
    let cur=0;
    const place=n=>{
      n.x=xs[n.depth]+n.m.w/2;
      if(!n.children.length){ n.y=cur+n.m.h/2; cur+=n.m.h+GY; }
      else{ n.children.forEach(place); n.y=(n.children[0].y+n.children[n.children.length-1].y)/2; }
    };
    place(root);
    if(layout==='left'){
      const total=cx-GX;
      all.forEach(n=>{ n.x=total-n.x; });
    }
  }
  else if(layout==='down'||layout==='up'){
    let cur=0;
    const place=n=>{
      n.y=ys[n.depth]+n.m.h/2;
      if(!n.children.length){ n.x=cur+n.m.w/2; cur+=n.m.w+GY; }
      else{ n.children.forEach(place); n.x=(n.children[0].x+n.children[n.children.length-1].x)/2; }
    };
    place(root);
    if(layout==='up'){
      const total=cy-GX;
      all.forEach(n=>{ n.y=total-n.y; });
    }
  }
  else if(layout==='split'){
    const kids=root.children.slice();
    const half=Math.ceil(kids.length/2);
    const L=kids.slice(0,half), R=kids.slice(half);
    const off=[]; let o=0;
    for(let d=1;d<=maxD;d++){ off[d]=o; o+=(lw[d]||60)+GX; }
    const base=root.m.w/2+62;
    root.x=0; root.y=0;
    const placeSide=(list,sign)=>{
      let cur=0;
      const place=(n,d)=>{
        n.x=sign*(base+(off[d]||0)+n.m.w/2);
        if(!n.children.length){ n.y=cur+n.m.h/2; cur+=n.m.h+GY; }
        else{ n.children.forEach(c=>place(c,d+1)); n.y=(n.children[0].y+n.children[n.children.length-1].y)/2; }
      };
      list.forEach(n=>place(n,1));
      const shift=-cur/2;
      const move=n=>{ n.y+=shift; n.children.forEach(move); };
      list.forEach(move);
    };
    placeSide(L,-1); placeSide(R,1);
  }
  else{ // radial 中心放射
    const radii=[]; let r=root.m.w/2+94;
    for(let d=1;d<=maxD;d++){ radii[d]=r; r+=Math.max(lw[d]||60,lh[d]||34)*.82+92; }
    root.x=0; root.y=0;
    const kids=root.children, nk=kids.length||1, step=2*Math.PI/nk;
    const place=(n,a0,a1,d)=>{
      const a=(a0+a1)/2;
      n.x=radii[d]*Math.cos(a); n.y=radii[d]*Math.sin(a);
      const ch=n.children;
      if(ch.length){
        const sub=(a1-a0)/ch.length;
        ch.forEach((c,i)=>place(c,a0+i*sub,a0+(i+1)*sub,d+1));
      }
    };
    kids.forEach((c,i)=>{
      const a=-Math.PI/2+step*i;
      place(c,a-step/2,a+step/2,1);
    });
  }

  // bounds
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  all.forEach(n=>{
    minX=Math.min(minX,n.x-n.m.w/2); maxX=Math.max(maxX,n.x+n.m.w/2);
    minY=Math.min(minY,n.y-n.m.h/2); maxY=Math.max(maxY,n.y+n.m.h/2);
  });
  const PAD=30;
  minX-=PAD; minY-=PAD; maxX+=PAD; maxY+=PAD;
  const W=Math.max(120,maxX-minX), H=Math.max(90,maxY-minY);

  // edges
  const edges=[];
  const addEdge=(p,c)=>{
    const dx=c.x-p.x, dy=c.y-p.y;
    let d;
    if(layout==='radial'){
      const L=Math.hypot(dx,dy)||1;
      const qx=(p.x+c.x)/2-dy/L*12, qy=(p.y+c.y)/2+dx/L*12;
      d='M '+p.x.toFixed(1)+' '+p.y.toFixed(1)+' Q '+qx.toFixed(1)+' '+qy.toFixed(1)+' '+c.x.toFixed(1)+' '+c.y.toFixed(1);
    }else if(layout==='down'||layout==='up'){
      const sg=Math.sign(dy)||1;
      const sy=p.y+sg*p.m.h/2, ey=c.y-sg*c.m.h/2, mid=(sy+ey)/2;
      d='M '+p.x.toFixed(1)+' '+sy.toFixed(1)+' C '+p.x.toFixed(1)+' '+mid.toFixed(1)+', '+
        c.x.toFixed(1)+' '+mid.toFixed(1)+', '+c.x.toFixed(1)+' '+ey.toFixed(1);
    }else{
      const sg=Math.sign(dx)||1;
      const sx=p.x+sg*p.m.w/2, ex=c.x-sg*c.m.w/2, mid=(sx+ex)/2;
      d='M '+sx.toFixed(1)+' '+p.y.toFixed(1)+' C '+mid.toFixed(1)+' '+p.y.toFixed(1)+', '+
        mid.toFixed(1)+' '+c.y.toFixed(1)+', '+ex.toFixed(1)+' '+c.y.toFixed(1);
    }
    edges.push({d, branch:c.branch||p.branch||1, w:c.depth<=1?2.4:1.7});
  };
  (function w(n){ n.children.forEach(c=>{ addEdge(n,c); w(c); }); })(root);
  return {nodes:all,edges,W,H,minX,minY,layout,theme};
}

/* ---------- 形状路径 ---------- */
function mmShape(shape,x,y,w,h){
  const l=x-w/2,r=x+w/2,t=y-h/2,b=y+h/2, f=v=>v.toFixed(1);
  switch(shape){
    case 'rect':    return '<rect class="mm-shape" x="'+f(l)+'" y="'+f(t)+'" width="'+f(w)+'" height="'+f(h)+'" rx="9"/>';
    case 'rounded': return '<rect class="mm-shape" x="'+f(l)+'" y="'+f(t)+'" width="'+f(w)+'" height="'+f(h)+'" rx="'+f(h/2)+'"/>';
    case 'circle':  return '<ellipse class="mm-shape" cx="'+f(x)+'" cy="'+f(y)+'" rx="'+f(w/2)+'" ry="'+f(h/2)+'"/>';
    case 'hexagon': return '<polygon class="mm-shape" points="'+
      [ [l+w*.16,t],[r-w*.16,t],[r,y],[r-w*.16,b],[l+w*.16,b],[l,y] ].map(p=>f(p[0])+','+f(p[1])).join(' ')+'"/>';
    case 'diamond': return '<polygon class="mm-shape" points="'+
      [[x,t],[r,y],[x,b],[l,y]].map(p=>f(p[0])+','+f(p[1])).join(' ')+'"/>';
    case 'bang': {
      const pts=[]; for(let i=0;i<16;i++){
        const a=-Math.PI/2+i*Math.PI/8, k=i%2?0.72:1;
        pts.push(f(x+Math.cos(a)*w/2*k)+','+f(y+Math.sin(a)*h/2*k));
      }
      return '<polygon class="mm-shape" points="'+pts.join(' ')+'"/>';
    }
    case 'cloud': return '<path class="mm-shape" d="M '+f(l+w*.17)+' '+f(b)+
      ' Q '+f(l)+' '+f(b)+' '+f(l)+' '+f(y+h*.12)+
      ' Q '+f(l)+' '+f(t)+' '+f(x-w*.2)+' '+f(t)+
      ' Q '+f(x)+' '+f(t-h*.22)+' '+f(x+w*.2)+' '+f(t)+
      ' Q '+f(r)+' '+f(t)+' '+f(r)+' '+f(y+h*.12)+
      ' Q '+f(r)+' '+f(b)+' '+f(r-w*.17)+' '+f(b)+' Z"/>';
    case 'banner': return '<path class="mm-shape" d="M '+f(l)+' '+f(t)+' H '+f(r-w*.14)+
      ' L '+f(r)+' '+f(y)+' L '+f(r-w*.14)+' '+f(b)+' H '+f(l)+' Z"/>';
    default: return '<rect class="mm-shape" x="'+f(l)+'" y="'+f(t)+'" width="'+f(w)+
      '" height="'+f(h)+'" rx="'+f(Math.min(12,h/2))+'"/>';
  }
}

/* ---------- SVG 组装 ---------- */
function mmSVG(L){
  const dark=L.theme==='night';
  const uid='mmg'+(++mmUid);
  const rc1=dark?'#a78bfa':'#7c5cff', rc2=dark?'#c084fc':'#a855f7';
  const fg=dark?'#e8ecf8':'#242a3d';
  let defs='<defs><linearGradient id="'+uid+'root" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0" stop-color="'+rc1+'"/><stop offset="1" stop-color="'+rc2+'"/></linearGradient></defs>';
  let ep='';
  L.edges.forEach(e=>{
    const c=mmColor(e.branch,L.theme)[0];
    ep+='<path class="mm-edge" d="'+e.d+'" stroke="'+c+'" stroke-opacity="'+(dark?'.5':'.42')+
      '" stroke-width="'+e.w+'"/>';
  });
  let np='';
  L.nodes.forEach(o=>{
    const isRoot=o.depth===0, col=isRoot?[rc1,rc2]:mmColor(o.branch,L.theme);
    const fill=isRoot?'url(#'+uid+'root)':mmHexA(col[0],o.depth===1?.19:.10);
    const stroke=isRoot?'none':col[0];
    const sw=isRoot?0:(o.depth===1?2:1.4);
    const m=o.m, lh=m.fs*1.45, y0=o.y-(m.lines.length-1)*lh/2;
    const tspans=m.lines.map((l,i)=>'<tspan x="'+o.x.toFixed(1)+'" y="'+(y0+i*lh).toFixed(1)+'">'+
      esc(l)+'</tspan>').join('');
    const hasKids=o.children.length>0||o.hidden>0;
    let badge='';
    if(o.hidden>0){
      const bx=o.x+m.w/2-3, by=o.y-m.h/2+3;
      badge='<circle cx="'+bx.toFixed(1)+'" cy="'+by.toFixed(1)+'" r="9" fill="'+col[0]+'" stroke="none"/>'+
        '<text x="'+bx.toFixed(1)+'" y="'+(by+.5).toFixed(1)+'" fill="#fff" font-size="9" '+
        'font-weight="800" stroke="none">+'+o.hidden+'</text>';
    }else if(o.icon){
      const bx=o.x+m.w/2-2, by=o.y-m.h/2+2;
      badge='<circle cx="'+bx.toFixed(1)+'" cy="'+by.toFixed(1)+'" r="7" fill="'+col[0]+'" stroke="none"/>'+
        '<text x="'+bx.toFixed(1)+'" y="'+(by+.5).toFixed(1)+'" fill="#fff" font-size="8" '+
        'stroke="none">✦</text>';
    }
    np+='<g class="mm-node" data-mm-id="'+o.id+'" data-mm-haskids="'+(hasKids?1:0)+
      '" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'">'+
      mmShape(o.shape,o.x,o.y,m.w,m.h)+
      '<text fill="'+(isRoot?'#fff':fg)+'" stroke="none" font-size="'+m.fs+
      '" font-weight="'+(isRoot?750:(o.depth===1?650:500))+'" text-anchor="middle" '+
      'dominant-baseline="middle">'+tspans+'</text>'+badge+'</g>';
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+L.minX.toFixed(1)+' '+L.minY.toFixed(1)+' '+
    L.W.toFixed(1)+' '+L.H.toFixed(1)+'" width="'+Math.round(L.W)+'" height="'+Math.round(L.H)+
    '" class="mm-svg" font-family="-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,\'PingFang SC\',\'Microsoft YaHei\',sans-serif">'+
    defs+'<g>'+ep+'</g><g>'+np+'</g></svg>';
}

/* ---------- 卡片绘制与交互 ---------- */
function drawMindmapCard(card){
  const src=card._mmSrc||'';
  const parsed=mmParse(src);
  if(!parsed||!parsed.root) return;
  const layout=card.dataset.mmLayout||parsed.layout||S.mmLayout||'right';
  const collapsed=card._mmCollapsed||(card._mmCollapsed=new Set());
  const vis=mmVisible(parsed.root,collapsed);
  const theme=(output&&output.dataset.theme)||S.theme||'white';
  const L=mmCompute(vis,layout,theme);
  const canvas=card.querySelector('.mm-canvas'); if(!canvas) return;
  canvas.innerHTML=mmSVG(L);
  const svg=canvas.querySelector('svg');
  let sc=Number(card.dataset.mmScale);
  // 默认适应容器宽度，保证首屏看到完整结构；点「＋」可放大到 1:1 看细节
  if(!sc || !isFinite(sc)){
    const avail=(canvas && canvas.clientWidth) || (output && output.clientWidth) || 340;
    sc=Math.min(1,Math.max(.42,(avail-10)/Math.max(1,L.W)));
    card.dataset.mmScale=sc.toFixed(3);
  }
  if(svg){
    svg.style.width=Math.round(L.W*sc)+'px';
    svg.style.height='auto'; svg.removeAttribute('height');
  }
  const wrap=card.parentElement||card;
  const lb=wrap.querySelector('.mm-layout-btn');
  if(lb) lb.textContent=MM_LAYOUTS.find(x=>x.k===layout).i+' '+mmLayoutName(layout)+' ▾';
  const menu=card.querySelector('.mm-menu');
  if(menu) menu.querySelectorAll('[data-mm-layout]').forEach(b=>b.classList.toggle('on',b.dataset.mmLayout===layout));
  const cap=card.querySelector('.mm-cap');
  if(cap) cap.innerHTML='<span class="mm-dot"></span>思维导图 · <b>'+mmLayoutName(layout)+
    '</b> · '+parsed.count+' 个节点<span class="mm-dot"></span>可左右滑动 / 缩放<span class="mm-dot"></span>点击节点折叠';
  // 记住当前状态，供下一次实时渲染恢复
  if(src) mmPersist[mmSrcKey(src)]={
    layout, scale:String(sc), collapsed:Array.from(collapsed)
  };
}
function renderMindmapCard(card,src,parsed){
  card.classList.add('mm-card');
  const old=card.querySelector('.mermaid'); if(old) old.remove();
  const saved=mmPersist[mmSrcKey(src)];
  card._mmSrc=src;
  card._mmCollapsed=new Set(saved&&saved.collapsed?saved.collapsed:[]);
  card.dataset.mmLayout=(saved&&saved.layout)||parsed.layout||S.mmLayout||'right';
  if(saved&&saved.scale) card.dataset.mmScale=saved.scale;
  let canvas=card.querySelector('.mm-canvas');
  if(!canvas){ canvas=document.createElement('div'); canvas.className='mm-canvas'; card.appendChild(canvas); }
  let cap=card.querySelector('.mm-cap');
  if(!cap){ cap=document.createElement('div'); cap.className='mm-cap'; card.appendChild(cap); }
  let menu=card.querySelector('.mm-menu');
  if(!menu){
    menu=document.createElement('div'); menu.className='mm-menu';
    menu.innerHTML=MM_LAYOUTS.map(x=>'<button type="button" data-mm-layout="'+x.k+
      '"><i>'+x.i+'</i>'+x.n+'</button>').join('');
    card.appendChild(menu);
  }
  drawMindmapCard(card);
}
function redrawMindmaps(newLayout){
  output.querySelectorAll('.mermaid-card.mm-card').forEach(card=>{
    if(newLayout){ card.dataset.mmLayout=newLayout; delete card.dataset.mmScale; }
    drawMindmapCard(card);
  });
}

/* ---------- Mermaid 按需加载 ---------- */
function loadMermaid(){
  if(window.mermaid) return Promise.resolve(window.mermaid);
  if(mermaidLoading) return mermaidLoading;
  mermaidLoading = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
    s.onload=()=>res(window.mermaid); s.onerror=()=>rej(new Error('Mermaid 加载失败'));
    document.head.appendChild(s);
  });
  return mermaidLoading;
}
function mmShowSource(card,src,reason){
  card.classList.remove('mm-card');
  card.innerHTML='<pre class="m-err">'+esc(src)+'</pre>'+
    (reason?'<div class="mm-cap">'+esc(reason)+'</div>':'');
  const tools=card.parentElement && card.parentElement.querySelector('.mm-tools');
  if(tools) tools.remove();
}
async function enhanceMermaid(root){
  const cards=Array.from(root.querySelectorAll('.mermaid-card'));
  if(!cards.length) return;
  if(!S.mermaid){
    cards.forEach(card=>{
      const n=card.querySelector('.mermaid'); const src=n?n.textContent:'';
      mmShowSource(card,src,'图表渲染已在设置中关闭');
    });
    return;
  }
  const official=[];
  cards.forEach(card=>{
    const node=card.querySelector('.mermaid');
    if(!node) return;
    const src=node.textContent;
    let parsed=null;
    try{ parsed=mmParse(src); }catch(e){ parsed=null; }
    if(parsed && parsed.root){
      try{ renderMindmapCard(card,src,parsed); }
      catch(e){ mmShowSource(card,src,'思维导图渲染失败：'+e.message); }
    }else{
      official.push({card,node,src});
    }
  });
  if(!official.length) return;
  try{
    const mm=await loadMermaid();
    if(!mmInited){
      mm.initialize({ startOnLoad:false, theme:'base', securityLevel:'loose',
        themeVariables:{ primaryColor:'#f3f0ff', primaryTextColor:'#2b2f45', primaryBorderColor:'#7c5cff',
          lineColor:'#8b7bd8', secondaryColor:'#e8f6ff', tertiaryColor:'#ffffff', fontSize:'14px' } });
      mmInited=true;
    }
    // 逐张渲染：任何一张语法出错都不会拖垮其它图
    for(const o of official){
      try{
        o.node.textContent=o.src;
        o.node.className='mermaid';
        o.node.removeAttribute('data-processed');
        await mm.run({ nodes:[o.node] });
        if(!o.node.querySelector('svg')) throw new Error('未生成图形');
      }catch(err){
        mmShowSource(o.card,o.src,'该图无法解析，已显示源码（其它图不受影响）');
      }
    }
  }catch(e){
    official.forEach(o=>mmShowSource(o.card,o.src,'图表组件加载失败，已显示源码'));
    toast('图表组件加载失败，已显示源码', true);
  }
}

/* ---------- DOM 精加工 ---------- */
function enhanceDOM(root, st){
  // 表格：圆角卡片 + 横向滚动
  root.querySelectorAll('table').forEach(t=>{
    const shell=document.createElement('div'); shell.className='table-shell';
    const wrap=document.createElement('div'); wrap.className='table-wrap';
    const hint=document.createElement('span'); hint.className='table-hint'; hint.textContent='← 滑动查看 →';
    t.parentNode.insertBefore(shell,t);
    shell.appendChild(wrap); wrap.appendChild(t); shell.appendChild(hint);
    requestAnimationFrame(()=>{ if(wrap.scrollWidth > wrap.clientWidth+4) shell.classList.add('scrollable'); });
  });
  // 表标题 Table: xxx → 挂进最近的表格卡片
  root.querySelectorAll('.table-caption').forEach(cap=>{
    const prev=cap.previousElementSibling;
    if(prev && prev.classList.contains('table-shell')) prev.appendChild(cap);
    else { const near=root.querySelectorAll('.table-shell'); if(near.length) near[near.length-1].appendChild(cap); }
  });
  // 图片：画框 + 说明 + 自定义尺寸
  root.querySelectorAll('img').forEach(img=>{
    const fig=document.createElement('figure'); fig.className='img-frame';
    img.parentNode.insertBefore(fig,img); fig.appendChild(img);
    const alt=img.getAttribute('alt');
    if(alt){ const cap=document.createElement('figcaption'); cap.textContent=alt; fig.appendChild(cap); }
    const size=(st.imgSizes||[]).find(x=>x.src===img.getAttribute('src'));
    if(size){
      img.setAttribute('width',size.w);
      if(size.h) img.setAttribute('height',size.h);
      img.style.maxWidth='100%'; img.style.height='auto';
    }
    img.addEventListener('click',()=>{ $('lbImg').src=img.src; $('lightbox').classList.add('show'); });
  });
  // 任务列表 + 取消 / 进行中状态
  root.querySelectorAll('.task-state').forEach(mark=>{
    const li=mark.closest('li');
    if(li){ li.classList.add('task-item','task-'+(mark.dataset.s==='cancel'?'cancel':'progress')); }
    mark.remove();
  });
  root.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    const li=cb.closest('li'); if(!li) return;
    li.classList.add('task-item');
    if(li.parentElement) li.parentElement.classList.add('task-list');
  });
  // 外链
  root.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href')||'';
    if(/^https?:\/\//i.test(href)){
      a.classList.add('ext'); a.setAttribute('target','_blank'); a.setAttribute('rel','noopener noreferrer');
    }
  });
  // 剧透：点击揭示
  root.querySelectorAll('.spoiler').forEach(sp=>{
    sp.addEventListener('click',()=>{ sp.classList.add('revealed'); buzz(); });
  });
  // 缩写：手机无 hover，点击弹出释义气泡
  root.querySelectorAll('abbr.pv-abbr').forEach(a=>{
    const toggle=e=>{
      e.preventDefault(); e.stopPropagation();
      const was=a.classList.contains('open');
      root.querySelectorAll('abbr.pv-abbr.open').forEach(x=>x.classList.remove('open'));
      if(!was){ a.classList.add('open'); buzz(); }
    };
    a.addEventListener('click',toggle);
    a.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ toggle(e); } });
  });
  // 标题：自定义 id / 稳定 id + 目录数据
  tocData=[];
  root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach((h,i)=>{
    const anchor=h.querySelector('.h-anchor');
    if(anchor){ h.id=anchor.dataset.id||('sec-'+i); anchor.remove(); }
    else h.id='sec-'+i;
    h.setAttribute('data-toc-id',h.id);
    tocData.push({ id:h.id, lv:Number(h.tagName.charAt(1)), text:h.textContent.trim()||'（无标题）' });
  });
  // 文档内 [TOC] 填充（在目录数据生成之后）
  root.querySelectorAll('.inline-toc .it-list').forEach(box=>{
    box.innerHTML= tocData.length
      ? tocData.map((d,i)=>'<button class="it-item lv'+d.lv+(i===0?' on':'')+'" data-toc="'+esc(d.id)+'">'+esc(d.text)+'</button>').join('')
      : '<span class="it-empty">暂无标题</span>';
  });
}

function gotoHeading(id){

    const y=el.getBoundingClientRect().top-base+output.scrollTop-14;

      document.querySelectorAll('.it-item').forEach((n,j)=>n.classList.toggle('on',j===i));

/* ---------- 渲染主流程 ---------- */
function buildMathNode(m){
  if(m.display){
    const box=document.createElement('div'); box.className='math-block';
    const lab=document.createElement('span'); lab.className='math-label';
    lab.textContent='∑\u00A0公式';   // 不换行空格，导出时也不会被拆成两行
    const src=document.createElement('div'); src.className='math-src'; src.textContent='\\['+m.body+'\\]';
    box.appendChild(lab); box.appendChild(src); return box;
  }
  const sp=document.createElement('span'); sp.textContent='\\('+m.body+'\\)'; return sp;
}
function typesetMath(root){
  if(!S.math) return Promise.resolve();
  const run = ()=> MathJax.typesetPromise([root]).catch(e=>console.warn('MathJax:',e));
  if(window.MathJax && MathJax.typesetPromise) return run();
  return new Promise(res=>{
    let waited=0;
    const t=setInterval(()=>{
      waited+=150;
      if(window.MathJax && MathJax.typesetPromise){ clearInterval(t); run().then(res); }
      else if(waited>12000){ clearInterval(t); toast('公式引擎未加载，已显示源码',true); res(); }
    },150);
  });
}
async function render(){
  const seq = ++renderSeq;
  status('渲染中…', '#f59e0b');
  const t0 = performance.now();
  try{
    if(!window.marked) throw new Error('Marked 组件未加载，请检查网络');
    const src = editor.value;
    if(!src.trim()){
      output.innerHTML = '<div class="empty"><div class="art">✎</div><h3>还没有内容</h3><p>写下第一行 Markdown，或点右上角 ❓ 打开 16 章指南、载入 v5 全语法演示。</p><button id="emptySample">载入示例文档</button><button id="emptyV5" style="margin-left:8px;background:rgba(124,92,255,.18)">v5 全语法演示</button></div>';
      $('emptySample').onclick = ()=>{ editor.value=SAMPLE; isSample=true; pushHistory(); saveDoc(); render(); toast('已载入示例'); };
      $('demoHint').hidden = true;
      tocData=[]; lastRenderedSrc=src; updateStats(); status('等待输入', '#8a92a8'); return;
    }
    const st = { code:[], icode:[], math:[], raw:[], abbrs:[], imgSizes:[], tocCount:0 };
    const html = compile(src, st);
    captureMindmapStates();          // 先记下每张图当前的布局 / 折叠 / 缩放
    output.innerHTML = marked.parse(html);
    lastRenderedSrc = src;

    // 多轮解析：容器内还会嵌套容器 / 代码块 / 公式，逐轮把新注入的占位符展开
    const jobs=[];
    st.raw.forEach((h,i)=>jobs.push({ t:tk('R',i), make:()=>rawFragment(h), block:true }));
    for(let i=0;i<st.tocCount;i++) jobs.push({ t:tk('T',i), make:()=>{
      const d=document.createElement('nav'); d.className='inline-toc';
      d.innerHTML='<div class="it-t">目录 · CONTENTS</div><div class="it-list"></div>';
      return d;
    }, block:true });
    st.code.forEach((b,i)=>jobs.push({ t:tk('C',i), make:()=>buildCodeBlock(b), block:true }));
    st.icode.forEach((s,i)=>jobs.push({ t:tk('I',i), make:()=>{
      const el=document.createElement('code'); el.textContent=s; return el;
    }, block:false }));
    st.math.forEach((m,i)=>jobs.push({ t:tk('M',i), make:()=>buildMathNode(m), block:m.display }));
    for(let pass=0; pass<8; pass++){
      let changed=false;
      jobs.forEach(j=>{ if(replaceToken(output,j.t,j.make,j.block)) changed=true; });
      if(!changed) break;
    }
    // 清理极端情况下残留的占位符（直接改文本节点，不重建 DOM）
    const tw=document.createTreeWalker(output,NodeFilter.SHOW_TEXT);
    const leftovers=[]; let tn;
    while((tn=tw.nextNode())) if(tn.nodeValue.indexOf(PA)>=0) leftovers.push(tn);
    leftovers.forEach(n=>{ n.nodeValue=n.nodeValue.replace(/\uE000TK:[A-Z]+[^\uE001]*\uE001/g,''); });

    enhanceDOM(output, st);
    enhanceCodeBlocks(output);
    if(seq!==renderSeq) return;
    updateStats();
    const ms = (performance.now()-t0).toFixed(0);
    status('渲染完成 · '+ms+' ms', '#3ddc97');
    $('demoHint').hidden = !isSample;
    typesetMath(output);
    enhanceMermaid(output);
    if(sheetPage==='toc' || sheetPage==='stats') renderSheet();
  }catch(err){
    console.error(err); status('渲染出错', '#ff6b78'); toast('渲染出错：'+err.message, true);
  }
}

/* ---------- 统计 ---------- */
function calcStats(){
  const v=editor.value;
  const cjk=(v.match(/[\u3400-\u9fff]/g)||[]).length;
  const en=(v.replace(/[\u3400-\u9fff]/g,' ').match(/[A-Za-z0-9_'-]+/g)||[]).length;
  return {
    chars:v.length, words:cjk+en, lines:v?v.split('\n').length:0,
    paras:(v.split(/\n\s*\n/).filter(s=>s.trim()).length),
    heads:(v.match(/^#{1,6}\s/gm)||[]).length,
    codes:(v.match(/^(`{3,}|~{3,})/gm)||[]).length/2,
    maths:(v.match(/\$\$|\$\(|\\\(|\\\[/g)||[]).length,
    tables:(v.match(/^\|.+\|\s*$/gm)||[]).length,
    imgs:(v.match(/!\[[^\]]*\]\(/g)||[]).length,
    links:((v.match(/\[[^\]]+\]\(/g)||[]).length) - ((v.match(/!\[[^\]]*\]\(/g)||[]).length),
    notes:(v.match(/^\[\^[^\]]+\]:/gm)||[]).length,
    mins:Math.max(1, Math.ceil((cjk+en)/350))
  };
}
function updateStats(){
  const s=calcStats();
  $('statusStat').textContent = s.words.toLocaleString()+' 字 · 约 '+s.mins+' 分钟';
}

/* ---------- 查找替换 ---------- */
function doFind(dir){
  const q=$('findQ') ? $('findQ').value : '';
  const res=$('findRes');
  if(!q){ findMatches=[]; findAt=-1; if(res) res.textContent='输入关键词开始查找'; return; }
  const v=editor.value.toLowerCase(), ql=q.toLowerCase();
  findMatches=[]; let i=-1;
  while((i=v.indexOf(ql,i+1))>=0){ findMatches.push(i); if(findMatches.length>999) break; }
  if(!findMatches.length){ findAt=-1; if(res) res.textContent='没有找到匹配内容'; return; }
  if(findAt<0 || findAt>=findMatches.length) findAt=0;
  else findAt=(findAt+dir+findMatches.length)%findMatches.length;
  const p=findMatches[findAt];
  if(document.body.dataset.view==='preview') setView('edit');
  editor.focus(); editor.setSelectionRange(p, p+q.length);
  if(res) res.textContent='第 '+(findAt+1)+' / '+findMatches.length+' 处匹配';
}
function doReplace(all){
  const q=$('findQ') ? $('findQ').value : '', r=$('findR') ? $('findR').value : '';
  if(!q){ toast('请先输入查找内容',true); return; }
  const a=editor.selectionStart,b=editor.selectionEnd;
  if(all){
    const n=editor.value.split(q).length-1;
    editor.value=editor.value.split(q).join(r);
    editor.dispatchEvent(new Event('input',{bubbles:true}));
    toast('已替换 '+n+' 处');
  }else{
    if(editor.value.slice(a,b).toLowerCase()!==q.toLowerCase()){ toast('请先选中一处匹配',true); return; }
    editor.setRangeText(r,a,b,'end');
    editor.dispatchEvent(new Event('input',{bubbles:true}));
    toast('已替换 1 处');
  }
  findMatches=[]; findAt=-1;
}

/* ---------- 快照 ---------- */
function saveSnap(){
  const v=editor.value;
  if(!v.trim()){ toast('内容为空，无法保存快照',true); return; }
  if(v.length>60000){ toast('内容过长，快照最多支持约 6 万字符',true); return; }
  const title=(v.match(/^#{1,6}\s*(.+)$/m)||[])[1] || v.replace(/\s+/g,' ').slice(0,24);
  snaps.unshift({id:Date.now(), t:new Date().toLocaleString('zh-CN'), title:title.slice(0,30), text:v});
  snaps=snaps.slice(0,10);
  try{ localStorage.setItem(K.snaps, JSON.stringify(snaps)); }catch(e){ toast('本地空间不足，请删除旧快照',true); }
  toast('快照已保存'); renderSheet();
}

/* 独立 HTML 不含渲染引擎，因此预先把 6 种布局的 SVG 全部内嵌，
   用一个轻量脚本切换显示，导出后照样能换样式。超大图只保留当前布局。 */
function buildExportMindmaps(bodyHTML){
  const tmp=document.createElement('div'); tmp.innerHTML=bodyHTML;
  const live=Array.from(output.querySelectorAll('.mermaid-card.mm-card'));
  const cards=Array.from(tmp.querySelectorAll('.mermaid-card.mm-card'));
  cards.forEach((card,i)=>{
    const l=live[i]; if(!l || !l._mmSrc) return;
    let parsed=null; try{ parsed=mmParse(l._mmSrc); }catch(e){}
    if(!parsed || !parsed.root) return;
    const cur=l.dataset.mmLayout||parsed.layout||S.mmLayout||'right';
    // 静态快照里没有节点折叠交互：默认给完整树，除非用户关掉了导图分支开关
    const collapsed=S.reveal.mindmap ? new Set() : (l._mmCollapsed||new Set());
    const theme=(output&&output.dataset.theme)||S.theme||'white';
    const layouts=parsed.count>60 ? [cur] : MM_LAYOUTS.map(x=>x.k);
    let views='';
    layouts.forEach(k=>{
      const vis=mmVisible(parsed.root,collapsed);
      const L=mmCompute(vis,k,theme);
      views+='<div class="mm-view" data-l="'+k+'" style="display:'+(k===cur?'block':'none')+'">'+
        mmSVG(L)+'</div>';
    });
    const canvas=card.querySelector('.mm-canvas');
    if(canvas) canvas.innerHTML=views;
    const menu=card.querySelector('.mm-menu'); if(menu) menu.remove();
    if(layouts.length>1){
      const bar=document.createElement('div'); bar.className='mm-export-bar';
      bar.innerHTML=MM_LAYOUTS.map(x=>'<button type="button" data-mmswitch="'+x.k+'"'+
        (x.k===cur?' class="on"':'')+'>'+x.i+' '+x.n+'</button>').join('');
      if(canvas) card.insertBefore(bar,canvas); else card.appendChild(bar);
    }
    const cap=card.querySelector('.mm-cap');
    if(cap) cap.innerHTML='<span class="mm-dot"></span>思维导图 · <b>'+mmLayoutName(cur)+
      '</b> · '+parsed.count+' 个节点'+
      (layouts.length>1?'<span class="mm-dot"></span>点上方按钮切换布局':'');
  });
  return tmp;
}

function shareFile(blob, name){
  if(!navigator.share || !navigator.canShare){ download(blob,name); toast('已下载文件'); return; }
  const file=new File([blob],name,{type:blob.type});
  if(!navigator.canShare({files:[file]})){ download(blob,name); toast('当前浏览器不支持分享，已下载'); return; }
  navigator.share({files:[file], title:docTitle()})
    .then(()=>toast('已调起系统分享'))
    .catch(()=>{ download(blob,name); toast('分享未完成，已改为下载'); });
}

/* ---------- 高清长图导出 ---------- */
async function exportImage(preferShare){
  if(!output.querySelector('h1,h2,h3,p,table,ul,ol,blockquote,hr,.code-block-wrapper,.math-block,.admonition,.img-frame,.mermaid-card')){
    toast('预览区为空，无法导出',true); return;
  }
  if(!window.htmlToImage){ toast('导出组件未加载，请检查网络',true); return; }
  const fab=$('btnExport'), orig=fab.innerHTML;
  fab.classList.add('busy'); fab.innerHTML='<span class="spin"></span>';
  status('正在生成图片…','#38bdf8');
  let stage=null;
  try{
    const R=S.reveal||DEF_REVEAL;
    let W = Math.min(1600, Math.max(400, Number(S.exportWidth)||720));
    // 超宽布局（向下树 / 双侧 / 放射）适度加宽画布，避免 SVG 等比缩小后文字过小
    let mmMax=0;
    output.querySelectorAll('.mm-svg').forEach(s=>{
      const vb=(s.getAttribute('viewBox')||'').split(/\s+/).map(Number);
      if(vb.length===4 && isFinite(vb[2]) && vb[2]>mmMax) mmMax=vb[2];
    });
    // 若导出时展开全部导图层级，按完整树重新估算宽度，避免文字被压小
    if(R.mindmap){
      output.querySelectorAll('.mermaid-card.mm-card').forEach(card=>{
        if(!card._mmSrc) return;
        let p=null; try{ p=mmParse(card._mmSrc); }catch(e){}
        if(!p||!p.root) return;
        const L=mmCompute(mmVisible(p.root,new Set()),card.dataset.mmLayout||p.layout||S.mmLayout||'right','white');
        if(L.W>mmMax) mmMax=L.W;
      });
    }
    if(mmMax>0) W=Math.min(1600,Math.max(W,Math.round(mmMax+(W>=900?128:80))));
    const FS = Math.min(40, Math.max(9, Number(S.exportSize)||15));
    const want = Math.min(6, Math.max(1, Number(S.exportRatio)||2));
    stage=document.createElement('div');
    stage.style.cssText='position:fixed;left:-200000px;top:0;pointer-events:none;z-index:-1;';
    const cap=document.createElement('div');
    cap.className='export-compact preview-body';
    cap.setAttribute('data-theme','white');
    cap.style.cssText='width:'+W+'px;padding:44px '+(W>=900?'64px':'40px')+' 34px;background:#fff;color:#24292f;'+
      'font-size:'+FS+'px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;'+
      '--pv-bg:#fff;--pv-fg:#24292f;--pv-soft:#4d566e;--pv-mute:#8a92a8;--pv-line:#e7eaf3;--pv-line2:#f0f2f8;'+
      '--pv-card:#f8f9fd;--pv-tint:#f4f1ff;--pv-accent:#7c5cff;--pv-accent2:#38bdf8;--pv-inline-bg:#f3efff;--pv-inline-fg:#6b37d6;';
    const clone=output.cloneNode(true);
    clone.removeAttribute('id');
    clone.setAttribute('data-theme','white');
    clone.style.cssText='padding:0;margin:0;overflow:visible;min-height:0;flex:none;background:transparent;';
    clone.querySelectorAll('script').forEach(s=>s.remove());
    // 「∑ 公式」是纯装饰角标，长图里移除，避免不同字号/宽度下折行溢出
    clone.querySelectorAll('.math-label').forEach(n=>n.remove());
    clone.querySelectorAll('.mm-btn,.mm-tools,.mm-menu').forEach(n=>n.remove());
    // 按开关把交互隐藏文本直接印出来：缩写释义 / 剧透 / 折叠区块 / 长代码
    applyRevealBasics(clone, true);
    // 思维导图：开启时用完整树重绘，关闭时保留当前折叠状态
    if(R.mindmap){
      const live=Array.from(output.querySelectorAll('.mermaid-card.mm-card'));
      Array.from(clone.querySelectorAll('.mermaid-card.mm-card')).forEach((c,i)=>{
        const l=live[i]; if(!l||!l._mmSrc) return;
        let parsed=null; try{ parsed=mmParse(l._mmSrc); }catch(e){}
        if(!parsed||!parsed.root) return;
        const layout=l.dataset.mmLayout||parsed.layout||S.mmLayout||'right';
        const L=mmCompute(mmVisible(parsed.root,new Set()),layout,'white');
        const canvas=c.querySelector('.mm-canvas');
        if(canvas) canvas.innerHTML=mmSVG(L);
      });
    }
    // 静态图片里没有交互，说明文字同步改为静态描述
    clone.querySelectorAll('.mermaid-card.mm-card').forEach((c,i)=>{
      const live=output.querySelectorAll('.mermaid-card.mm-card')[i];
      const cap=c.querySelector('.mm-cap'); if(!cap||!live) return;
      const name=mmLayoutName(live.dataset.mmLayout||'right');
      const n=c.querySelectorAll('.mm-node').length;
      cap.innerHTML='<span class="mm-dot"></span>思维导图 · <b>'+name+'</b> · '+n+' 个节点'+
        (R.mindmap?'':'<span class="mm-dot"></span>含折叠分支');
    });
    // 手机端为适配视口缩放过，导出时按容器宽度铺满（SVG 有 viewBox，等比缩放）
    clone.querySelectorAll('.mm-svg').forEach(s=>{ s.style.width='100%'; s.style.height='auto'; });
    clone.querySelectorAll('.code-expand,.code-copy,.code-fade,.table-hint,.empty').forEach(n=>n.remove());
    // 外链图片转 dataURL
    for(const img of Array.from(clone.querySelectorAll('img'))){
      if(img.src && /^https?:/i.test(img.src)){
        try{
          const r=await fetch(img.src,{mode:'cors',cache:'force-cache'});
          if(!r.ok) throw 0;
          const b=await r.blob();
          img.src=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onloadend=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(b); });
        }catch(e){ img.style.display='none'; }
      }
    }
    cap.appendChild(clone);
    const wm=document.createElement('div'); wm.className='export-watermark';
    wm.innerHTML='<i></i><span>'+esc(S.watermark || '墨笺 · Markdown Studio')+'</span>'+
      '<span style="margin-left:auto">'+new Date().toLocaleDateString('zh-CN')+'</span>';
    cap.appendChild(wm);
    stage.appendChild(cap); document.body.appendChild(stage);
    await new Promise(r=>setTimeout(r,180));
    const w=cap.offsetWidth, h=cap.offsetHeight;
    let ratio=want;
    // 浏览器 canvas 单边上限约 16384，显式降倍率，保证长图完整且提示的尺寸准确
    const capMax=Math.min(16300/Math.max(w,h,1), Math.sqrt(120000000/Math.max(w*h,1)));
    if(ratio>capMax){
      ratio=Math.floor(capMax*10)/10;
      if(ratio<0.5) throw new Error('内容过长，请降低清晰度或缩小导出字号');
      toast('图片过大，倍率自动降为 '+ratio+'x');
    }
    const canvas=await htmlToImage.toCanvas(cap,{
      pixelRatio:ratio, backgroundColor:'#ffffff', skipFonts:true,
      filter:n=>!(n.classList && (n.classList.contains('code-copy')||n.classList.contains('code-expand')||
        n.classList.contains('table-hint')||n.classList.contains('mm-btn')||
        n.classList.contains('mm-tools')||n.classList.contains('mm-menu')))
    });
    const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('PNG 编码失败，请降低清晰度')),'image/png'));
    const name='墨笺_'+stamp()+'.png';
    const info='已导出 '+Math.round(w*ratio)+'×'+Math.round(h*ratio)+' px · '+ratio+'x';
    if(preferShare && navigator.share && navigator.canShare) shareFile(blob,name);
    else { download(blob,name); toast(info+' · 已下载'); }
    status('导出完成','#3ddc97');
  }catch(err){
    console.error(err); toast('导出失败：'+(err.message||'请稍后重试'),true); status('导出失败','#ff6b78');
  }finally{
    if(stage) stage.remove();
    fab.classList.remove('busy'); fab.innerHTML=orig;
  }
}

/* =========================================================
   隐藏文本识别与导出开关
   扫描预览 DOM（必要时回退到源码），统计每类"需交互才可见"的内容，
   让用户决定导出长图时哪些类别直接把隐藏文本印出来。
   ========================================================= */
function detectReveal(){
  const src=editor.value||'';
  const q=s=>output.querySelectorAll(s).length;
  const counts={
    abbr:q('abbr.pv-abbr') || (/^[ \t]*\*\[[^\]]+\]:[ \t]*\S+/m.test(src)?1:0),
    spoiler:q('.spoiler') || (/\|\|[^|\n]+\|\|/.test(src)?1:0),
    details:q('details') || (/<details\b/i.test(src)||/^[ \t]*(?:>[ \t]*)*(?:\?\?\?|>>>|:::details)/im.test(src)?1:0),
    code:(()=>{
      let n=0;
      output.querySelectorAll('.code-block-wrapper').forEach(w=>{
        if(w.classList.contains('can-collapse') || w.querySelectorAll('.code-line').length>16) n++;
      });
      if(!n && /(?:^|\n)[ \t]*(?:`{3,}|~{3,})[^\n]*\n(?:[^\n]*\n){16,}/.test(src)) n=1;
      return n;
    })(),
    mindmap:q('.mermaid-card.mm-card') || (/^[ \t]*mindmap\b/im.test(src)?1:0)
  };
  return REVEAL_KINDS.map(k=>({k:k.k,n:k.n,i:k.i,d:k.d,count:counts[k.k]||0}));
}
function revealRow(k){
  const on=!!S.reveal[k.k], unused=!k.count;
  return '<div class="row rv-row'+(unused?' unused':'')+'" data-reveal="'+k.k+'">'+
    '<span class="ri">'+k.i+'</span>'+
    '<span class="rt"><b>'+k.n+'<em class="rv-count">'+(k.count?k.count+' 处':'未使用')+'</em></b>'+
    '<small>'+k.d+'</small></span>'+
    '<span class="sw'+(on?' on':'')+'"></span></div>';
}
function revealPanelHTML(compact){
  const found=detectReveal();
  const rows=compact ? found.filter(x=>x.count>0) : found;
  let h='';
  if(!rows.length){
    h='<div class="empty-note">当前文档没有检测到交互隐藏文本<br>试试 <b>||剧透||</b>、<b>*[API]: 全称</b> 或 <b>&lt;details&gt;</b></div>';
  }else{
    h='<div class="card">'+rows.map(revealRow).join('')+'</div>';
    if(!compact){
      h+='<div class="btn-grid" style="margin-top:10px">'+
        '<button class="btn" data-reveal-all="1">全部显示</button>'+
        '<button class="btn ghost" data-reveal-all="0">全部隐藏</button></div>';
    }
  }
  h+='<p style="font-size:11px;color:var(--a-faint);line-height:1.75;margin:10px 3px 0">'+
    '开启：导出长图时把这类隐藏内容直接印在图上（缩写会以「释：全称」小标签紧跟词后）。'+
    '关闭：图片里保持隐藏 / 折叠状态。独立 HTML 仍可点击交互。'+
    (compact?' <b data-act="reveal" style="color:var(--a-accent,#a78bfa);cursor:pointer">更多设置 →</b>':'')+
    '</p>';
  return h;
}
function applyRevealBasics(root, forImage){
  const R=S.reveal||DEF_REVEAL;
  // 缩写：把释义变成真实 DOM 文本，不依赖伪元素气泡（图片导出更可靠）
  if(R.abbr){
    root.querySelectorAll('abbr.pv-abbr').forEach(a=>{
      const def=String(a.getAttribute('data-def')||a.getAttribute('title')||'').trim();
      const word=a.textContent.trim();
      if(!def) return;
      const sp=document.createElement('span');
      sp.className='rv-abbr';
      sp.innerHTML='<b>'+esc(word)+'</b><span class="rv-def">释：'+esc(def)+'</span>';
      a.replaceWith(sp);
    });
  }else if(forImage){
    root.querySelectorAll('abbr.pv-abbr.open').forEach(a=>a.classList.remove('open'));
  }
  // 剧透
  root.querySelectorAll('.spoiler').forEach(sp=>sp.classList.toggle('revealed',!!R.spoiler));
  // 折叠区块
  root.querySelectorAll('details').forEach(d=>{
    if(R.details) d.setAttribute('open','');
    else if(forImage) d.removeAttribute('open');
  });
  // 长代码折叠
  root.querySelectorAll('.code-block-wrapper.collapsed').forEach(w=>{
    if(R.code) w.classList.remove('collapsed');
    else if(forImage && !w.querySelector('.rv-fold-note')){
      const note=document.createElement('div'); note.className='rv-fold-note';
      note.textContent='… 已折叠（导出时未展开长代码）';
      w.appendChild(note);
    }
  });
}

function renderSheet(){
  const B=$('sheetBody'), T=$('sheetTitle'); let html='';
  if(sheetPage==='settings'){

/* ---------- 抽屉事件委托 ---------- */
$('sheetBody').addEventListener('click', e=>{
  const sw=e.target.closest('[data-sw]');
  if(sw){ const k=sw.dataset.sw; S[k]=!S[k]; sw.querySelector('.sw').classList.toggle('on',S[k]); applySettings(); if(k==='math'||k==='mermaid'||k==='collapse') render(); return; }
  const sg=e.target.closest('[data-seg] button');
  if(sg){
    const box=sg.closest('[data-seg]'), k=box.dataset.seg;
    let v=sg.dataset.val; if(['size','lh','exportWidth','exportSize','exportRatio'].includes(k)) v=Number(v);
    S[k]=v; applySettings();
    box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));
    return;
  }
  const ml=e.target.closest('[data-mmlayout]');
  if(ml){
    S.mmLayout=ml.dataset.mmlayout; saveSettings(); redrawMindmaps(S.mmLayout);
    renderSheet(); toast('默认布局：'+mmLayoutName(S.mmLayout)); buzz(); return;
  }
  // 隐藏文本导出开关：直接更新同一面板里的开关，不重建 DOM（避免跳回顶部）
  const rv=e.target.closest('[data-reveal]');
  if(rv){
    const k=rv.dataset.reveal; S.reveal[k]=!S.reveal[k]; saveSettings();
    document.querySelectorAll('[data-reveal="'+k+'"] .sw').forEach(x=>x.classList.toggle('on',S.reveal[k]));
    buzz(); return;
  }
  const rva=e.target.closest('[data-reveal-all]');
  if(rva){
    const v=rva.dataset.revealAll==='1';
    REVEAL_KINDS.forEach(k=>{ S.reveal[k.k]=v; });
    saveSettings();
    document.querySelectorAll('[data-reveal]').forEach(row=>{
      row.querySelector('.sw').classList.toggle('on',!!S.reveal[row.dataset.reveal]);
    });
    toast(v?'已设为全部显示':'已设为全部隐藏'); buzz(); return;
  }
  const tc=e.target.closest('[data-toc]');
  if(tc){ gotoHeading(tc.dataset.toc); closeSheet(); return; }
  const rs=e.target.closest('[data-restore]');
  if(rs){ const x=snaps.find(s=>s.id===Number(rs.dataset.restore)); if(x){ editor.value=x.text; isSample=false; pushHistory(); saveDoc(); render(); closeSheet(); toast('已恢复快照'); } return; }
  const ds=e.target.closest('[data-delsnap]');
  if(ds){ snaps=snaps.filter(s=>s.id!==Number(ds.dataset.delsnap)); localStorage.setItem(K.snaps,JSON.stringify(snaps)); renderSheet(); toast('已删除'); return; }
  const sp=e.target.closest('[data-snip]');
  if(sp){ insertSnippet(sp.dataset.snip); closeSheet(); return; }
  const act=e.target.closest('[data-act]');
  if(!act) return;
  const a=act.dataset.act;
  const go={ import:()=>$('fileInput').click(), expmd:exportMd, exphtml:exportHtml,
    exppng:()=>{ closeSheet(); exportImage(false); },
    print:()=>{ const v=document.body.dataset.view; setView('preview'); closeSheet(); setTimeout(()=>{ window.print(); setTimeout(()=>setView(v,true),400); },300); },
    sharemd:()=>shareFile(new Blob([editor.value],{type:'text/markdown'}),docTitle()+'.md'),
    sharepng:()=>{ closeSheet(); exportImage(true); },
    copysrc:()=>copyText(editor.value).then(()=>toast('源码已复制')).catch(()=>toast('复制失败',true)),
    copytext:()=>copyText(output.innerText).then(()=>toast('正文已复制')).catch(()=>toast('复制失败',true)),
    copyhtml:()=>copyText(output.innerHTML).then(()=>toast('HTML 已复制')).catch(()=>toast('复制失败',true)),
    sample:()=>{ editor.value=SAMPLE; isSample=true; pushHistory(); saveDoc(); setView('edit'); render(); closeSheet(); toast('已载入示例'); },
    newdoc:()=>{ if(editor.value.trim()) saveSnap(); editor.value=''; isSample=false; pushHistory(); saveDoc(); setView('edit'); render(); closeSheet(); toast('已新建空白文档'); },
    snapshot:saveSnap,
    reveal:()=>openSheet('reveal'),
    focus:()=>{ document.body.classList.add('focus'); setView('edit',true); closeSheet(); },
    fullscreen:()=>{ setView('preview'); closeSheet(); const p=document.querySelector('.preview-pane'); (p.requestFullscreen||p.webkitRequestFullscreen||function(){}).call(p); },
    reset:()=>{ S=Object.assign({},DEF,{reveal:Object.assign({},DEF_REVEAL)}); applySettings(); renderSheet(); render(); toast('已恢复默认'); },
    findprev:()=>doFind(-1), findnext:()=>doFind(1), replace:()=>doReplace(false), replaceall:()=>doReplace(true),
    copytoc:()=>{ const t=tocData.map(d=>'  '.repeat(d.lv-1)+'- '+d.text).join('\n'); copyText(t).then(()=>toast('目录已复制')); }
  };
  if(go[a]) go[a]();
});
$('sheetBody').addEventListener('input', e=>{
  const r=e.target.closest('[data-range]');
  if(r){ const k=r.dataset.range, v=Number(r.value); S[k]=v; applySettings();
    const lab=$('rv_'+k); if(lab) lab.textContent = (k==='lh'?v.toFixed(2):v+' px'); return; }
  if(e.target.id==='findQ'){ findMatches=[]; findAt=-1; doFind(1); }
  if(e.target.id==='wmInput'){ S.watermark=e.target.value; saveSettings(); }
});

/* 文档内 [TOC] / 脚注锚点：统一走精准跳转 */
document.addEventListener('click', e=>{
  if(!e.target.closest('abbr.pv-abbr')){
    output.querySelectorAll('abbr.pv-abbr.open').forEach(x=>x.classList.remove('open'));
  }
  /* 思维导图：布局 / 缩放 / 折叠 / 高亮 */
  const mmWrap=e.target.closest('.code-block-wrapper');
  const mmCard=mmWrap?mmWrap.querySelector('.mermaid-card.mm-card'):null;
  if(mmCard){
    const lb=e.target.closest('.mm-layout-btn');
    if(lb){
      e.preventDefault();
      const menu=mmCard.querySelector('.mm-menu');
      document.querySelectorAll('.mm-menu.show').forEach(x=>{ if(x!==menu) x.classList.remove('show'); });
      if(menu) menu.classList.toggle('show');
      buzz(); return;
    }
    const mi=e.target.closest('.mm-menu [data-mm-layout]');
    if(mi){
      e.preventDefault();
      mmCard.dataset.mmLayout=mi.dataset.mmLayout;
      delete mmCard.dataset.mmScale;
      drawMindmapCard(mmCard);
      const menu=mmCard.querySelector('.mm-menu'); if(menu) menu.classList.remove('show');
      toast('已切换为「'+mmLayoutName(mi.dataset.mmLayout)+'」'); buzz(); return;
    }
    const fitb=e.target.closest('.mm-fitb');
    if(fitb){
      e.preventDefault();
      const canvas=mmCard.querySelector('.mm-canvas'), svg=canvas&&canvas.querySelector('svg');
      if(svg){
        const vb=(svg.getAttribute('viewBox')||'').split(/\s+/).map(Number);

        mmCard.dataset.mmScale=target.toFixed(3);
        drawMindmapCard(mmCard); toast('已适应视口宽度');
      }
      buzz(); return;
    }
    const zi=e.target.closest('.mm-zoomin'), zo=e.target.closest('.mm-zoomout'), rs=e.target.closest('.mm-resetb');
    if(zi||zo||rs){
      e.preventDefault();
      if(rs){
        delete mmCard.dataset.mmScale;
        mmCard.dataset.mmLayout=S.mmLayout||'right';
        mmCard._mmCollapsed=new Set();
      }else{
        const cur=Number(mmCard.dataset.mmScale)||1;
        mmCard.dataset.mmScale=(zi?Math.min(2.5,cur*1.25):Math.max(.3,cur/1.25)).toFixed(3);
      }
      drawMindmapCard(mmCard); buzz(); return;
    }
    const nd=e.target.closest('.mm-node');
    if(nd){
      const set=mmCard._mmCollapsed||(mmCard._mmCollapsed=new Set());
      const id=nd.getAttribute('data-mm-id');

    }
  }
  if(!e.target.closest('.mm-layout-btn') && !e.target.closest('.mm-menu')){
    document.querySelectorAll('.mm-menu.show').forEach(m=>m.classList.remove('show'));
  }
  const t=e.target.closest('[data-toc]');
  if(t && !t.closest('#sheetBody')){ e.preventDefault(); gotoHeading(t.dataset.toc); return; }
  const a=e.target.closest('a[href^="#"]');
  if(a && output.contains(a)){
    let id=a.getAttribute('href').slice(1);
    try{ id=decodeURIComponent(id); }catch(err){}
    const el=document.getElementById(id);
    if(el && output.contains(el)){ e.preventDefault(); gotoHeading(id); }
  }
});

<script>

/* ==================================================================
   墨笺 v5 · 增强层 / 核心
   ① 开放渲染：原始 HTML / 可运行 HTML（沙箱）/ SVG / CSS / JS /
      音频 / 视频 / 任意 data URI 媒体 / iframe / 本地文件嵌入
   ② 扩展语法：标签页 / 时间线 / 卡片 / 分栏 / 进度条 / 徽章 /
      按钮 / 注音 / 图表 / CSV / JSON / 标题编号 / 公式编号
   ③ 识别修复：CJK 节点前缀、raw 块保护、围栏信息串、图片属性
   ④ 思维导图：新增布局、节点编号、配色主题、导出 SVG/PNG
   ================================================================== */
const V5 = (function(){
  const O = {};
  /* ---------- 保存原实现 ---------- */
  const _parseInfo=parseInfo, _extractFences=extractFences, _compile=compile,
        _buildCodeBlock=buildCodeBlock, _enhanceDOM=enhanceDOM,
        _mmParse=mmParse, _mmColor=mmColor, _mmCompute=mmCompute,
        _mmSVG=mmSVG, _applySettings=applySettings,
        _renderSheet=renderSheet, _exportHtml=exportHtml, _exportImage=exportImage;
  O._exportHtml=_exportHtml; O._exportImage=_exportImage;

  /* ---------- 新增设置 ---------- */
  DEF.hnum='off'; DEF.hnumBase=2; DEF.mmNum=false; DEF.mmPalette='violet';
  DEF.openMode=true; DEF.mediaAuto=true; DEF.frameH=260; DEF.svgInline=true;
  S.hnum=S.hnum||'off'; S.hnumBase=S.hnumBase||2;
  S.mmNum=!!S.mmNum; S.mmPalette=S.mmPalette||'violet';
  S.openMode=S.openMode!==false; S.mediaAuto=S.mediaAuto!==false;
  S.frameH=S.frameH||260; S.svgInline=S.svgInline!==false;

  /* ---------- 小工具 ---------- */
  const esc2=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const attr=s=>esc2(s).replace(/\n/g,'&#10;');
  const uid=(()=>{let i=0;return p=>p+(++i)+'_'+Date.now().toString(36).slice(-4);})();
  function pushRaw(st, html){ const i=st.raw.push(html)-1; return '\n\n'+tk('R',i)+'\n\n'; }
  function dataKind(url){
    const u=String(url||'').trim();
    const dm=u.match(/^data:([^;,]+)/i);
    let mime=dm?dm[1].toLowerCase():'';
    let kind='other', label='文件';
    if(mime){
      if(/^image\//.test(mime)){kind='image';label=mime.split('/')[1].toUpperCase()+' 图片';}
      else if(/^audio\//.test(mime)){kind='audio';label=mime.split('/')[1].toUpperCase()+' 音频';}
      else if(/^video\//.test(mime)){kind='video';label=mime.split('/')[1].toUpperCase()+' 视频';}
      else if(/pdf/.test(mime)){kind='pdf';label='PDF 文档';}
      else if(/^font\/|application\/(font|x-font|octet-stream)/.test(mime)){kind='font';label='字体 / 二进制';}
      else if(/^text\/html/.test(mime)){kind='html';label='HTML 文档';}
      else if(/^text\//.test(mime)){kind='text';label=mime.split('/')[1].toUpperCase()+' 文本';}
    }else{
      const em=u.match(/\.([a-z0-9]{1,5})(?:[?#].*)?$/i); const e=em?em[1].toLowerCase():'';
      if(/^(png|jpe?g|gif|webp|svg|bmp|avif|ico)$/.test(e)){kind='image';label=e.toUpperCase()+' 图片';}
      else if(/^(mp3|m4a|aac|wav|ogg|oga|flac|opus)$/.test(e)){kind='audio';label=e.toUpperCase()+' 音频';}
      else if(/^(mp4|webm|mov|m4v|ogv|mkv)$/.test(e)){kind='video';label=e.toUpperCase()+' 视频';}
      else if(e==='pdf'){kind='pdf';label='PDF 文档';}
      else if(/^(woff2?|ttf|otf)$/.test(e)){kind='font';label='字体文件';}
      else if(/^(html?|svg)$/.test(e)){kind='html';label='HTML 文档';}
    }
    return {kind,label,mime,isData:!!dm};
  }
  const MEDIA_ICON={audio:'♫',video:'▶',pdf:'▤',font:'A',text:'¶',other:'⬡',html:'◈'};

  /* ---------- 围栏信息串（修复 + 扩展） ---------- */
  parseInfo=function(info){
    const raw=String(info||'').trim();
    let m=raw.match(/^([^\s:{]+)\s*:\s*([^\s{]+)/);
    let lang=m?m[1]:((raw.split(/\s+/)[0]||'').replace(/^\./,''));
    let filename=m?m[2]:'';
    /* `html:run` / `js:inline` 里的 run 是模式标记，不是显示用文件名。
       单独放进 mode 字段，避免工具条与代码块里冒出一个莫名其妙的 "run" 标签。 */
    const MODE_WORDS=new Set(['run','inline','sandbox','noframe','plain','static','autoplay','loop','controls','muted']);
    let mode=MODE_WORDS.has(String(filename).toLowerCase())?String(filename).toLowerCase():'';
    if(mode) filename='';
    const tm=raw.match(/(?:^|\s)title\s*=\s*["']([^"']+)["']/i); if(tm) filename=tm[1];
    const attrs={};
    const am=raw.match(/\{([^}]*)\}/);
    if(am) am[1].split(/[,，\s]+/).forEach(p=>{
      const kv=p.match(/^([A-Za-z_][\w-]*)\s*=\s*(.+)$/);
      if(kv) attrs[kv[1].toLowerCase()]=kv[2].replace(/^["']|["']$/g,'');
      else if(p) attrs[p.toLowerCase()]=true;
    });
    const flags={}; raw.replace(/\s+(run|inline|sandbox|noframe|autoplay|loop|controls|muted)\b/gi,(x,f)=>{flags[f.toLowerCase()]=true;return x;});
    return {lang,filename,mode,raw,attrs,flags};
  };
  extractFences=function(src,st){
    const lines=src.split('\n'),out=[]; let i=0;
    while(i<lines.length){
      const m=lines[i].match(/^([ \t]*)((?:>[ \t]*)*)(`{3,}|~{3,})[ \t]*([^\n]*)$/);
      if(!m){out.push(lines[i]);i++;continue;}
      const indent=m[1],quote=m[2],fence=m[3],info=m[4].trim(),body=[];i++;
      while(i<lines.length){
        const cm=lines[i].match(/^([ \t]*)(?:>[ \t]*)*(`{3,}|~{3,})[ \t]*$/);
        if(cm&&cm[2].charAt(0)===fence.charAt(0)&&cm[2].length>=fence.length){i++;break;}
        const raw=stripQuote(lines[i],quote);
        body.push(raw.indexOf(indent)===0?raw.slice(indent.length):raw);
        i++;
      }
      const p=parseInfo(info);
      const idx=st.code.push({lang:p.lang,filename:p.filename,code:body.join('\n'),
        meta:p.raw,attrs:p.attrs,flags:p.flags,mode:p.mode||p.filename})-1;
      if(quote) out.push(quote+tk('C',idx)); else out.push('',tk('C',idx),'');
    }
    return out.join('\n');
  };

  /* ---------- 原始 HTML 块保护 ----------
     script / style / svg / iframe / textarea / pre / 注释 里的文本
     不再被行内扩展语法改写，保证"直接写 HTML"原样可用。 */
  function extractRawBlocks(src,st){
    const re=/<(script|style|svg|iframe|textarea|pre|canvas|template)\b[^>]*>[\s\S]*?<\/\1\s*>|<!--[\s\S]*?-->/gi;
    return src.replace(re,(html,tag)=>{
      const t=(tag||'comment').toLowerCase();
      if(t==='comment') return pushRaw(st,'<!--'+html.slice(4,-3)+'-->');
      return pushRaw(st,html);
    });
  }

  /* ---------- 媒体卡片 ---------- */
  function mediaCard(kind,title,url,opt){
    opt=opt||{};
    const k=dataKind(url), icon=MEDIA_ICON[kind]||MEDIA_ICON.other;
    const tag=(k.isData?'DATA URI · ':'')+k.label;
    const dl=esc2((opt.name||title||'media').replace(/[\\/:*?"<>|]/g,'_'));
    let inner='';
    if(kind==='audio') inner='<audio controls preload="metadata"'+ (opt.loop?' loop':'')+(opt.autoplay?' autoplay':'')+' src="'+attr(url)+'"></audio>';
    else if(kind==='video') inner='<video controls playsinline preload="metadata"'+ (opt.loop?' loop':'')+(opt.autoplay?' autoplay':'')+(opt.muted?' muted':'')+' src="'+attr(url)+'"></video>';
    else if(kind==='pdf'||kind==='font'||kind==='text') inner='<div class="pm-file"><span>⬡</span><div><b>'+esc2(title)+'</b><br><small>'+esc2(k.label)+' · 点击右侧按钮下载或打开</small></div></div>';
    else inner='<div class="pm-file"><span>⬡</span><div><b>'+esc2(title)+'</b><br><small>'+esc2(k.label)+'</small></div></div>';
    return '<div class="pv-media" data-kind="'+kind+'"><div class="pm-head"><span class="pm-ico">'+icon+'</span><span>'+esc2(title)+'</span><span class="pm-tag">'+esc2(tag)+'</span></div>'+
      inner+(opt.desc?'<div class="pm-desc">'+esc2(opt.desc)+'</div>':'')+
      '<div class="pm-actions"><a href="'+attr(url)+'" download="'+dl+'" target="_blank" rel="noopener">⬇ 下载</a>'+
      '<button type="button" data-copyuri="'+attr(url)+'">❐ 复制 URI</button>'+
      (!k.isData?'<a href="'+attr(url)+'" target="_blank" rel="noopener">↗ 新窗口</a>':'')+'</div></div>';
  }
  O.mediaCard=mediaCard;

  /* ---------- 可运行 HTML 沙箱 ----------
     sandbox 不含 allow-same-origin：脚本可运行，但读不到父页面 /
     localStorage / Cookie。高度通过 postMessage 上报自适应。 */
  function frameDoc(html,opt){
    opt=opt||{};
    const fid=opt.fid||uid('mjx_frame_');
    const css='html,body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;'+
      'background:'+(opt.bg||'#ffffff')+';color:'+(opt.fg||'#222838')+';font-size:15px;line-height:1.7}'+
      'img,svg,video,audio{max-width:100%}a{color:#7c5cff}button,input{padding:6px 10px;border-radius:8px;border:1px solid #ddd}'+
      '*{box-sizing:border-box}';
    const head='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">'+
      '<meta name="viewport" content="width=device-width,initial-scale=1">'+
      (opt.head||'')+'<style>'+css+'</style></head><body>';
    const tail='<scr'+'ipt>(function(){var id='+JSON.stringify(fid)+';function h(){try{parent.postMessage({mjxFrame:id,h:document.documentElement.scrollHeight,w:document.documentElement.scrollWidth},"*")}catch(e){}}'+
      'window.addEventListener("load",h);if(window.ResizeObserver){new ResizeObserver(h).observe(document.body)}'+
      'setTimeout(h,250);setTimeout(h,900);window.addEventListener("message",function(e){if(e.data&&e.data.mjxReload)h()})})()<\/scr'+'ipt>'+
      '</body></html>';
    return {fid,doc:head+html+tail};
  }
  O.frameDoc=frameDoc;
  function liveFrame(title,html,opt){
    opt=opt||{};
    if(!S.openMode){
      /* 关闭开放渲染也返回可切换的 DOM 框，源码视图仍是标准代码块 */
      const box=document.createElement('div'); box.className='live-frame off';
      box.dataset.src=String(html||''); box.dataset.lang=opt.lang||'html';
      box.dataset.fname=opt.fname||'';
      const t=document.createElement('div'); t.className='live-tools';
      t.innerHTML='<span class="lt-tag">◈ 可运行 HTML</span><span class="lt-name">'+esc2(title||'嵌入式页面')+
        '</span><span class="sp"></span><button type="button" data-live="copy">❐ 源码</button>'+
        '<button type="button" data-live="save">⬇ 独立 HTML</button>';
      const sec=document.createElement('div'); sec.className='pv-security';
      sec.innerHTML='<b>开放渲染已关闭</b>：脚本 / iframe 未运行。可在「设置 → 开放渲染」开启，或点「源码」按普通代码块查看完整内容。';
      box.appendChild(t); box.appendChild(sec);
      return box;
    }
    const f=frameDoc(String(html||''),opt);
    const box=document.createElement('div');
    box.className='live-frame'+(opt.plain?' plain':'');
    box.dataset.fid=f.fid;
    box.dataset.src=String(html||'');
    box.dataset.lang=opt.lang||'html';
    box.dataset.fname=opt.fname||'';
    const tools=document.createElement('div'); tools.className='live-tools';
    tools.innerHTML='<span class="lt-tag">◈ 可运行 HTML</span><span class="lt-name">'+esc2(title||'嵌入式页面')+'</span><span class="sp"></span>'+
      '<button type="button" data-live="reload">↻ 重新运行</button>'+
      '<button type="button" data-live="copy">❐ 源码</button>'+
      '<button type="button" data-live="save">⬇ 独立 HTML</button>'+
      '<button type="button" data-live="full">⛶ 全屏</button>';
    const fr=document.createElement('iframe');
    /* opt.src：直接嵌入外部 URL（```iframe），保留原 sandbox 权限；
       其余情况用 srcdoc 隔离沙箱，脚本读不到父页面。 */
    fr.setAttribute('sandbox',opt.src
      ? 'allow-scripts allow-forms allow-popups allow-same-origin allow-modals allow-downloads'
      : 'allow-scripts allow-forms allow-modals allow-popups allow-downloads');
    fr.setAttribute('loading','lazy');
    fr.setAttribute('title',title||'可运行 HTML 沙箱');
    if(opt.src) fr.src=opt.src; else fr.srcdoc=f.doc;
    fr.style.height=(opt.height||S.frameH)+'px';
    box.appendChild(tools); box.appendChild(fr);
    return box;
  }
  O.liveFrame=liveFrame;

  /* ---------- 图表（纯 SVG 自绘，无外部依赖） ---------- */
  const CH_COLORS=['#7c5cff','#38bdf8','#3ddc97','#f59e0b','#fb7185','#818cf8','#0e9f8a','#a855f7'];
  function chartSVG(src){
    const lines=String(src||'').split('\n').map(l=>l.replace(/^[ \t]*[#%/]+[ \t]*/,'').trim()).filter(Boolean);
    let type='bar',title='',unit='';
    const rows=[];
    lines.forEach(l=>{
      let m=l.match(/^(type|类型)\s*[:：]\s*(bar|line|pie|柱|折线|饼|柱状图|折线图|饼图)\s*$/i);
      if(m){ const v=m[2].toLowerCase(); type=/line|折线/.test(v)?'line':/pie|饼/.test(v)?'pie':'bar'; return; }
      m=l.match(/^(title|标题)\s*[:：]\s*(.+)$/i); if(m){title=m[2].trim();return;}
      m=l.match(/^(unit|单位)\s*[:：]\s*(.+)$/i); if(m){unit=m[2].trim();return;}
      const kv=l.split(/[\t,，:：|]/).map(x=>x.trim()).filter(x=>x!=='');
      if(kv.length>=2){ const v=Number(kv[1]); if(isFinite(v)) rows.push({k:kv[0],v}); }
    });
    if(!rows.length) return {err:'未解析到数据。每行写「名称, 数值」，可选 type: bar / line / pie 与 title: 标题。'};
    const W=560,H=type==='pie'?280:260,PL=46,PB=42,PT=18,PR=16;
    const max=Math.max.apply(null,rows.map(r=>r.v)), min=Math.min(0,Math.min.apply(null,rows.map(r=>r.v)));
    const span=(max-min)||1;
    let g='';
    if(type==='pie'){
      const cx=W/2,cy=H/2+4,R=Math.min(H/2-24,96),total=rows.reduce((a,r)=>a+Math.abs(r.v),0)||1;
      let a0=-Math.PI/2;
      rows.forEach((r,i)=>{
        const a1=a0+Math.abs(r.v)/total*Math.PI*2, c=CH_COLORS[i%CH_COLORS.length];
        const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
        const big=(a1-a0)>Math.PI?1:0;
        g+='<path d="M '+cx+' '+cy+' L '+x0.toFixed(1)+' '+y0.toFixed(1)+' A '+R+' '+R+' 0 '+big+' 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z" fill="'+c+'" stroke="#fff" stroke-width="2"/>';
        const am=(a0+a1)/2, lr=R*.62;
        g+='<text x="'+(cx+lr*Math.cos(am)).toFixed(1)+'" y="'+(cy+lr*Math.sin(am)).toFixed(1)+'" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">'+Math.round(Math.abs(r.v)/total*100)+'%</text>';
        a0=a1;
      });
      g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*.42)+'" fill="var(--pv-bg,#fff)"/>';
    }else{
      const iw=W-PL-PR,ih=H-PT-PB,step=iw/rows.length,bw=Math.min(38,step*.56);
      for(let i=0;i<=4;i++){
        const y=PT+ih*i/4, val=max-span*i/4;
        g+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="var(--pv-line,#e7eaf3)" stroke-dasharray="'+(i===4?'0':'3 4')+'"/>';
        g+='<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" font-size="10" fill="var(--pv-mute,#8a92a8)" text-anchor="end">'+esc2((Math.round(val*10)/10)+(unit?'':'') )+'</text>';
      }
      const py=v=>PT+ih-(v-min)/span*ih;
      if(type==='line'){
        const pts=rows.map((r,i)=>[PL+step*(i+.5),py(r.v)]);
        g+='<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="#7c5cff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
        pts.forEach((p,i)=>{ g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="#fff" stroke="'+CH_COLORS[i%CH_COLORS.length]+'" stroke-width="2.4"/>'; });
      }
      rows.forEach((r,i)=>{
        const cx=PL+step*(i+.5), y=py(r.v), c=CH_COLORS[i%CH_COLORS.length];
        if(type==='bar') g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,(PT+ih-y)).toFixed(1)+'" rx="5" fill="'+c+'" opacity=".88"/>';
        g+='<text x="'+cx.toFixed(1)+'" y="'+(H-PB+18)+'" font-size="10.5" fill="var(--pv-soft,#4d566e)" text-anchor="middle">'+esc2(r.k.slice(0,8))+'</text>';
        if(type==='bar') g+='<text x="'+cx.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" font-size="10" font-weight="700" fill="'+c+'" text-anchor="middle">'+esc2(r.v)+'</text>';
      });
    }
    const legend=rows.map((r,i)=>'<span><i style="background:'+CH_COLORS[i%CH_COLORS.length]+'"></i>'+esc2(r.k)+' '+esc2(r.v)+'</span>').join('');
    return {html:'<div class="pv-chart"><div class="ch-title">'+esc2(title||'数据图表')+(unit?' · '+esc2(unit):'')+'</div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang SC,sans-serif">'+g+'</svg>'+
      '<div class="ch-legend">'+legend+'</div></div>'};
  }
  O.chartSVG=chartSVG;

  /* ---------- CSV / JSON ---------- */
  function csvTable(src){
    const rows=String(src||'').split(/\r?\n/).filter(l=>l.trim()).map(l=>{
      const out=[];let cur='',q=false;
      for(let i=0;i<l.length;i++){
        const c=l[i];
        if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
        else if((c===','||c==='\t')&&!q){out.push(cur);cur='';}
        else cur+=c;
      }
      out.push(cur); return out.map(x=>x.trim());
    });
    if(!rows.length) return '<div class="pv-raw">空 CSV</div>';
    const head=rows[0], body=rows.slice(1);
    return '<div class="pv-dtable"><div class="dt-head">▦ CSV 表格 · '+body.length+' 行 × '+head.length+' 列</div><div class="dt-scroll"><table><thead><tr>'+
      head.map(h=>'<th>'+esc2(h)+'</th>').join('')+'</tr></thead><tbody>'+
      body.map(r=>'<tr>'+head.map((h,i)=>'<td>'+esc2(r[i]||'')+'</td>').join('')+'</tr>').join('')+
      '</tbody></table></div></div>';
  }
  function jsonView(src){
    let obj=null; try{ obj=JSON.parse(src); }catch(e){ return '<pre class="pv-json">'+esc2(src)+'</pre>'; }
    const pretty=JSON.stringify(obj,null,2);
    const html=esc2(pretty)
      .replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="jk">$1</span>$2')
      .replace(/:\s*(&quot;[^&]*?&quot;)/g,': <span class="js">$1</span>')
      .replace(/\b(true|false|null)\b/g,'<span class="jb">$1</span>')
      .replace(/(:\s*)(-?\d+(?:\.\d+)?)/g,'$1<span class="jn">$2</span>');
    return '<pre class="pv-json">'+html+'</pre>';
  }

  /* ---------- 开放围栏（buildCodeBlock 增强） ---------- */
  const OPEN_LANGS=new Set(['html','htm','svg','css','js:run','javascript:run','iframe','embed','frame','audio','video','media','player','chart','csv','json','md','markdown','math','latex','tex','raw','data']);
  function buildOpen(blk){
    const lang=(blk.lang||'').toLowerCase(), mode=String(blk.mode||blk.filename||'').toLowerCase();
    const A=blk.attrs||{}, F=blk.flags||{}, code=blk.code||'';
    const title=A.title||A.name||blk.filename||lang.toUpperCase()+' 片段';
    const realName=A.title||A.name||blk.filename||'';   /* 只有真实文件名才进代码块的「文件名」标签 */
    const wrap=document.createElement('div'); wrap.className='code-block-wrapper embed-block';
    const tools=document.createElement('div'); tools.className='pre-tools';
    tools.innerHTML='<span class="mac-dots"><i></i><i></i><i></i></span><span class="code-lang">'+esc2((blk.meta||lang))+'</span><span class="sp"></span>';
    const cp=document.createElement('button'); cp.className='code-copy'; cp.textContent='复制源码';
    cp.addEventListener('click',()=>copyText(code).then(()=>toast('源码已复制')).catch(()=>toast('复制失败',true)));
    tools.appendChild(cp); wrap.appendChild(tools);
    const body=document.createElement('div'); body.className='embed-body'; wrap.appendChild(body);
    const put=h=>{ body.innerHTML=h; return wrap; };
    const putNode=n=>{ body.appendChild(n); return wrap; };

    /* 可运行 HTML：```html / ```html:run / ```embed / ```frame
       注意 mode==='run' 也会被 ```js:run 用到，这里只按语言判定，避免抢走脚本围栏 */
    if(lang==='html'||lang==='htm'||lang==='embed'||lang==='frame'||lang==='raw'||lang==='data'){
      if(mode==='inline'||F.inline||A.mode==='inline'){
        const box=document.createElement('div'); box.className='pv-htmlbox';
        box.innerHTML='<div class="html-view">'+code+'</div>'+
          '<details class="src-toggle"><summary>&lt;/&gt; 查看 / 复制原始 HTML</summary>'+
          '<pre class="g-pre">'+esc2(code)+'</pre></details>';
        return putNode(box);
      }
      const src=(lang==='raw'||lang==='data')&&/^data:/i.test(code.trim())
        ? '<iframe src="'+attr(code.trim())+'" style="width:100%;height:100%;border:0"></iframe>' : code;
      const f=liveFrame(title,src,{height:Number(A.height||A.h||S.frameH),head:A.head||'',bg:A.bg||'',fg:A.fg||'',plain:A.plain==='true'||F.noframe==true,lang:'html',fname:realName});
      if(typeof f==='string') return put(f);
      return putNode(f);
    }
    /* 直接内联 SVG */
    if(lang==='svg'){
      if(!S.svgInline) return put('<pre class="g-pre">'+esc2(code)+'</pre>');
      const svg=code.trim().indexOf('<svg')===0?code.trim():'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">'+code+'</svg>';
      const box=document.createElement('div'); box.className='pv-svgbox';
      box.innerHTML='<div class="html-view" style="overflow-x:auto;text-align:center">'+svg+'</div>'+
        '<details class="src-toggle"><summary>&lt;/&gt; 查看 / 复制 SVG 源码</summary>'+
        '<pre class="g-pre">'+esc2(code)+'</pre></details>';
      const bar=document.createElement('div'); bar.className='live-tools';
      bar.innerHTML='<span class="lt-tag">◈ 内联 SVG</span><span class="lt-name">'+esc2(title)+'</span><span class="sp"></span>'+
        '<button type="button" data-svgsave="svg">⬇ SVG</button><button type="button" data-svgsave="png">⬇ PNG</button><button type="button" data-svgsave="copy">❐ 复制</button>';
      box.insertBefore(bar,box.firstChild);
      box.dataset.svg=svg;
      return putNode(box);
    }
    /* CSS 注入预览 */
    if(lang==='css'){
      if(S.openMode){ const st=document.createElement('style'); st.textContent=code; body.appendChild(st); }
      return put('<div class="pv-raw"><b>◈ 已注入 CSS</b> · 这段样式作用于整个预览区（含本卡片）。'+
        '可用于自定义任意 class、字体、颜色、动画。<br>共 '+code.split('\n').length+' 行。'+
        (S.openMode?'':' <b style="color:#f59e0b">开放渲染已关闭，样式未生效。</b>')+
        '<details class="src-toggle"><summary>&lt;/&gt; 查看 / 复制原始 CSS</summary>'+
        '<pre class="g-pre">'+esc2(code)+'</pre></details></div>');
    }
    /* 纯脚本沙箱运行 */
    if((lang==='js'||lang==='javascript'||lang==='js:run')&&(mode==='run'||F.run)){
      const doc='<div id="out" style="padding:6px 2px"></div><scr'+'ipt>\n'+code+'\n<\/scr'+'ipt>';
      const f=liveFrame(title+' · 脚本沙箱',doc,{height:Number(A.height||180),lang:'javascript'});
      return typeof f==='string'?put(f):putNode(f);
    }
    /* iframe 嵌入（src 或 srcdoc） */
    if(lang==='iframe'){
      const u=code.trim().split('\n')[0].trim();
      const inner='<iframe src="'+attr(u)+'" style="width:100%;height:100%;border:0;background:#fff" loading="lazy" title="嵌入页面"></iframe>';
      const f=liveFrame(title||'嵌入页面',inner,{src:u,height:Number(A.height||S.frameH),lang:'html'});
      return typeof f==='string'?put(f):putNode(f);
    }
    /* 音频 / 视频 / 通用媒体围栏 */
    if(lang==='audio'||lang==='video'||lang==='media'||lang==='player'){
      const cfg={}; code.split(/\r?\n/).forEach(l=>{
        const m=l.match(/^\s*(src|url|title|desc|poster|loop|autoplay|muted|controls|name)\s*[:：]\s*(.+)$/i);
        if(m) cfg[m[1].toLowerCase()]=m[2].trim();
      });
      if(!cfg.src) cfg.src=code.trim().split('\n')[0].trim();
      const kind=lang==='audio'?'audio':lang==='video'?'video':dataKind(cfg.src).kind;
      const k=kind==='image'||kind==='other'?'audio':kind;
      return put(mediaCard(k,cfg.title||title,cfg.src,{loop:/^(1|true|yes)$/i.test(cfg.loop||''),
        autoplay:/^(1|true|yes)$/i.test(cfg.autoplay||''),muted:/^(1|true|yes)$/i.test(cfg.muted||''),
        desc:cfg.desc||'',name:cfg.name}));
    }
    /* 数据图表 */
    if(lang==='chart'){
      const r=chartSVG(code);
      return put(r.err?'<div class="pv-chart"><div class="ch-err">'+esc2(r.err)+'</div></div>':r.html);
    }
    if(lang==='csv') return put(csvTable(code));
    if(lang==='json') return put(jsonView(code));
    /* 嵌套 Markdown：```md 直接走 marked，不引入无法回收的占位符 */
    if(lang==='md'||lang==='markdown'){
      let h=''; try{ h=marked.parse(code); }catch(e){ h='<div class="pv-raw">'+esc2(e.message)+'</div>'; }
      return put('<div class="pv-raw" style="background:var(--pv-tint)">'+h+'</div>');
    }
    /* 公式围栏 */
    if(lang==='math'||lang==='latex'||lang==='tex'){
      const box=document.createElement('div'); box.className='math-block';
      box.innerHTML='<span class="math-label">∑&nbsp;公式</span>';
      const srcd=document.createElement('div'); srcd.className='math-src'; srcd.textContent='\\['+code+'\\]';
      box.appendChild(srcd); return putNode(box);
    }
    return null;
  }

  buildCodeBlock=function(blk){
    const lang=(blk.lang||'').toLowerCase(), mode=String(blk.mode||blk.filename||'').toLowerCase();
    if(OPEN_LANGS.has(lang)||mode==='run'||blk.flags&&blk.flags.run){
      const r=buildOpen(blk); if(r) return r;
    }
    const w=_buildCodeBlock(blk);
    if(lang==='mermaid'){
      const tools=w.querySelector('.pre-tools');
