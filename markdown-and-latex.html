## LaTeX 公式

### 行内公式（多种语法）

- 美元符号：$E = mc^2$ 和 $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$
- 反斜杠括号：\( \alpha + \beta = \gamma \) 和 \( \sin^2\theta + \cos^2\theta = 1 \)

### 行间公式（多种语法）

美元符号：

$$
\int_{-\infty}^{\infty} e^{-x^2}\, dx = \sqrt{\pi}
$$

反斜杠方括号：

\[
\sum_{i=1}^{n} i = \frac{n(n+1)}{2}
\]

### 更多公式

- 欧拉恒等式：$e^{i\pi} + 1 = 0$
- 带下标：$F_n = F_{n-1} + F_{n-2}$
- 嵌套在列表中：$a_{ij}^{(k)}$
- 行间复杂公式：

$$
\oint_C \vec{B} \cdot \mathrm{d}\vec{l} = \mu_0 \left( I_\text{enc} + \varepsilon_0 \frac{\mathrm{d}\Phi_E}{\mathrm{d}t} \right)
$$

- 使用 `\[ \]` 的行间公式：

\[
\mathcal{L} = \frac{1}{4\pi} \left[ \frac{G M}{r^2} \right]
\]

<script>
/* ================= 基础工具 ================= */
const $ = id => document.getElementById(id);
const editor = $('editor'), output = $('output'), workspace = $('workspace'),
      editorPanel = $('editorPanel'), splitter = $('splitter');

const LS_KEY = 'md-latex-renderer-src';
let SAMPLE = '';
let debounceTimer = null;
let mathJaxWarned = false;

let toastTimer;
function toast(msg, isError){
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function setStatus(mode){
  const map = {
    rendering: ['渲染中…', '#d29922'],
    done:      ['渲染完成', '#3fb950'],
    exporting: ['正在导出图片…', '#58a6ff'],
    error:     ['出现错误', '#f85149'],
    idle:      ['就绪', '#8a91a7']
  };
  const m = map[mode] || map.idle;
  $('statusText').textContent = m[0];
  $('statusDot').style.background = m[1];
}

function updateStats(ms){
  const v = editor.value;
  $('statChars').textContent = v.length;
  $('statLines').textContent = v ? v.split('\n').length : 0;
  if (typeof ms === 'number') $('statTime').textContent = ms.toFixed(1) + ' ms';
}

function saveSrc(){ try { localStorage.setItem(LS_KEY, editor.value); } catch(e){} }

function copyText(text){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy') ? resolve() : reject(new Error('copy failed')); }
    catch(e){ reject(e); }
    ta.remove();
  });
}

/* ================= 解析规则 ================= */
marked.setOptions({ gfm: true, breaks: true });

const FENCE_RE       = /```([^\n`]*)\n([\s\S]*?)```/g;   // 围栏代码块
const INLINE_CODE_RE = /`([^`\n]+)`/g;                    // 行内代码
const BLOCK_MATH_RE  = [ /\$\$([\s\S]+?)\$\$/g, /\\\[([\s\S]+?)\\\]/g ];
const INLINE_MATH_RE = [ /\\\(([\s\S]+?)\\\)/g, /\$([^\$\n]+?)\$/g ];

/* 在 DOM 中查找指定内容的注释节点 */
function findComment(root, label){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_COMMENT);
  let n;
  while ((n = walker.nextNode())) {
    if (n.textContent === label) return n;
  }
  return null;
}

/* 若注释独占一个 <p>，则整体替换该 <p>，否则只替换注释本身 */
function parentHasOtherContent(p, except){
  for (const n of p.childNodes) {
    if (n === except) continue;
    if (n.nodeType === Node.TEXT_NODE) { if (n.textContent.trim() !== '') return true; }
    else return true;
  }
  return false;
}
function replaceNodeWithBlock(comment, el){
  const parent = comment.parentNode;
  if (!parent) return;
  if (parent.tagName === 'P' && !parentHasOtherContent(parent, comment)) {
    parent.parentNode.replaceChild(el, parent);
  } else {
    parent.replaceChild(el, comment);
  }
}

/* ================= 渲染主流程 ================= */
function render(){
  const t0 = performance.now();
  setStatus('rendering');
  try {
    if (!window.marked) throw new Error('marked.js 加载失败，请检查网络');
    let text = editor.value;
    const codeBlocks = [], inlineCodes = [], maths = [];

    /* 1. 提取围栏代码块（最先保护，防止其中的 $ 被当作公式） */
    text = text.replace(FENCE_RE, (m, lang, code) => {
      codeBlocks.push({ lang: lang.trim(), code: code.replace(/\n$/, '') });
      return '\n<!--@CB' + (codeBlocks.length - 1) + '-->\n';
    });

    /* 2. 提取行内代码 */
    text = text.replace(INLINE_CODE_RE, (m, code) => {
      inlineCodes.push(code);
      return '<!--@IC' + (inlineCodes.length - 1) + '-->';
    });

    /* 3. 提取块级公式 */
    BLOCK_MATH_RE.forEach(re => {
      text = text.replace(re, (m, body) => {
        maths.push({ display: true, body: body.trim() });
        return '\n<!--@MB' + (maths.length - 1) + '-->\n';
      });
    });

    /* 4. 提取行内公式 */
    INLINE_MATH_RE.forEach(re => {
      text = text.replace(re, (m, body) => {
        maths.push({ display: false, body: body.trim() });
        return '<!--@MI' + (maths.length - 1) + '-->';
      });
    });

    /* 5. Markdown 解析 */
    output.innerHTML = marked.parse(text);

    /* 6. 还原代码块 */
    codeBlocks.forEach((blk, i) => {
      const c = findComment(output, '@CB' + i);
      if (!c) return;
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      if (blk.lang) code.className = 'language-' + blk.lang;
      code.textContent = blk.code;
      pre.appendChild(code);

      const tools = document.createElement('div');
      tools.className = 'pre-tools';
      if (blk.lang) {
        const tag = document.createElement('span');
        tag.className = 'code-lang';
        tag.textContent = blk.lang;
        tools.appendChild(tag);
      }
      const btn = document.createElement('button');
      btn.className = 'code-copy';
      btn.textContent = '复制';
      btn.addEventListener('click', () => {
        copyText(blk.code).then(() => {
          btn.textContent = '已复制';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
        }).catch(() => toast('复制失败', true));
      });
      tools.appendChild(btn);
      pre.appendChild(tools);
      replaceNodeWithBlock(c, pre);
    });

    /* 7. 还原行内代码 */
    inlineCodes.forEach((codeStr, i) => {
      const c = findComment(output, '@IC' + i);
      if (!c) return;
      const el = document.createElement('code');
      el.textContent = codeStr;
      c.parentNode.replaceChild(el, c);
    });

    /* 8. 还原公式（交给 MathJax 排版） */
    maths.forEach((m, i) => {
      const label = m.display ? '@MB' + i : '@MI' + i;
      const c = findComment(output, label);
      if (!c) return;
      const el = document.createElement(m.display ? 'div' : 'span');
      el.textContent = m.display ? '\\[' + m.body + '\\]' : '\\(' + m.body + '\\)';
      if (m.display) replaceNodeWithBlock(c, el);
      else c.parentNode.replaceChild(el, c);
    });

    typesetMath(output);
    setStatus('done');
  } catch (err) {
    console.error('渲染错误:', err);
    setStatus('error');
    toast('渲染出错：' + err.message, true);
  }
  updateStats(performance.now() - t0);
}

/* MathJax 排版（异步加载，做等待处理） */
function typesetMath(root){
  if (!root.querySelector('span, div')) return;
  const run = () => MathJax.typesetPromise([root]).catch(e => console.error('MathJax:', e));
  if (window.MathJax && MathJax.typesetPromise) { run(); return; }
  let waited = 0;
  const timer = setInterval(() => {
    waited += 120;
    if (window.MathJax && MathJax.typesetPromise) { clearInterval(timer); run(); }
    else if (waited > 12000) {
      clearInterval(timer);
      if (!mathJaxWarned) { mathJaxWarned = true; toast('MathJax 未加载，公式将以源码显示', true); }
    }
  }, 120);
}

/* ================= 导出图片 ================= */
async function exportImage(){
  if (!output.querySelector('*')) { toast('预览区为空，无法导出', true); return; }
  if (!window.htmlToImage) { toast('导出组件未加载，请检查网络后刷新', true); return; }

  const btn = $('btnExport');
  const fontSize = $('exportFont').value;
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>生成中…';
  setStatus('exporting');

  let stage = null;
  try {
    /* 离屏舞台：固定宽度 + 小字号 + 紧凑样式，让导出的图更短更紧凑 */
    stage = document.createElement('div');
    stage.style.cssText = 'position:fixed;left:-100000px;top:0;pointer-events:none;';

    const capture = document.createElement('div');
    capture.className = 'export-compact';
    capture.style.cssText = 'width:880px;padding:24px 30px;background:#ffffff;color:#24292f;line-height:1.6;font-size:' + fontSize + 'px;';

    const clone = output.cloneNode(true);
    clone.removeAttribute('id');
    clone.style.cssText = 'padding:0;margin:0;overflow:visible;min-height:0;flex:none;';
    capture.appendChild(clone);
    stage.appendChild(capture);
    document.body.appendChild(stage);

    /* 等待布局稳定 */
    await new Promise(r => setTimeout(r, 160));
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e){}

    const dataUrl = await htmlToImage.toPng(capture, {
      pixelRatio: 2,              // 2 倍清晰度
      backgroundColor: '#ffffff'
    });

    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    const name = 'render_' + now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) +
                 '_' + p(now.getHours()) + p(now.getMinutes()) + p(now.getSeconds()) + '.png';
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();

    toast('图片已导出（字号 ' + fontSize + 'px · 2x 清晰）');
    setStatus('done');
  } catch (err) {
    console.error('导出失败:', err);
    toast('导出失败：' + (err && err.message ? err.message : '未知错误（外部图片跨域可能导致失败）'), true);
    setStatus('error');
  } finally {
    if (stage) stage.remove();
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

/* ================= 事件绑定 ================= */
$('btnRender').addEventListener('click', render);
$('btnExport').addEventListener('click', exportImage);

$('btnSample').addEventListener('click', () => {
  editor.value = SAMPLE; saveSrc(); render(); toast('已载入示例');
});
$('btnClear').addEventListener('click', () => {
  editor.value = ''; saveSrc(); render(); toast('已清空');
});

editor.addEventListener('input', () => {
  saveSrc();
  updateStats();
  if ($('liveRender').checked) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 500);
  }
});

/* Tab 插入两个空格 */
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    editor.setRangeText('  ', editor.selectionStart, editor.selectionEnd, 'end');
    editor.dispatchEvent(new Event('input'));
  }
});

/* 全局快捷键：Ctrl+Enter 渲染，Ctrl+S 导出图片 */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); render(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); exportImage(); }
});

/* 分栏拖动 */
let dragging = false;
splitter.addEventListener('pointerdown', e => {
  dragging = true;
  splitter.setPointerCapture(e.pointerId);
  splitter.classList.add('active');
});
splitter.addEventListener('pointermove', e => {
  if (!dragging) return;
  const rect = workspace.getBoundingClientRect();
  let pct = (e.clientX - rect.left) / rect.width * 100;
  pct = Math.min(80, Math.max(20, pct));
  editorPanel.style.flex = '0 0 ' + pct + '%';
});
splitter.addEventListener('pointerup', () => {
  dragging = false;
  splitter.classList.remove('active');
});
splitter.addEventListener('dblclick', () => { editorPanel.style.flex = ''; });

/* ================= 初始化 ================= */
SAMPLE = editor.value;
try {
  const saved = localStorage.getItem(LS_KEY);
  if (saved !== null) editor.value = saved;
} catch(e){}
updateStats();
render();
</script>
