<!-- ==================== 应用外壳样式 ==================== -->
<style>
:root{
  color-scheme:dark;
  --a-bg:#0a0c14; --a-panel:#121522; --a-panel2:#1a1e30;
  --a-line:rgba(255,255,255,.09); --a-line2:rgba(255,255,255,.15);
  --a-fg:#eef0f8; --a-dim:#8d94ac; --a-faint:#606784;
  --violet:#7c5cff; --pink:#c084fc; --cyan:#38bdf8; --green:#3ddc97; --red:#ff6b78;
  --grad:linear-gradient(135deg,#7c5cff 0%,#a855f7 46%,#38bdf8 100%);
  --grad2:linear-gradient(135deg,#7c5cff,#c084fc);
  --shadow:0 14px 40px rgba(0,0,0,.38);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--a-fg);
  background:
    radial-gradient(760px 480px at 88% -8%,rgba(124,92,255,.22),transparent 62%),
    radial-gradient(660px 460px at -12% 108%,rgba(56,189,248,.16),transparent 62%),
    var(--a-bg);
  display:flex;flex-direction:column;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(9px + var(--safe-t)) 14px 9px;
  border-bottom:1px solid var(--a-line);
  background:rgba(15,18,30,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.logo{
  width:36px;height:36px;flex:none;border-radius:12px;background:var(--grad);
  display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;
  box-shadow:0 6px 18px rgba(124,92,255,.42);position:relative;
}
.logo::after{content:'';position:absolute;inset:0;border-radius:12px;border:1px solid rgba(255,255,255,.28)}
.brand-txt{min-width:0;flex:1}
.brand-txt b{display:block;font-size:13.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{display:block;font-size:10px;color:var(--a-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.045);border:1px solid var(--a-line);
  color:var(--a-dim);transition:.18s;flex:none;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{color:#c9bcff;border-color:rgba(124,92,255,.5);background:rgba(124,92,255,.16)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 语法快捷条 ---------- */
.toolstrip{
  flex:none;display:flex;gap:7px;overflow-x:auto;padding:9px 14px 10px;
  border-bottom:1px solid var(--a-line);scrollbar-width:none;
  background:rgba(10,12,20,.42);
}
.toolstrip::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:30px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:600;
  color:#c4c9dd;background:var(--a-panel2);border:1px solid var(--a-line);
  display:inline-flex;align-items:center;gap:5px;transition:.16s;white-space:nowrap;
}
.chip:active{transform:scale(.94);background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.5);color:#e6dcff}
.chip.hot{background:linear-gradient(135deg,rgba(124,92,255,.24),rgba(56,189,248,.16));border-color:rgba(124,92,255,.42);color:#ddd3ff}
.chip .k{font-family:ui-monospace,monospace;font-size:10px;opacity:.6}

/* ---------- 工作区 ---------- */
.stage{flex:1;display:flex;min-height:0;padding:10px;gap:10px;position:relative}
.pane{
  display:flex;flex-direction:column;min-height:0;min-width:0;
  border-radius:18px;overflow:hidden;border:1px solid var(--a-line);
  background:var(--a-panel);box-shadow:var(--shadow);
}
.editor-pane{flex:1 1 50%}
.preview-pane{flex:1 1 50%}
body[data-view="edit"] .preview-pane,
body[data-view="preview"] .editor-pane{display:none}
body[data-view="edit"] .editor-pane,
body[data-view="preview"] .preview-pane{flex:1 1 100%}
.pane-head{
  flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--a-line);background:rgba(255,255,255,.025);
}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.dot.g{background:var(--green)}.dot.v{background:var(--pink)}.dot.c{background:var(--cyan)}
.pane-title{font-size:10.5px;font-weight:700;letter-spacing:1.1px;color:#aeb5cd;text-transform:uppercase}
.pane-head .sp{flex:1}
.mini{
  font-size:11px;padding:5px 10px;border-radius:8px;color:var(--a-dim);
  border:1px solid var(--a-line);background:rgba(255,255,255,.03);transition:.15s;
}
.mini:active{background:rgba(124,92,255,.2);color:#fff}

/* 编辑器 */
.editor-wrap{flex:1;display:flex;min-height:0;position:relative}
#editor{
  flex:1;width:100%;border:0;outline:0;resize:none;
  background:#0e111b;color:#dfe4f2;
  font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,Menlo,monospace;
  font-size:16px;line-height:1.78;padding:16px 16px 40px;
  caret-color:#b79bff;-webkit-font-smoothing:antialiased;
}
#editor::placeholder{color:#4a5069}
#editor::selection{background:rgba(124,92,255,.4)}
.editor-foot{
  position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;
  padding:7px 10px;background:linear-gradient(0deg,rgba(14,17,27,.98),rgba(14,17,27,0));
  pointer-events:none;
}
.editor-foot .mini{pointer-events:auto;backdrop-filter:blur(6px)}

/* 预览外框 */
.preview-tools{
  flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;
  border-bottom:1px solid var(--a-line);background:rgba(255,255,255,.025);overflow-x:auto;scrollbar-width:none;
}
.preview-tools::-webkit-scrollbar{display:none}
.theme-pill{
  flex:none;font-size:11px;padding:5px 10px;border-radius:999px;
  color:var(--a-dim);border:1px solid var(--a-line);background:rgba(255,255,255,.03);
}
.theme-pill.on{color:#fff;background:var(--grad2);border-color:transparent;font-weight:600}
.demo-hint{
  flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;
  font-size:11.5px;color:#cbbcff;background:linear-gradient(90deg,rgba(124,92,255,.16),rgba(56,189,248,.08));
  border-bottom:1px solid rgba(124,92,255,.22);
}
.demo-hint b{color:#fff}
.demo-hint .go{margin-left:auto;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.12);font-size:11px;font-weight:600}
.demo-hint[hidden]{display:none}
#output{flex:1;overflow:auto;min-height:0;position:relative;-webkit-overflow-scrolling:touch}
#output::-webkit-scrollbar-thumb{background:rgba(120,130,160,.28)}
#output::-webkit-scrollbar-thumb:hover{background:rgba(120,130,160,.45)}

/* 空状态 */
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:40px 24px;color:var(--a-dim);
}
.empty .art{
  width:88px;height:88px;border-radius:26px;background:var(--grad);
  display:grid;place-items:center;font-size:40px;color:#fff;
  box-shadow:0 16px 40px rgba(124,92,255,.35);transform:rotate(-6deg);
}
.empty h3{margin:6px 0 0;font-size:16px;color:var(--a-fg)}
.empty p{margin:0;font-size:12.5px;line-height:1.7;max-width:260px}
.empty button{margin-top:6px;padding:9px 18px;border-radius:11px;background:var(--grad2);color:#fff;font-size:12.5px;font-weight:700}

/* 分隔条（桌面） */
.splitter{flex:0 0 12px;display:none;cursor:col-resize;position:relative;touch-action:none}
.splitter::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4px;height:44px;border-radius:6px;background:rgba(255,255,255,.14)}
.splitter.active::after{background:var(--violet)}
@media (min-width:861px){body[data-view="split"] .splitter{display:block}}
@media (max-width:860px){
  .stage{flex-direction:column;padding:8px;gap:8px}
  body[data-view="split"] .editor-pane,body[data-view="split"] .preview-pane{flex:1 1 50%}
  .splitter{display:none!important}
}

/* ---------- 状态条 / 底部导航 ---------- */
.statusbar{
  flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px;
  font-size:10.5px;color:var(--a-faint);border-top:1px solid var(--a-line);
  background:rgba(10,12,20,.5);
}
.statusbar .sdot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.statusbar b{color:#b9c0d6;font-weight:600}
.statusbar .sp{flex:1}
.statusbar .more{color:#aeb6cd}
.tabbar{
  flex:none;display:flex;align-items:stretch;gap:4px;padding:6px 8px calc(6px + var(--safe-b));
  border-top:1px solid var(--a-line);
  background:rgba(15,18,30,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.tab{
  flex:1;min-height:50px;border-radius:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--a-faint);
  font-size:10.5px;font-weight:600;transition:.18s;position:relative;
}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#ded4ff;background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(56,189,248,.1))}
.tab.on::before{content:'';position:absolute;top:5px;width:20px;height:3px;border-radius:3px;background:var(--grad)}
.fab{
  position:absolute;right:16px;bottom:calc(100px + var(--safe-b));
  width:54px;height:54px;border-radius:19px;background:var(--grad);
  display:grid;place-items:center;color:#fff;z-index:25;
  box-shadow:0 12px 30px rgba(124,92,255,.5),0 2px 0 rgba(255,255,255,.2) inset;
  transition:.2s;
}
.fab:active{transform:scale(.9)}
.fab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab.busy{opacity:.75;pointer-events:none}
.spin{width:20px;height:20px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 底部抽屉 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(4,6,12,.62);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.25s;z-index:40;
}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-height:min(86vh,760px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1a1e30 0%,#121624 100%);
  border-top:1px solid var(--a-line2);border-radius:24px 24px 0 0;
  box-shadow:0 -18px 50px rgba(0,0,0,.5);
  transform:translateY(102%);transition:transform .32s cubic-bezier(.22,1,.36,1);
  padding-bottom:var(--safe-b);
}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.24);margin:9px auto 2px;flex:none}
.sheet-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 18px 12px;border-bottom:1px solid var(--a-line)}
.sheet-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.3px}
.sheet-head .sp{flex:1}
.sheet-head .x{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);color:var(--a-dim);font-size:15px;display:grid;place-items:center}
.sheet-body{flex:1;overflow:auto;padding:14px 16px 26px;-webkit-overflow-scrolling:touch}
.sec{margin-bottom:18px}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--a-faint);text-transform:uppercase;margin:0 0 9px 3px}
.card{background:rgba(255,255,255,.035);border:1px solid var(--a-line);border-radius:15px;overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--a-line);min-height:50px}
.row:last-child{border-bottom:0}
.row .ri{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(124,92,255,.16);color:#cbbcff;font-size:15px}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:13px;font-weight:600}
.row .rt small{display:block;font-size:10.5px;color:var(--a-faint);margin-top:2px;line-height:1.45}
.row .rv{font-size:11.5px;color:var(--a-dim);flex:none}
.row.act:active{background:rgba(124,92,255,.12)}
.seg{display:flex;gap:5px;padding:5px;background:rgba(0,0,0,.22);border-radius:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:8px 6px;border-radius:9px;font-size:11.5px;color:var(--a-dim);font-weight:600;transition:.16s}
.seg button.on{background:var(--grad2);color:#fff;box-shadow:0 3px 10px rgba(124,92,255,.3)}
.sw{position:relative;width:42px;height:24px;border-radius:999px;background:#333950;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#98a0ba;transition:.2s}
.sw.on{background:var(--violet)}
.sw.on::after{left:21px;background:#fff}
.range-row{padding:13px 14px;border-bottom:1px solid var(--a-line)}
.range-row:last-child{border-bottom:0}
.range-lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}
.range-lab b{color:#cdbcff;font-weight:700}
input[type=range]{width:100%;height:5px;border-radius:5px;background:#333950;appearance:none;-webkit-appearance:none;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:4px solid var(--violet);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--violet)}
.inp{
  width:100%;background:rgba(0,0,0,.25);border:1px solid var(--a-line);
  border-radius:11px;padding:11px 13px;color:var(--a-fg);font-size:13px;outline:none;
}
.inp:focus{border-color:rgba(124,92,255,.65)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.6}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;font-size:13px;font-weight:650;transition:.16s;
  background:rgba(255,255,255,.06);border:1px solid var(--a-line);color:var(--a-fg);
}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.35)}
.btn.ghost{background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.4);color:#d3c6ff}
.btn.danger{color:#ffb3bb;border-color:rgba(255,107,120,.35);background:rgba(255,107,120,.1)}
.btn.full{width:100%}
.btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.btn-grid .btn{padding:12px 8px;font-size:12px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat-cell{background:rgba(255,255,255,.04);border:1px solid var(--a-line);border-radius:13px;padding:13px 8px;text-align:center}
.stat-cell b{display:block;font-size:19px;font-weight:750;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-cell small{display:block;font-size:10px;color:var(--a-faint);margin-top:4px}
.toc-list{display:flex;flex-direction:column;gap:2px}
.toc-item{
  display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;
  font-size:12.5px;color:#c3cadb;border-left:2px solid transparent;transition:.15s;line-height:1.45;
}
.toc-item.lv2{padding-left:24px;font-size:12px}
.toc-item.lv3{padding-left:38px;font-size:11.5px;color:var(--a-dim)}
.toc-item.lv4,.toc-item.lv5,.toc-item.lv6{padding-left:50px;font-size:11px;color:var(--a-faint)}
.toc-item.on{background:rgba(124,92,255,.14);border-left-color:var(--violet);color:#fff}
.snap-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--a-line)}
.snap-item:last-child{border-bottom:0}
.snap-item .si{flex:1;min-width:0}
.snap-item .si b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap-item .si small{display:block;font-size:10.5px;color:var(--a-faint);margin-top:3px}
.snap-item button{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--a-dim);font-size:13px;flex:none}
.empty-note{text-align:center;color:var(--a-faint);font-size:12px;padding:26px 10px;line-height:1.8}
.find-res{font-size:11.5px;color:var(--a-dim);margin:8px 3px 0}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,14px);
  max-width:84vw;padding:10px 16px;border-radius:13px;font-size:12.5px;line-height:1.5;
  background:rgba(28,32,50,.96);border:1px solid var(--a-line2);color:#fff;
  box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:60;
  backdrop-filter:blur(12px);text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:rgba(255,107,120,.6);background:rgba(58,26,34,.96)}

/* 图片放大 */
.lightbox{
  position:fixed;inset:0;z-index:70;background:rgba(5,7,12,.94);
  display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);
}
.lightbox.show{display:flex;animation:fade .2s}
.lightbox img{max-width:100%;max-height:86vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lightbox .lb-x{position:absolute;top:calc(18px + var(--safe-t));right:18px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);font-size:19px;color:#fff}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 专注模式 */
.focus-exit{display:none;position:fixed;top:calc(14px + var(--safe-t));right:14px;z-index:30;padding:9px 14px;border-radius:11px;background:rgba(124,92,255,.9);color:#fff;font-size:12px;font-weight:600}
body.focus .topbar,body.focus .toolstrip,body.focus .statusbar,body.focus .tabbar,body.focus .fab{display:none}
body.focus .stage{padding:0}
body.focus .pane{border:0;border-radius:0}
body.focus .pane-head{display:none}
body.focus .focus-exit{display:block}

<script>
/* =========================================================

const $ = id => document.getElementById(id);

const K = {

};
const DEF = {

/* ---------- 基础工具 ---------- */
function toast(msg, err){

  t.classList.toggle('err', !!err);
  t.classList.add('show');

function buzz(){ if(S.haptic && navigator.vibrate) try{ navigator.vibrate(8); }catch(e){} }
function status(txt, color){

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function copyText(text){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((res, rej)=>{
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.cssText='position:fixed;opacity:0;top:0'; document.body.appendChild(ta);

function download(blob, name){

/* ---------- 视图 ---------- */

/* =========================================================
   Markdown 编译 v4
   逐行块扫描 + 私有区文本占位符，彻底避开 HTML 注释在
   嵌套列表 / 引用 / 表格单元格 / details 容器内丢失的问题。
   强调一律交给 marked 自身，不再注入 <strong> 破坏嵌套。
   ========================================================= */
marked.setOptions({ gfm:true, breaks:true });

const PA='\uE000', PB='\uE001';
const tk=(k,i)=>PA+'TK:'+k+i+PB;
const SEG_RE=/(<[^>]*>|!?\[[^\]]*\]\([^)]*\)|\uE000[\s\S]*?\uE001)/g;

const EMOJI={
  smile:'😄',grin:'😁',joy:'😂',wink:'😉',blush:'😊',heart:'❤️',heart_eyes:'😍',
  thinking:'🤔',sob:'😭',cry:'😢',sunglasses:'😎',cool:'😎',party:'🥳',tada:'🎉',
  rocket:'🚀',fire:'🔥',star:'⭐',sparkles:'✨',zap:'⚡',bulb:'💡',books:'📚',
  memo:'📝',pencil:'✏️',check:'✅',white_check_mark:'✅',x:'❌',warning:'⚠️',
  bug:'🐛',wrench:'🔧',gear:'⚙️',lock:'🔒',key:'🔑',link:'🔗',mag:'🔍',
  thumbsup:'👍','+1':'👍',thumbsdown:'👎','-1':'👎',clap:'👏',wave:'👋',muscle:'💪',
  coffee:'☕',pizza:'🍕',apple:'🍎',sun:'☀️',moon:'🌙',rainbow:'🌈',ocean:'🌊',
  cat:'🐱',dog:'🐶',unicorn:'🦄',ghost:'👻',robot:'🤖',alien:'👽',seedling:'🌱',
  info:'ℹ️',question:'❓',exclamation:'❗',construction:'🚧',hourglass:'⏳',
  package:'📦',chart:'📈',computer:'💻',phone:'📱',bulb2:'💡',100:'💯'
};
const ADMO_TYPES=['info','tip','success','warning','danger','note','question','example','quote','abstract','hint','cite','error','attention','caution','fail','bug','todo','summary','faq'];
const ADMO_ICONS={info:'i',tip:'✦',success:'✓',warning:'!',danger:'×',note:'✎',question:'?',example:'▤',quote:'❝',abstract:'▧',hint:'✧',cite:'❞',error:'!',attention:'!',caution:'!',fail:'×',bug:'◈',todo:'☐',summary:'≡',faq:'?'};
const ADMO_NAMES={info:'说明',tip:'提示',success:'成功',warning:'注意',danger:'警告',note:'笔记',question:'问答',example:'示例',quote:'引述',abstract:'摘要',hint:'技巧',cite:'引用',error:'错误',attention:'注意',caution:'小心',fail:'失败',bug:'缺陷',todo:'待办',summary:'小结',faq:'常见问题'};

/* ---------- 文本分段：只改写纯文本，不碰 HTML 标签 / 链接 / 占位符 ---------- */
function mapTextSegments(src, fn){
  return src.split(SEG_RE).map(seg=>{
    if(!seg) return seg;
    if(seg.charAt(0)==='<' || seg.charAt(0)===PA ||
       /^!?\[[^\]]*\]\([^)]*\)$/.test(seg)) return seg;
    return fn(seg);
  }).join('');
}
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ---------- 行内扩展语法 ---------- */
function inlineExt(t, abbrs){
  // Emoji 短码 :rocket:
  t=t.replace(/:([a-z0-9_+\-]{1,32}):/gi,(m,k)=>{
    const v=EMOJI[k.toLowerCase()];
    return v? '<span class="pv-emoji" title=":'+esc(k)+':">'+v+'</span>' : m;
  });
  // 键盘按键 [[Ctrl]] + [[C]]
  t=t.replace(/\[\[([^\]\n]+)\]\]/g,(m,k)=>'<kbd>'+esc(k)+'</kbd>');
  // 插入 ++text++
  t=t.replace(/\+\+([^+\n]+)\+\+/g,(m,x)=>'<ins>'+x+'</ins>');
  // 剧透 ||text||
  t=t.replace(/\|\|([^|\n]+)\|\|/g,(m,x)=>'<span class="spoiler" title="点击揭示">'+x+'</span>');
  // 荧光高亮 ==text==
  t=t.replace(/==([^=\n]+)==/g,(m,x)=>'<mark>'+x+'</mark>');
  // 上标 X^2^
  t=t.replace(/\^([^\s^\n]+)\^/g,(m,x)=>'<sup>'+x+'</sup>');
  // 下标 H~2~O（避开 ~~删除线~~）
  t=t.replace(/~([^\s~\n]+)~/g,(m,x,off,whole)=>{
    if(whole.charAt(off-1)==='~'||whole.charAt(off+m.length)==='~') return m;
    return '<sub>'+x+'</sub>';
  });
  // 缩写 *[X]: 全称
  (abbrs||[]).forEach(pair=>{
    const re=new RegExp('(^|[^\\w])('+escRe(pair[0])+')(?=$|[^\\w])','g');
    t=t.replace(re,(m,pre,w)=>pre+'<abbr title="'+esc(pair[1])+'">'+w+'</abbr>');
  });
  return t;
}

/* ---------- 围栏代码块：逐行扫描，支持缩进 / ~~~ / 信息串 ---------- */
function parseInfo(info){
  let m=info.match(/^([^\s:{]+)\s*:\s*([^\s{]+)/);
  if(m) return { lang:m[1], filename:m[2] };
  m=info.match(/title\s*=\s*["']([^"']+)["']/);
  const first=info.split(/\s+/)[0]||'';
  return { lang:first.replace(/^\./,''), filename:m?m[1]:'' };
}
function stripQuote(line, q){
  if(!q) return line;
  if(line.indexOf(q)===0) return line.slice(q.length);
  return line.replace(/^[ \t]*>[ \t]*/,'');
}
function extractFences(src, st){
  const lines=src.split('\n'), out=[]; let i=0;
  while(i<lines.length){
    const m=lines[i].match(/^([ \t]*)((?:>[ \t]*)*)(`{3,}|~{3,})[ \t]*([^\n]*)$/);
    if(!m){ out.push(lines[i]); i++; continue; }
    const indent=m[1], quote=m[2], fence=m[3], info=m[4].trim(), body=[]; i++;
    while(i<lines.length){
      const cm=lines[i].match(/^([ \t]*)(?:>[ \t]*)*(`{3,}|~{3,})[ \t]*$/);
      if(cm && cm[2].charAt(0)===fence.charAt(0) && cm[2].length>=fence.length){ i++; break; }
      const raw=stripQuote(lines[i],quote);
      body.push(raw.indexOf(indent)===0 ? raw.slice(indent.length) : raw);
      i++;
    }
    const p=parseInfo(info);
    const idx=st.code.push({ lang:p.lang, filename:p.filename, code:body.join('\n') })-1;
    // 带引用前缀时不插空行，避免把连续的 blockquote 拆成多块
    if(quote) out.push(quote+tk('C',idx));
    else out.push('', tk('C',idx), '');
  }
  return out.join('\n');
}

/* ---------- 容器 ::: / !!! / ??? / >>> 支持任意深度嵌套 ---------- */
function extractContainers(src, st, depth){
  if(depth>8) return src;
  const lines=src.split('\n'), out=[]; let i=0;
  const OPEN=/^([ \t]*)((?:>[ \t]*)*)(:::|!!!|\?\?\?|>>>)[ \t]*([^\n]*)$/;
  while(i<lines.length){
    const m=lines[i].match(OPEN);
    if(!m || !m[4].trim()){ out.push(lines[i]); i++; continue; }
    const marker=m[3], quote=m[2], head=m[4].trim(), body=[];
    let dep=1; i++;
    while(i<lines.length){
      const om=lines[i].match(OPEN);
      if(om && !om[4].trim()){
        dep--;
        if(dep===0){ i++; break; }
        body.push(stripQuote(lines[i],quote)); i++; continue;
      }
      if(om && om[4].trim()) dep++;
      body.push(stripQuote(lines[i],quote)); i++;
    }
    const inner=marked.parse(compile(body.join('\n'), st, depth+1));
    let html;
    if(marker==='???'||marker==='>>>'||/^(spoiler|details|fold)\b/i.test(head)){
      const title=head.replace(/^(spoiler|details|fold)\b\s*/i,'');
      html='<details class="pv-details"><summary>'+
        (title?marked.parseInline(compile(title,st,depth+1)):'点击展开')+'</summary>'+inner+'</details>';
    }else{
      const hm=head.match(/^([A-Za-z]+)\s*([\s\S]*)$/);
      const rawType=(hm&&hm[1]||'').toLowerCase();
      const t=ADMO_TYPES.indexOf(rawType)>=0?rawType:'note';
      const title=ADMO_TYPES.indexOf(rawType)>=0?(hm[2]||''):head;
      html='<div class="admonition '+t+'"><div class="ad-head"><span class="ad-ico">'+
        (ADMO_ICONS[t]||'✎')+'</span>'+marked.parseInline(compile(title||ADMO_NAMES[t],st,depth+1))+
        '<span class="ad-tag">'+t+'</span></div>'+inner+'</div>';
    }
    const idx=st.raw.push(html)-1;
    if(quote) out.push(quote+tk('R',idx));
    else out.push('', tk('R',idx), '');
  }
  return out.join('\n');
}

/* ---------- 定义列表（PHP Markdown Extra / Pandoc） ---------- */
function extractDefLists(src, st){
  const lines=src.split('\n'), out=[]; let i=0;
  const DEF=/^([ \t]*(?:>[ \t]*)*):[ \t]+(.+)$/;
  while(i<lines.length){
    const dm=lines[i].match(DEF);
    if(dm && out.length){
      const last=out.length-1;
      const quote=dm[1], term=out[last];
      const plain=term.replace(/^[ \t]*(?:>[ \t]*)*/,'');
      if(plain.trim() && !/^[ \t]*(#|>|\||[-*+][ \t]|```|~~~|\d+\.)/.test(plain)){
        const defs=[];
        while(i<lines.length){
          const d=lines[i].match(DEF); if(!d) break;
          defs.push('<dd>'+marked.parseInline(compile(d[2],st,9))+'</dd>');
          i++;
        }
        const html='<dl class="pv-dl"><dt>'+marked.parseInline(compile(plain.trim(),st,9))+'</dt>'+
          defs.join('')+'</dl>';
        const idx=st.raw.push(html)-1;
        out[last]=quote+tk('R',idx);
        continue;
      }
    }
    out.push(lines[i]); i++;
  }
  return out.join('\n');
}

/* ---------- 脚注 ---------- */
function extractFootnotes(src, st){
  const notes=[];
  src=src.replace(/^[ \t]*\[\^([^\]\s]+)\]:[ \t]*(.+)$/gm,(m,id,text)=>{
    notes.push({id,text:text.trim()}); return '';
  });
  if(!notes.length) return src;
  const map={}; notes.forEach((n,i)=>{ n.n=i+1; map[n.id]=n; });
  src=src.replace(/\[\^([^\]\s]+)\]/g,(m,id)=>{
    const n=map[id];
    return n? '<sup class="fnref"><a href="#fn-'+esc(n.id)+'">'+n.n+'</a></sup>' : m;
  });
  const list=notes.map(n=>'<li id="fn-'+esc(n.id)+'">'+
    marked.parseInline(inlineExt(n.text,st.abbrs||[]))+'</li>').join('');
  const idx=st.raw.push('<section class="footnotes"><ol>'+list+'</ol></section>')-1;
  return src+'\n\n'+tk('R',idx)+'\n\n';
}

/* ---------- 缩写定义 ---------- */
function extractAbbrs(src, st){
  const list=[];
  src=src.replace(/^[ \t]*\*\[([^\]]+)\]:[ \t]*(.+)$/gm,(m,k,v)=>{
    list.push([k.trim(),v.trim()]); return '';
  });
  if(list.length) st.abbrs=(st.abbrs||[]).concat(list);
  return src;
}

/* ---------- 图片尺寸 ![alt](url =200x80) ---------- */
function extractImgSizes(src, st){
  return src.replace(/(!\[[^\]]*\]\()([^\s)]+)((?:[ \t]+"[^"]*")?)[ \t]+=(\d+)(?:[x×](\d+))?(\))/g,
    (m,pre,url,title,w,h,end)=>{
      st.imgSizes.push({ src:url, w:Number(w), h:h?Number(h):null });
      return pre+url+(title||'')+end;
    });
}

/* ---------- 逐行块：自定义标题 id / [TOC] / 表标题 / 任务状态 ---------- */
function extractLineBlocks(src, st){
  const lines=src.split('\n');
  return lines.map(line=>{
    // 标题自定义 id  # 标题 {#my-id}
    let m=line.match(/^([ \t]*(?:>[ \t]*)*)(#{1,6}[ \t]+[\s\S]*?)[ \t]+\{#([A-Za-z][\w-]*)\}[ \t]*$/);
    if(m) return m[1]+m[2]+'<span class="h-anchor" data-id="'+esc(m[3])+'"></span>';
    // 文档内目录 [TOC]
    m=line.match(/^([ \t]*(?:>[ \t]*)*)\[TOC\][ \t]*$/i);
    if(m) return m[1] ? m[1]+tk('T',st.tocCount++) : '\n\n'+tk('T',st.tocCount++)+'\n\n';
    // 表标题 Table: xxx
    m=line.match(/^([ \t]*(?:>[ \t]*)*)Table:[ \t]*(.+)$/);
    if(m) return m[1]+'<div class="table-caption">'+esc(m[2])+'</div>';
    // 任务状态 [-] 取消 / [?] 进行中
    m=line.match(/^([ \t]*(?:>[ \t]*)*[-*+][ \t]+)\[([-?])\]([ \t]+)([\s\S]*)$/);
    if(m) return m[1]+'[x]'+m[3]+m[4]+'<span class="task-state" data-s="'+
      (m[2]==='-'?'cancel':'progress')+'"></span>';
    return line;
  }).join('\n');
}

/* ---------- 主编译入口 ---------- */
const BLOCK_MATH=[/\$\$([\s\S]+?)\$\$/g, /\\\[([\s\S]+?)\\\]/g];
const INLINE_MATH=[/\\\(([\s\S]+?)\\\)/g, /\$([^$\n]+?)\$/g];

function compile(src, st, depth){
  depth=depth||0;
  src=extractFences(src,st);
  src=extractContainers(src,st,depth);
  src=extractDefLists(src,st);
  src=extractFootnotes(src,st);
  src=extractAbbrs(src,st);
  src=extractImgSizes(src,st);
  src=extractLineBlocks(src,st);

  // 块级公式
  BLOCK_MATH.forEach(re=>{ src=src.replace(re,(m,body)=>{
    const i=st.math.push({display:true,body:body.trim()})-1;
    return '\n\n'+tk('M',i)+'\n\n';
  }); });
  // 行内代码：支持多反引号与跨行
  src=src.replace(/(`+)([\s\S]*?)\1(?!`)/g,(m,fence,body,off,whole)=>{
    if(body.indexOf(fence)>=0 || whole.charAt(off-1)==='`') return m;
    const i=st.icode.push(body.replace(/\n/g,' '))-1;
    return tk('I',i);
  });
  // 行内公式：避开 \$ 转义、货币金额与 $5 ... $10 误判
  INLINE_MATH.forEach(re=>{ src=src.replace(re,(m,body,off,whole)=>{
    if(off>0 && /[\w\\]/.test(whole.charAt(off-1))) return m;
    if(/^\s|\s$/.test(body)) return m;
    const i=st.math.push({display:false,body:body.trim()})-1;
    return tk('M',i);
  }); });
  // 行内扩展（保护 HTML 标签 / 链接 / 占位符 / 代码）
  src=mapTextSegments(src, seg=>inlineExt(seg, st.abbrs||[]));
  return src;
}

/* ---------- 占位符解析：文本节点级精确替换 ---------- */
function findTokenNode(root, token){
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n=w.nextNode())) if(n.nodeValue.indexOf(token)>=0) return n;
  return null;
}
function replaceToken(root, token, makeNode, block){
  const n=findTokenNode(root,token); if(!n) return false;
  const p=n.parentNode;
  // 块级 token 独占一个段落时，整段替换为块元素（避免 <p><div> 非法嵌套）
  if(block && p && p.tagName==='P' && p.textContent.replace(token,'').trim()===''){
    p.parentNode.replaceChild(makeNode(),p);
    return true;
  }
  const parts=n.nodeValue.split(token), frag=document.createDocumentFragment();
  parts.forEach((s,i)=>{
    if(i>0) frag.appendChild(makeNode());
    if(s) frag.appendChild(document.createTextNode(s));
  });
  p.replaceChild(frag,n);
  return true;
}
function rawFragment(html){
  const d=document.createElement('div'); d.innerHTML=html;
  const f=document.createDocumentFragment();
  while(d.firstChild) f.appendChild(d.firstChild);
  return f;
}

/* ---------- 高亮 + 行号 ---------- */
function wrapHighlightedLines(codeEl){
  const frag = document.createDocumentFragment();
  let lineNo=0, active=[], line, content, cur;
  function newLine(){
    lineNo++;
    line=document.createElement('div'); line.className='code-line';
    const num=document.createElement('span'); num.className='line-no'; num.setAttribute('aria-hidden','true'); num.textContent=lineNo;
    content=document.createElement('span'); content.className='line-content';
    line.appendChild(num); line.appendChild(content); frag.appendChild(line);
    cur=content;
    active.forEach(a=>{ const el=document.createElement(a.tag); if(a.cls) el.className=a.cls; cur.appendChild(el); cur=el; });
  }
  function addText(t){
    t.split('\n').forEach((part,i)=>{ if(i>0) newLine(); if(part) cur.appendChild(document.createTextNode(part)); });
  }
  function walk(node){
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType===3){ addText(ch.nodeValue); }
      else if(ch.nodeType===1){
        const tag=ch.tagName.toLowerCase(), cls=ch.getAttribute('class')||'';
        active.push({tag,cls});
        const clone=ch.cloneNode(false); if(cls) clone.className=cls;
        cur.appendChild(clone);
        const prev=cur; cur=clone; walk(ch); cur=prev; active.pop();
      }
    });
  }
  newLine(); walk(codeEl);
  codeEl.innerHTML=''; codeEl.appendChild(frag);
}
function enhanceCodeBlocks(root){
  root.querySelectorAll('.code-block-wrapper pre code').forEach(code=>{
    const raw = code.dataset.raw !== undefined ? code.dataset.raw : code.textContent;
    code.dataset.raw = raw; code.textContent = raw; code.classList.remove('hljs');
    if(window.hljs && !code.classList.contains('nohighlight')){
      try{ hljs.highlightElement(code); }catch(e){}
    }
    wrapHighlightedLines(code);
  });
}

  if(mermaidLoading) return mermaidLoading;

    const s=document.createElement('script');

    s.onload=()=>res(window.mermaid); s.onerror=()=>rej(new Error('Mermaid 加载失败'));

async function enhanceMermaid(root){

/* ---------- 渲染主流程 ---------- */
function buildMathNode(m){
  if(m.display){
    const box=document.createElement('div'); box.className='math-block';
    const lab=document.createElement('span'); lab.className='math-label'; lab.textContent='∑ 公式';
    const src=document.createElement('div'); src.className='math-src'; src.textContent='\\['+m.body+'\\]';
    box.appendChild(lab); box.appendChild(src); return box;
  }
  const sp=document.createElement('span'); sp.textContent='\\('+m.body+'\\)'; return sp;
}
function typesetMath(root){
  if(!S.math) return Promise.resolve();
  const run = ()=> MathJax.typesetPromise([root]).catch(e=>console.warn('MathJax:',e));
  if(window.MathJax && MathJax.typesetPromise) return run();
  return new Promise(res=>{
    let waited=0;
    const t=setInterval(()=>{
      waited+=150;
      if(window.MathJax && MathJax.typesetPromise){ clearInterval(t); run().then(res); }
      else if(waited>12000){ clearInterval(t); toast('公式引擎未加载，已显示源码',true); res(); }
    },150);
  });
}
async function render(){
  const seq = ++renderSeq;
  status('渲染中…', '#f59e0b');
  const t0 = performance.now();
  try{
    if(!window.marked) throw new Error('Marked 组件未加载，请检查网络');
    const src = editor.value;
    if(!src.trim()){
      output.innerHTML = '<div class="empty"><div class="art">✎</div><h3>还没有内容</h3><p>写下第一行 Markdown，或从示例文档开始，看看排版效果。</p><button id="emptySample">载入示例文档</button></div>';
      $('emptySample').onclick = ()=>{ editor.value=SAMPLE; isSample=true; pushHistory(); saveDoc(); render(); toast('已载入示例'); };
      $('demoHint').hidden = true;
      tocData=[]; lastRenderedSrc=src; updateStats(); status('等待输入', '#8a92a8'); return;
    }
    const st = { code:[], icode:[], math:[], raw:[], abbrs:[], imgSizes:[], tocCount:0 };
    const html = compile(src, st);
    output.innerHTML = marked.parse(html);
    lastRenderedSrc = src;

    // 多轮解析：容器内还会嵌套容器 / 代码块 / 公式，逐轮把新注入的占位符展开
    const jobs=[];
    st.raw.forEach((h,i)=>jobs.push({ t:tk('R',i), make:()=>rawFragment(h), block:true }));
    for(let i=0;i<st.tocCount;i++) jobs.push({ t:tk('T',i), make:()=>{
      const d=document.createElement('nav'); d.className='inline-toc';
      d.innerHTML='<div class="it-t">目录 · CONTENTS</div><div class="it-list"></div>';
      return d;
    }, block:true });
    st.code.forEach((b,i)=>jobs.push({ t:tk('C',i), make:()=>buildCodeBlock(b), block:true }));
    st.icode.forEach((s,i)=>jobs.push({ t:tk('I',i), make:()=>{
      const el=document.createElement('code'); el.textContent=s; return el;
    }, block:false }));
    st.math.forEach((m,i)=>jobs.push({ t:tk('M',i), make:()=>buildMathNode(m), block:m.display }));
    for(let pass=0; pass<8; pass++){
      let changed=false;
      jobs.forEach(j=>{ if(replaceToken(output,j.t,j.make,j.block)) changed=true; });
      if(!changed) break;
    }
    // 清理极端情况下残留的占位符（直接改文本节点，不重建 DOM）
    const tw=document.createTreeWalker(output,NodeFilter.SHOW_TEXT);
    const leftovers=[]; let tn;
    while((tn=tw.nextNode())) if(tn.nodeValue.indexOf(PA)>=0) leftovers.push(tn);
    leftovers.forEach(n=>{ n.nodeValue=n.nodeValue.replace(/\uE000TK:[A-Z]+[^\uE001]*\uE001/g,''); });

    enhanceDOM(output, st);
    enhanceCodeBlocks(output);
    if(seq!==renderSeq) return;
    updateStats();
    const ms = (performance.now()-t0).toFixed(0);
    status('渲染完成 · '+ms+' ms', '#3ddc97');
    $('demoHint').hidden = !isSample;
    typesetMath(output);
    enhanceMermaid(output);
    if(sheetPage==='toc' || sheetPage==='stats') renderSheet();
  }catch(err){
    console.error(err); status('渲染出错', '#ff6b78'); toast('渲染出错：'+err.message, true);
  }
}

/* ---------- 统计 ---------- */
function calcStats(){
  const v=editor.value;
  const cjk=(v.match(/[\u3400-\u9fff]/g)||[]).length;
  const en=(v.replace(/[\u3400-\u9fff]/g,' ').match(/[A-Za-z0-9_'-]+/g)||[]).length;
  return {
    chars:v.length, words:cjk+en, lines:v?v.split('\n').length:0,
    paras:(v.split(/\n\s*\n/).filter(s=>s.trim()).length),
    heads:(v.match(/^#{1,6}\s/gm)||[]).length,
    codes:(v.match(/^(`{3,}|~{3,})/gm)||[]).length/2,
    maths:(v.match(/\$\$|\$\(|\\\(|\\\[/g)||[]).length,
    tables:(v.match(/^\|.+\|\s*$/gm)||[]).length,
    imgs:(v.match(/!\[[^\]]*\]\(/g)||[]).length,
    links:((v.match(/\[[^\]]+\]\(/g)||[]).length) - ((v.match(/!\[[^\]]*\]\(/g)||[]).length),
    notes:(v.match(/^\[\^[^\]]+\]:/gm)||[]).length,
    mins:Math.max(1, Math.ceil((cjk+en)/350))
  };
}
function updateStats(){
  const s=calcStats();
  $('statusStat').textContent = s.words.toLocaleString()+' 字 · 约 '+s.mins+' 分钟';
}

/* ---------- 查找替换 ---------- */
function doFind(dir){
  const q=$('findQ') ? $('findQ').value : '';
  const res=$('findRes');
  if(!q){ findMatches=[]; findAt=-1; if(res) res.textContent='输入关键词开始查找'; return; }

  findMatches=[]; let i=-1;
  while((i=v.indexOf(ql,i+1))>=0){ findMatches.push(i); if(findMatches.length>999) break; }
  if(!findMatches.length){ findAt=-1; if(res) res.textContent='没有找到匹配内容'; return; }
  if(findAt<0 || findAt>=findMatches.length) findAt=0;
  else findAt=(findAt+dir+findMatches.length)%findMatches.length;
  const p=findMatches[findAt];
  if(document.body.dataset.view==='preview') setView('edit');
  editor.focus(); editor.setSelectionRange(p, p+q.length);
  if(res) res.textContent='第 '+(findAt+1)+' / '+findMatches.length+' 处匹配';
}
function doReplace(all){
  const q=$('findQ') ? $('findQ').value : '', r=$('findR') ? $('findR').value : '';
  if(!q){ toast('请先输入查找内容',true); return; }
  const a=editor.selectionStart,b=editor.selectionEnd;
  if(all){
    const n=editor.value.split(q).length-1;
    editor.value=editor.value.split(q).join(r);
    editor.dispatchEvent(new Event('input',{bubbles:true}));
    toast('已替换 '+n+' 处');
  }else{
    if(editor.value.slice(a,b).toLowerCase()!==q.toLowerCase()){ toast('请先选中一处匹配',true); return; }
    editor.setRangeText(r,a,b,'end');
    editor.dispatchEvent(new Event('input',{bubbles:true}));
    toast('已替换 1 处');
  }
  findMatches=[]; findAt=-1;
}

/* ---------- 快照 ---------- */
function saveSnap(){
  const v=editor.value;
  if(!v.trim()){ toast('内容为空，无法保存快照',true); return; }
  if(v.length>60000){ toast('内容过长，快照最多支持约 6 万字符',true); return; }
  const title=(v.match(/^#{1,6}\s*(.+)$/m)||[])[1] || v.replace(/\s+/g,' ').slice(0,24);
  snaps.unshift({id:Date.now(), t:new Date().toLocaleString('zh-CN'), title:title.slice(0,30), text:v});
  snaps=snaps.slice(0,10);
  try{ localStorage.setItem(K.snaps, JSON.stringify(snaps)); }catch(e){ toast('本地空间不足，请删除旧快照',true); }
  toast('快照已保存'); renderSheet();
}

function shareFile(blob, name){
  if(!navigator.share || !navigator.canShare){ download(blob,name); toast('已下载文件'); return; }
  const file=new File([blob],name,{type:blob.type});
  if(!navigator.canShare({files:[file]})){ download(blob,name); toast('当前浏览器不支持分享，已下载'); return; }
  navigator.share({files:[file], title:docTitle()})
    .then(()=>toast('已调起系统分享'))
    .catch(()=>{ download(blob,name); toast('分享未完成，已改为下载'); });
}

/* ---------- 高清长图导出 ---------- */
async function exportImage(preferShare){
  if(!output.querySelector('h1,h2,h3,p,table,ul,ol,blockquote,hr,.code-block-wrapper,.math-block,.admonition,.img-frame,.mermaid-card')){
    toast('预览区为空，无法导出',true); return;
  }
  if(!window.htmlToImage){ toast('导出组件未加载，请检查网络',true); return; }
  const fab=$('btnExport'), orig=fab.innerHTML;
  fab.classList.add('busy'); fab.innerHTML='<span class="spin"></span>';
  status('正在生成图片…','#38bdf8');
  let stage=null;
  try{
    const W = Math.min(1600, Math.max(400, Number(S.exportWidth)||720));
    const FS = Math.min(40, Math.max(9, Number(S.exportSize)||15));
    const want = Math.min(6, Math.max(1, Number(S.exportRatio)||2));
    stage=document.createElement('div');
    stage.style.cssText='position:fixed;left:-200000px;top:0;pointer-events:none;z-index:-1;';
    const cap=document.createElement('div');
    cap.className='export-compact preview-body';
    cap.setAttribute('data-theme','white');
    cap.style.cssText='width:'+W+'px;padding:44px '+(W>=900?'64px':'40px')+' 34px;background:#fff;color:#24292f;'+
      'font-size:'+FS+'px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;'+
      '--pv-bg:#fff;--pv-fg:#24292f;--pv-soft:#4d566e;--pv-mute:#8a92a8;--pv-line:#e7eaf3;--pv-line2:#f0f2f8;'+
      '--pv-card:#f8f9fd;--pv-tint:#f4f1ff;--pv-accent:#7c5cff;--pv-accent2:#38bdf8;--pv-inline-bg:#f3efff;--pv-inline-fg:#6b37d6;';
    const clone=output.cloneNode(true);
    clone.removeAttribute('id');
    clone.setAttribute('data-theme','white');
    clone.style.cssText='padding:0;margin:0;overflow:visible;min-height:0;flex:none;background:transparent;';
    clone.querySelectorAll('details').forEach(d=>d.setAttribute('open',''));
    clone.querySelectorAll('script').forEach(s=>s.remove());
    clone.querySelectorAll('.code-block-wrapper.collapsed').forEach(w=>w.classList.remove('collapsed'));
    clone.querySelectorAll('.code-expand,.code-copy,.code-fade,.table-hint,.empty').forEach(n=>n.remove());
    // 外链图片转 dataURL
    for(const img of Array.from(clone.querySelectorAll('img'))){
      if(img.src && /^https?:/i.test(img.src)){
        try{
          const r=await fetch(img.src,{mode:'cors',cache:'force-cache'});
          if(!r.ok) throw 0;
          const b=await r.blob();
          img.src=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onloadend=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(b); });
        }catch(e){ img.style.display='none'; }
      }
    }
    cap.appendChild(clone);
    const wm=document.createElement('div'); wm.className='export-watermark';
    wm.innerHTML='<i></i><span>'+esc(S.watermark || '墨笺 · Markdown Studio')+'</span>'+
      '<span style="margin-left:auto">'+new Date().toLocaleDateString('zh-CN')+'</span>';
    cap.appendChild(wm);
    stage.appendChild(cap); document.body.appendChild(stage);
    await new Promise(r=>setTimeout(r,180));
    const w=cap.offsetWidth, h=cap.offsetHeight;
    let ratio=want;
    const capMax=Math.min(30000/Math.max(w,h,1), Math.sqrt(120000000/Math.max(w*h,1)));
    if(ratio>capMax){
      ratio=Math.floor(capMax*10)/10;
      if(ratio<0.5) throw new Error('内容过长，请降低清晰度或缩小导出字号');
      toast('图片过大，倍率自动降为 '+ratio+'x');
    }
    const canvas=await htmlToImage.toCanvas(cap,{
      pixelRatio:ratio, backgroundColor:'#ffffff', skipFonts:true,
      filter:n=>!(n.classList && (n.classList.contains('code-copy')||n.classList.contains('code-expand')||n.classList.contains('table-hint')))
    });
    const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('PNG 编码失败，请降低清晰度')),'image/png'));
    const name='墨笺_'+stamp()+'.png';
    const info='已导出 '+Math.round(w*ratio)+'×'+Math.round(h*ratio)+' px · '+ratio+'x';
    if(preferShare && navigator.share && navigator.canShare) shareFile(blob,name);
    else { download(blob,name); toast(info+' · 已下载'); }
    status('导出完成','#3ddc97');
  }catch(err){
    console.error(err); toast('导出失败：'+(err.message||'请稍后重试'),true); status('导出失败','#ff6b78');
  }finally{
    if(stage) stage.remove();
    fab.classList.remove('busy'); fab.innerHTML=orig;
  }
}

      '<code>![图](url =200x80)</code> 图片尺寸 · <code>```js:app.js</code> 带名代码<br>'+
      '<code>:::tip 标题</code> / <code>!!! note</code> 提示块（可任意层嵌套）<br>'+
      '<code>??? 标题</code> 折叠容器 · <code>- [?]</code> 进行中 · <code>- [-]</code> 已取消<br>'+
      '整行 <code>$$</code> / <code>\\[ \\]</code> 块公式，<code>~~~</code> 也可作围栏。'+
      '</div>'+
      '<p style="font-size:11px;color:var(--a-faint);line-height:1.7;margin-top:12px">点击即插入到光标位置；若已选中文字，会自动包裹所选内容。点击目录或脚注可精准跳转到对应位置。</p>';
  }
  B.innerHTML = html;
  B.scrollTop = 0;
}

/* ---------- 抽屉事件委托 ---------- */
$('sheetBody').addEventListener('click', e=>{
  const sw=e.target.closest('[data-sw]');
  if(sw){ const k=sw.dataset.sw; S[k]=!S[k]; sw.querySelector('.sw').classList.toggle('on',S[k]); applySettings(); if(k==='math'||k==='mermaid'||k==='collapse') render(); return; }
  const sg=e.target.closest('[data-seg] button');
  if(sg){
    const box=sg.closest('[data-seg]'), k=box.dataset.seg;
    let v=sg.dataset.val; if(['size','lh','exportWidth','exportSize','exportRatio'].includes(k)) v=Number(v);
    S[k]=v; applySettings();
    box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sg));
    return;
  }
  const tc=e.target.closest('[data-toc]');
  if(tc){ gotoHeading(tc.dataset.toc); closeSheet(); return; }
  const rs=e.target.closest('[data-restore]');
  if(rs){ const x=snaps.find(s=>s.id===Number(rs.dataset.restore)); if(x){ editor.value=x.text; isSample=false; pushHistory(); saveDoc(); render(); closeSheet(); toast('已恢复快照'); } return; }
  const ds=e.target.closest('[data-delsnap]');
  if(ds){ snaps=snaps.filter(s=>s.id!==Number(ds.dataset.delsnap)); localStorage.setItem(K.snaps,JSON.stringify(snaps)); renderSheet(); toast('已删除'); return; }
  const sp=e.target.closest('[data-snip]');
  if(sp){ insertSnippet(sp.dataset.snip); closeSheet(); return; }
  const act=e.target.closest('[data-act]');
  if(!act) return;
  const a=act.dataset.act;
  const go={ import:()=>$('fileInput').click(), expmd:exportMd, exphtml:exportHtml,
    exppng:()=>{ closeSheet(); exportImage(false); },
    print:()=>{ const v=document.body.dataset.view; setView('preview'); closeSheet(); setTimeout(()=>{ window.print(); setTimeout(()=>setView(v,true),400); },300); },
    sharemd:()=>shareFile(new Blob([editor.value],{type:'text/markdown'}),docTitle()+'.md'),
    sharepng:()=>{ closeSheet(); exportImage(true); },
    copysrc:()=>copyText(editor.value).then(()=>toast('源码已复制')).catch(()=>toast('复制失败',true)),
    copytext:()=>copyText(output.innerText).then(()=>toast('正文已复制')).catch(()=>toast('复制失败',true)),
    copyhtml:()=>copyText(output.innerHTML).then(()=>toast('HTML 已复制')).catch(()=>toast('复制失败',true)),
    sample:()=>{ editor.value=SAMPLE; isSample=true; pushHistory(); saveDoc(); setView('edit'); render(); closeSheet(); toast('已载入示例'); },
    newdoc:()=>{ if(editor.value.trim()) saveSnap(); editor.value=''; isSample=false; pushHistory(); saveDoc(); setView('edit'); render(); closeSheet(); toast('已新建空白文档'); },
    snapshot:saveSnap,
    focus:()=>{ document.body.classList.add('focus'); setView('edit',true); closeSheet(); },
    fullscreen:()=>{ setView('preview'); closeSheet(); const p=document.querySelector('.preview-pane'); (p.requestFullscreen||p.webkitRequestFullscreen||function(){}).call(p); },
    reset:()=>{ S=Object.assign({},DEF); applySettings(); renderSheet(); render(); toast('已恢复默认'); },
    findprev:()=>doFind(-1), findnext:()=>doFind(1), replace:()=>doReplace(false), replaceall:()=>doReplace(true),
    copytoc:()=>{ const t=tocData.map(d=>'  '.repeat(d.lv-1)+'- '+d.text).join('\n'); copyText(t).then(()=>toast('目录已复制')); }
  };
  if(go[a]) go[a]();
});
$('sheetBody').addEventListener('input', e=>{
  const r=e.target.closest('[data-range]');
  if(r){ const k=r.dataset.range, v=Number(r.value); S[k]=v; applySettings();
    const lab=$('rv_'+k); if(lab) lab.textContent = (k==='lh'?v.toFixed(2):v+' px'); return; }
  if(e.target.id==='findQ'){ findMatches=[]; findAt=-1; doFind(1); }
  if(e.target.id==='wmInput'){ S.watermark=e.target.value; saveSettings(); }
});
$('sheetBody').addEventListener('change', e=>{ if(e.target.id==='wmInput'){ S.watermark=e.target.value; saveSettings(); } });

/* 文档内 [TOC] / 脚注锚点：统一走精准跳转 */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-toc]');
  if(t && !t.closest('#sheetBody')){ e.preventDefault(); gotoHeading(t.dataset.toc); return; }
  const a=e.target.closest('a[href^="#"]');
  if(a && output.contains(a)){
    let id=a.getAttribute('href').slice(1);
    try{ id=decodeURIComponent(id); }catch(err){}
    const el=document.getElementById(id);
    if(el && output.contains(el)){ e.preventDefault(); gotoHeading(id); }
  }
});

/* =========================================================
   全局事件
   ========================================================= */
$('toolstrip').addEventListener('click', e=>{
  const b=e.target.closest('[data-snip]'); if(b) insertSnippet(b.dataset.snip);
  if(e.target.id==='chipMore') openSheet('snips');
});
$('editor').addEventListener('click', e=>{
  const b=e.target.closest('[data-snip]'); if(b) insertSnippet(b.dataset.snip);
});
$('themeBar').addEventListener('click', e=>{
  const b=e.target.closest('[data-theme]'); if(b){ S.theme=b.dataset.theme; applySettings(); buzz(); }
  if(e.target.id==='btnToc2') openSheet('toc');
});
document.querySelectorAll('.tab[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

$('btnToc').onclick=()=>openSheet('toc');
$('btnFind').onclick=()=>openSheet('find');
$('btnSnap').onclick=()=>openSheet('snaps');
$('btnSet').onclick=()=>openSheet('settings');
$('btnStats').onclick=()=>openSheet('stats');
$('btnTools').onclick=()=>openSheet('tools');
$('btnExport').onclick=()=>openSheet('export');
$('btnUndo').onclick=undo; $('btnRedo').onclick=redo;
$('btnFocus').onclick=()=>{ document.body.classList.add('focus'); setView('edit',true); };
$('btnFocusExit').onclick=()=>document.body.classList.remove('focus');
$('btnCopyText').onclick=()=>copyText(output.innerText).then(()=>toast('正文已复制')).catch(()=>toast('复制失败',true));
$('btnFull').onclick=()=>{ const p=document.querySelector('.preview-pane'); (p.requestFullscreen||p.webkitRequestFullscreen||function(){}).call(p); };
$('demoGo').onclick=()=>{ setView('edit'); editor.scrollTop=0; editor.setSelectionRange(0,0); editor.focus(); };
$('mask').onclick=closeSheet; $('sheetClose').onclick=closeSheet;
$('lbClose').onclick=()=>$('lightbox').classList.remove('show');
$('lightbox').onclick=e=>{ if(e.target.id==='lightbox') $('lightbox').classList.remove('show'); };

editor.addEventListener('input', ()=>{
  isSample=false; $('demoHint').hidden=true;
  updateStats();
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ saveDoc(); pushHistory(); },450);
  if(S.live){ clearTimeout(window.__rt); window.__rt=setTimeout(render,450); }
});
editor.addEventListener('keydown', e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    editor.setRangeText('  ',editor.selectionStart,editor.selectionEnd,'end');
    editor.dispatchEvent(new Event('input',{bubbles:true}));
  }
});

document.addEventListener('keydown', e=>{
  const m=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(m && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(m && k==='y'){ e.preventDefault(); redo(); return; }
  if(m && e.key==='Enter'){ e.preventDefault(); render(); return; }
  if(m && k==='s'){ e.preventDefault(); e.shiftKey?exportImage():exportMd(); return; }
  if(m && ['b','i','k'].includes(k) && document.activeElement===editor){
    e.preventDefault(); insertSnippet(k==='b'?'bold':k==='i'?'italic':'link'); return;
  }
  if(e.key==='Escape'){ closeSheet(); $('lightbox').classList.remove('show'); document.body.classList.remove('focus'); }
});

/* 目录滚动高亮 */
let spyRaf=null;
output.addEventListener('scroll',()=>{
  if(sheetPage!=='toc' || spyRaf) return;
  spyRaf=requestAnimationFrame(()=>{
    spyRaf=null;
    const base=output.getBoundingClientRect().top;
    let idx=0;
    tocData.forEach((d,i)=>{
      const el=document.getElementById(d.id);
      if(el && el.getBoundingClientRect().top-base<=72) idx=i;
    });
    document.querySelectorAll('.toc-item').forEach((n,j)=>n.classList.toggle('on',j===idx));
    document.querySelectorAll('.it-item').forEach((n,j)=>n.classList.toggle('on',j===idx));
  });
},{passive:true});

/* 桌面分屏拖动 */
let dragging=false;
const splitter=$('splitter'), editorPane=$('editorPane'), stage=$('stage');
splitter.addEventListener('pointerdown',e=>{ dragging=true; splitter.setPointerCapture(e.pointerId); splitter.classList.add('active'); });
splitter.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const r=stage.getBoundingClientRect();
  let pct=(e.clientX-r.left)/r.width*100; pct=Math.min(78,Math.max(22,pct));
  editorPane.style.flex='0 0 '+pct+'%';
});
splitter.addEventListener('pointerup',()=>{ dragging=false; splitter.classList.remove('active'); });
splitter.addEventListener('dblclick',()=>{ editorPane.style.flex='1 1 50%'; toast('已复位分栏'); });

window.addEventListener('beforeprint',()=>{ window.__pv=document.body.dataset.view; setView('preview',true); });
window.addEventListener('afterprint',()=>{ if(window.__pv) setView(window.__pv,true); });
window.addEventListener('error', e=>{ if(/marked|MathJax|mermaid/i.test(String(e.message||''))) status('部分组件未加载','#f59e0b'); });

/* ---------- 启动 ---------- */
buildToolstrip();
loadAll();
updateStats();
render();
if(isSample) status('示例文档已就绪','#3ddc97');
</script>
