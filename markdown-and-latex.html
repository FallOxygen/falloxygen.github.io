          '<button type="button" class="mm-btn" data-mmsave="png" title="下载 PNG">⬇ PNG</button>'+
          '<button type="button" class="mm-btn" data-mmsave="copy" title="复制源码">❐ 源码</button>';
        tools.insertBefore(box,tools.querySelector('.code-copy'));
      }
    }
    return w;
  };

  /* ---------- 标题编号 ---------- */
  const CN_NUM='一二三四五六七八九十';
  function cnNum(n){ if(n<=10) return CN_NUM.charAt(n-1); if(n<20) return '十'+CN_NUM.charAt(n-11); return String(n); }
  function numText(parts,mode){
    if(mode==='cn'){
      if(parts.length===1) return cnNum(parts[0])+'、';
      if(parts.length===2) return '（'+cnNum(parts[1])+'）';
      return parts.slice(2).map((v,i)=>i===0?v+'.':'('+v+')').join('');
    }
    return parts.join('.');
  }
  O.numText=numText;

  /* ---------- 自定义容器 / 块指令 ---------- */
  const CUSTOM=['tabs','timeline','cards','columns','cols','gallery','raw','html','chart','media','sign','steps'];
  function splitSections(body,name){
    const inner=name==='tabs'?'tab':name==='cards'?'card':name==='columns'||name==='cols'?'col':name==='steps'?'step':null;
    if(!inner) return [{title:'',body}];
    const re=new RegExp('^:::'+inner+'\\s*([^\\n]*)$','im');
    const parts=[]; let m;
    const lines=body.split('\n'); let curTitle='',buf=[];
    lines.forEach(l=>{
      const mm=l.match(new RegExp('^\\s*:::'+inner+'\\s*([^\\n]*)$','i'));
      if(mm){ if(buf.length||curTitle) parts.push({title:curTitle.trim(),body:buf.join('\n').replace(/^\s*:::\s*$/gm,'')}); curTitle=mm[1]||''; buf=[]; }
      else if(/^\s*:::\s*$/.test(l)){ /* 段结束 */ if(buf.length){parts.push({title:curTitle.trim(),body:buf.join('\n')});curTitle='';buf=[];} }
      else buf.push(l);
    });
    if(buf.length||curTitle) parts.push({title:curTitle.trim(),body:buf.join('\n').replace(/^\s*:::\s*$/gm,'')});
    return parts.length?parts:[{title:'',body}];
  }
  function extractCustom(src,st,depth){
    if(depth>8) return src;
    const lines=src.split('\n'),out=[];let i=0;
    while(i<lines.length){
      const m=lines[i].match(/^([ \t]*)((?:>[ \t]*)*):::([A-Za-z]+)\b[ \t]*([^\n]*)$/);
      if(!m||CUSTOM.indexOf(m[3].toLowerCase())<0){out.push(lines[i]);i++;continue;}
      const name=m[3].toLowerCase(),arg=m[4].trim(),quote=m[2],body=[];let dep=1;i++;
      while(i<lines.length){
        const l=lines[i];
        const om=l.match(/^([ \t]*)(?:>[ \t]*)*:::\s*([^\n]*)$/);
        if(om){
          if(!om[2].trim()){dep--;if(dep===0){i++;break;}body.push(stripQuote(l,quote));i++;continue;}
          dep++;body.push(stripQuote(l,quote));i++;continue;
        }
        body.push(stripQuote(l,quote));i++;
      }
      const raw=body.join('\n');
      let html='';
      const parse=txt=>{ try{ return marked.parse(compile(txt,st,depth+1)); }catch(e){ return '<div class="pv-raw">'+esc2(e.message)+'</div>'; } };
      if(name==='tabs'){
        const secs=splitSections(raw,'tabs');
        html='<div class="pv-tabs"><div class="pv-tabbar">'+secs.map((s,i)=>'<button type="button" class="pv-tab'+(i===0?' on':'')+'" data-tab="'+i+'">'+esc2(s.title||'标签 '+(i+1))+'</button>').join('')+'</div>'+
          '<div class="pv-tabpanes">'+secs.map((s,i)=>'<div class="pv-pane'+(i===0?' on':'')+'" data-pane="'+i+'">'+parse(s.body)+'</div>').join('')+'</div></div>';
      }else if(name==='timeline'){
        const items=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
        let h='<div class="pv-timeline">';
        items.forEach(l=>{
          const mm=l.replace(/^[-*+]\s+/,'').replace(/^#{1,6}\s+/,'').split(/\s*[|｜]\s*/);
          const t=mm[0]||'',ti=mm[1]||'',d=mm.slice(2).join(' · ');
          h+='<div class="pv-tl-item"><span class="pv-tl-time">'+esc2(t)+'</span>'+
            (ti?'<div class="pv-tl-title">'+esc2(ti)+'</div>':'')+
            (d?'<div class="pv-tl-body">'+parse(d)+'</div>':'')+'</div>';
        });
        html=h+'</div>';
      }else if(name==='cards'){
        const secs=splitSections(raw,'cards');
        html='<div class="pv-grid">'+secs.map((s,i)=>{
          const t=s.title.split(/\s+/),ico=t.shift()||'✦',ttl=t.join(' ')||'卡片 '+(i+1);
          return '<div class="pv-card2 accent-'+'abc'.charAt(i%3)+'"><div class="pc-ico">'+esc2(ico.slice(0,2))+'</div><h4>'+esc2(ttl)+'</h4>'+parse(s.body)+'</div>';
        }).join('')+'</div>';
      }else if(name==='columns'||name==='cols'){
        const secs=splitSections(raw,'columns');
        html='<div class="pv-cols">'+secs.map(s=>'<div class="pv-col">'+parse(s.body)+'</div>').join('')+'</div>';
      }else if(name==='steps'){
        const secs=splitSections(raw,'steps');
        html='<div class="pv-timeline">'+secs.map((s,i)=>'<div class="pv-tl-item"><span class="pv-tl-time">STEP '+(i+1)+'</span><div class="pv-tl-title">'+esc2(s.title)+'</div><div class="pv-tl-body">'+parse(s.body)+'</div></div>').join('')+'</div>';
      }else if(name==='gallery'){
        const imgs=raw.match(/!\[[^\]]*\]\([^)]*\)/g)||[];
        html='<div class="pv-gallery">'+imgs.map(x=>parse(x)).join('')+'</div>';
        if(!imgs.length) html='<div class="pv-raw">画廊里放几张图片：<code>![说明](url)</code></div>';
      }else if(name==='chart'){
        const r=chartSVG(raw); html=r.err?'<div class="pv-chart"><div class="ch-err">'+esc2(r.err)+'</div></div>':r.html;
      }else if(name==='raw'||name==='html'){
        if(arg==='run'||/\brun\b/i.test(arg)){
          const f=liveFrame('原始 HTML 容器',raw,{lang:'html'}); html=typeof f==='string'?f:'';
          if(typeof f!=='string'){ const i2=st.raw.push(f.outerHTML)-1; out.push('',tk('R',i2),''); continue; }
        }else html='<div class="pv-htmlbox"><div class="html-view">'+raw+'</div>'+
          '<details class="src-toggle"><summary>&lt;/&gt; 查看 / 复制原始 HTML</summary>'+
          '<pre class="g-pre">'+esc2(raw)+'</pre></details></div>';
      }else if(name==='media'){
        const cfg={}; raw.split(/\r?\n/).forEach(l=>{
          const mm=l.match(/^\s*(src|url|title|desc|type|loop|autoplay|muted)\s*[:：]\s*(.+)$/i); if(mm) cfg[mm[1].toLowerCase()]=mm[2].trim();
        });
        const u=cfg.src||cfg.url||raw.trim().split('\n')[0];
        const kind=cfg.type||dataKind(u).kind;
        html=mediaCard(kind==='other'?'audio':kind,cfg.title||'媒体',u,{desc:cfg.desc||'',loop:cfg.loop==='1',autoplay:cfg.autoplay==='1'});
      }else if(name==='sign'){
        html='<div class="pv-card2 accent-a" style="text-align:right">'+parse(raw)+'</div>';
      }
      const idx=st.raw.push(html)-1;
      if(quote) out.push(quote+tk('R',idx)); else out.push('',tk('R',idx),'');
    }
    return out.join('\n');
  }

  /* ---------- 一行指令 / 图片属性 / 公式编号 ---------- */
  function extractDirectives(src,st,depth){
    st.imgAttrs=st.imgAttrs||{}; st.eqMap=st.eqMap||{};
    /* 公式编号是跨行结构（$$...$${#id}），必须先在整篇源码上做全局替换，
       逐行 map 匹配不到；标记放在公式之前，避免被 BLOCK_MATH 整段替换时吞掉。 */
    src=src.replace(/(\$\$[\s\S]+?\$\$)[ \t]*\{#([A-Za-z][\w-]*)\}[ \t]*/g,(mm,eq,id)=>{
      const n=Object.keys(st.eqMap).length+1; st.eqMap[id]=n;
      return '\n\n<span class="pv-eqmark" data-eq="'+esc2(id)+'" data-n="'+n+'"></span>\n\n'+eq;
    });
    const IMG_ATTR_RE=/(!\[[^\]]*\]\()([^\s)]+)(\s*"[^"]*")?\)\s*\{([^}]+)\}/g;
    const lines=src.split('\n');
    return lines.map(line=>{

      let m=line.match(/^\s*@numbering\s+(off|decimal|cn|none|数字|中文)\s*$/i);
      if(m){ st.hnumOverride=/off|none/.test(m[1])?'off':/cn|中文/.test(m[1])?'cn':'decimal'; return ''; }
      m=line.match(/^\s*@(?:set|config)\s+hnumBase\s*=\s*([1-6])\s*$/i);
      if(m){ st.hnumBase=Number(m[1]); return ''; }
      /* 一行媒体指令 @audio[标题](url) / @video / @file / @embed / @iframe */
      m=line.match(/^\s*@(audio|video|file|embed|iframe|image)\s*\[([^\]]*)\]\(([\s\S]+)\)\s*(\{[^}]*\})?\s*$/i);
      if(m){
        const kind=m[1].toLowerCase(),title=m[2].trim()||'媒体',url=m[3].trim();
        const A={}; (m[4]||'').slice(1,-1).split(/[,，\s]+/).forEach(p=>{const kv=p.match(/^(\w+)=(.+)$/);if(kv)A[kv[1]]=kv[2];});
        let html='';
        if(kind==='embed'||kind==='iframe'){
          if(kind==='iframe'&&!/^data:/i.test(url)) html='<iframe src="'+attr(url)+'" sandbox="allow-scripts allow-forms allow-popups allow-same-origin" loading="lazy" style="width:100%;height:'+Number(A.height||S.frameH)+'px;border:0;border-radius:12px"></iframe>';
          else { const f=liveFrame(title,/^data:/i.test(url)?decodeDataHtml(url):url,{height:Number(A.height||S.frameH),lang:'html'});
                 html=typeof f==='string'?f:f.outerHTML; }
        }else if(kind==='image') html='<figure class="img-frame"><img src="'+attr(url)+'" alt="'+attr(title)+'"><figcaption>'+esc2(title)+'</figcaption></figure>';
        else html=mediaCard(kind==='file'?dataKind(url).kind:kind,title,url,{desc:A.desc||'',loop:A.loop==='1',autoplay:A.autoplay==='1',name:A.name});
        return pushRaw(st,html);
      }
      /* 进度条 [progress:75 标题] */
      m=line.match(/^\s*\[progress\s*[:：]\s*(\d{1,3})\s*([^\]]*)\]\s*$/i);
      if(m){
        const v=Math.min(100,Math.max(0,Number(m[1]))),t=m[2].trim()||'进度';
        const cls=/热|warm|橙|红/.test(t)?' warm':/蓝|cool|青/.test(t)?' cool':'';
        return pushRaw(st,'<div class="pv-progress'+cls+'"><div class="pp-head"><span>'+esc2(t)+'</span><b>'+v+'%</b></div>'+
          '<div class="pp-track"><div class="pp-fill" style="width:'+v+'%"></div></div></div>');
      }
      /* 图注 Figure: xxx / 表标题外再补一个 */
      m=line.match(/^\s*Figure\s*[:：]\s*(.+)$/i);
      if(m) return pushRaw(st,'<div class="pv-figcap">'+esc2(m[1])+'</div>');
      /* 图片属性 ![alt](url){w=200 h=80 align=center cap=说明} —— 行内可多次出现 */
      let imgChanged=false;
      const nl=line.replace(IMG_ATTR_RE,(mm,pre,url,title,attrs)=>{
        const A={}; attrs.split(/[,，\s]+/).forEach(p=>{const kv=p.match(/^(\w+)\s*=\s*(.+)$/);if(kv)A[kv[1].toLowerCase()]=kv[2];});

      m=line.match(/^([ \t]*(?:>[ \t]*)*)\[TOC(?:\s+(?:max|lv|level)\s*=\s*([1-6]))?\][ \t]*$/i);
      if(m){ st.tocMax=Number(m[2]||6); const t=tk('T',st.tocCount++); return m[1]?m[1]+t:'\n\n'+t+'\n\n'; }

  /* 修复：中文前缀被当作 Mermaid id 吞掉。

  mmCompute=function(root,layout,theme){

  function mmComputeExtra(root,layout,theme){
    const all=[];(function w(n){all.push(n);n.children.forEach(w);})(root);
    all.forEach(n=>{n.m=mmMeasure(n);});
    const maxD=all.reduce((a,n)=>Math.max(a,n.depth),0);
    const lw=[],lh=[];all.forEach(n=>{lw[n.depth]=Math.max(lw[n.depth]||0,n.m.w);lh[n.depth]=Math.max(lh[n.depth]||0,n.m.h);});
    const GX=70,GY=16;
    if(layout==='org'){
      const ys=[];let cy=0;for(let d=0;d<=maxD;d++){ys[d]=cy;cy+=(lh[d]||34)+GX;}
      let cur=0;
      const place=(n,d)=>{ n.y=ys[d]+n.m.h/2;
        if(!n.children.length){n.x=cur+n.m.w/2;cur+=n.m.w+GY;}
        else{n.children.forEach(c=>place(c,d+1));n.x=(n.children[0].x+n.children[n.children.length-1].x)/2;} };
      place(root,0);
      let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
      all.forEach(n=>{minX=Math.min(minX,n.x-n.m.w/2);maxX=Math.max(maxX,n.x+n.m.w/2);minY=Math.min(minY,n.y-n.m.h/2);maxY=Math.max(maxY,n.y+n.m.h/2);});
      minX-=30;minY-=30;maxX+=30;maxY+=30;
      const edges=[];
      (function w(n){n.children.forEach(c=>{
        const mid=(n.y+n.m.h/2+c.y-c.m.h/2)/2;
        edges.push({d:'M '+n.x.toFixed(1)+' '+(n.y+n.m.h/2).toFixed(1)+' V '+mid.toFixed(1)+' H '+c.x.toFixed(1)+' V '+(c.y-c.m.h/2).toFixed(1),branch:c.branch||1,w:c.depth<=1?2.4:1.7,straight:1});
        w(c);});})(root);
      return {nodes:all,edges,W:Math.max(120,maxX-minX),H:Math.max(90,maxY-minY),minX,minY,layout,theme};
    }
    /* fishbone：主干水平，一级分支上下交替，子孙向右外展 */
    root.x=0;root.y=0;
    const kids=root.children,stepX=Math.max(150,(lw[1]||80)+110);
    kids.forEach((c,i)=>{
      const sign=i%2?1:-1,x=(i+1)*stepX;
      c.x=x;c.y=sign*76;
      const sub=(n,d)=>{n.children.forEach((g,j)=>{
        g.x=n.x+Math.max(96,(lw[d+1]||70)+36);
        g.y=n.y+sign*(36+(j%2)*18)+(j>1?(j-1)*10:0);
        sub(g,d+1);
      });};
      sub(c,1);
    });
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    all.forEach(n=>{minX=Math.min(minX,n.x-n.m.w/2);maxX=Math.max(maxX,n.x+n.m.w/2);minY=Math.min(minY,n.y-n.m.h/2);maxY=Math.max(maxY,n.y+n.m.h/2);});
    minX-=34;minY-=34;maxX+=34;maxY+=34;
    const edges=[];
    (function w(n){n.children.forEach(c=>{
      edges.push({d:'M '+n.x.toFixed(1)+' '+n.y.toFixed(1)+' L '+c.x.toFixed(1)+' '+c.y.toFixed(1),branch:c.branch||1,w:c.depth<=1?2.6:1.7,straight:1});w(c);});})(root);
    /* 主干 */
    if(kids.length){
      const last=kids[kids.length-1];
      edges.push({d:'M 0 0 L '+(last.x+40).toFixed(1)+' 0',branch:1,w:2.2,straight:1,trunk:1});
    }
    return {nodes:all,edges,W:Math.max(120,maxX-minX),H:Math.max(90,maxY-minY),minX,minY,layout,theme};
  }

        const h='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc2(docTitle())+'</title></head><body>'+src+'</body></html>';
        download(new Blob([h],{type:'text/html;charset=utf-8'}),'墨笺_嵌入页面_'+stamp()+'.html');toast('独立 HTML 已导出');
      }
      if(act==='full'&&f)(f.requestFullscreen||f.webkitRequestFullscreen||function(){}).call(f);
      buzz();return;
    }
    /* 内联 SVG 工具条 */
    const sb=t.closest('[data-svgsave]');
    if(sb){
      const box=sb.closest('.pv-svgbox'),svg=box&&box.dataset.svg;if(!svg)return;
      const act=sb.dataset.svgsave;
      if(act==='copy')copyText(svg).then(()=>toast('SVG 源码已复制')).catch(()=>toast('复制失败',true));
      if(act==='svg'){download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),'墨笺_SVG_'+stamp()+'.svg');toast('SVG 已下载');}
      if(act==='png')svgToPng(svg,'墨笺_SVG_'+stamp()+'.png');
      buzz();return;
    }
    /* 思维导图导出 */
    const ms=t.closest('[data-mmsave]');
    if(ms){
      const card=ms.closest('.code-block-wrapper')&&ms.closest('.code-block-wrapper').querySelector('.mermaid-card.mm-card');
      if(!card)return;
      const svg=card.querySelector('.mm-canvas svg');
      const act=ms.dataset.mmsave;
      if(act==='copy')copyText(card._mmSrc||'').then(()=>toast('导图源码已复制')).catch(()=>toast('复制失败',true));
      if(act==='svg'&&svg){const s=new XMLSerializer().serializeToString(svg);download(new Blob([s],{type:'image/svg+xml;charset=utf-8'}),'墨笺_思维导图_'+stamp()+'.svg');toast('SVG 已下载');}
      if(act==='png'&&svg)svgToPng(new XMLSerializer().serializeToString(svg),'墨笺_思维导图_'+stamp()+'.png');
      buzz();return;
    }
    /* 复制 data URI */
    const cu=t.closest('[data-copyuri]');
    if(cu){const u=cu.dataset.copyuri;copyText(u).then(()=>toast('URI 已复制（'+(u.length/1024).toFixed(0)+' KB）')).catch(()=>toast('复制失败',true));return;}
    /* 状态栏开放模式徽章 */
    if(t.closest('#openBadge')){S.openMode=!S.openMode;saveSettings();updateOpenBadge();render();toast(S.openMode?'开放渲染已开启':'开放渲染已关闭');return;}
  });
  function svgToPng(svg,name){
    try{
      const s=svg.indexOf('xmlns=')>=0?svg:svg.replace(/<svg/,'<svg xmlns="http://www.w3.org/2000/svg"');
      const img=new Image();
      const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=Math.max(1,img.width*2);c.height=Math.max(1,img.height*2);
        const g=c.getContext('2d');g.scale(2,2);g.fillStyle='#ffffff';g.fillRect(0,0,img.width,img.height);g.drawImage(img,0,0);
        c.toBlob(b=>{if(b){download(b,name);toast('PNG 已下载');}else toast('PNG 生成失败',true);},'image/png');
      };
      img.onerror=()=>toast('SVG 无法转为 PNG（可能含外部资源）',true);
      img.src=url;
    }catch(e){toast('PNG 生成失败：'+e.message,true);}
  }
  O.svgToPng=svgToPng;

  /* ---------- 设置应用 ---------- */
  function updateOpenBadge(){
    const b=$('openBadge');if(!b)return;
    b.classList.toggle('off',!S.openMode);
    b.innerHTML='<i></i>'+(S.openMode?'开放渲染':'安全模式');
    b.title=S.openMode?'点击切换：禁用可运行 HTML / iframe':'点击开启开放渲染';
  }
  O.updateOpenBadge=updateOpenBadge;
  applySettings=function(){ _applySettings(); updateOpenBadge(); };

  /* 供 UI 层复用 */
  Object.assign(O,{_renderSheet,_applySettings,_enhanceDOM,mediaCard,chartSVG,liveFrame,frameDoc,
    decodeDataHtml,dataKind,pushRaw,inlineExt2,svgToPng,numText,extractCustom,extractDirectives,
    esc2,attr,uid,mediaIcon:MEDIA_ICON});
  return O;
})();

{id:'open',icon:'09',t:'重大改变 · 开放渲染总论',keys:'开放渲染 HTML SVG 音频 视频 data URI base64 iframe 嵌入 沙箱 安全 媒体',
 html:`<p><b>这是 v5 最核心的改变。</b>过去预览区只能显示 Markdown 生成的图片；现在预览区是一块<b>开放画布</b>：凡是浏览器能显示或运行的东西，都能直接写进文档里 —— 原始 HTML、内联 SVG、CSS、JavaScript、iframe、音频、视频、字体、PDF、任意二进制文件的 data URI，以及它们自由组合出来的「小程序」。</p>
<p><b>为什么能做到？</b>因为 <code>data:</code> URI 本身就是内容：能写 <code>![图](data:image/png;base64,...)</code>，就一样能写 <code>![录音](data:audio/mpeg;base64,...)</code>、<code>@file[资料](data:application/pdf;base64,...)</code>；而 HTML 与 SVG 是浏览器原生语言，直接交给预览 DOM 或隔离 iframe 即可运行。墨笺把这一切统一成三种写法：</p>
<div class="g-syn">
<div class="g-row"><div class="g-k"><b>① 直接写原始 HTML</b></div><div class="g-v">在 Markdown 里直接写 <code>&lt;div&gt;、&lt;svg&gt;、&lt;audio&gt;、&lt;style&gt;、&lt;iframe&gt;</code> 等标签，会原样渲染。<code>&lt;script&gt; / &lt;style&gt; / &lt;svg&gt;</code> 整块已做<b>保护</b>，里面的文本不会被行内语法误改。</div></div>
<div class="g-row"><div class="g-k"><b>② 围栏写可运行片段</b></div><div class="g-v"><code>\`\`\`html:run</code>（沙箱运行）、<code>\`\`\`svg</code>（内联矢量图）、<code>\`\`\`css</code>（注入样式）、<code>\`\`\`js:run</code>（运行脚本）、<code>\`\`\`audio</code>、<code>\`\`\`chart</code>、<code>\`\`\`md</code> 等。</div></div>
<div class="g-row"><div class="g-k"><b>③ data URI / 媒体指令</b></div><div class="g-v"><code>![图](data:image/svg+xml;base64,...)</code>、<code>@audio[标题](data:audio/mp3;base64,...)</code>、<code>@video[...](...)</code>、<code>@file[...](...)</code>、<code>@embed[...](data:text/html;base64,...)</code>。</div></div>
</div>
<div class="g-pre">支持清单（全部可离线内嵌）：
  图片   image/png · jpeg · gif · webp · svg+xml · avif · bmp
  音频   audio/mpeg · mp4 · wav · ogg · webm · aac · flac
  视频   video/mp4 · webm · ogg · mov
  文档   application/pdf · text/html · text/plain · CSV · JSON
  字体   font/woff2 · ttf · otf
  代码   任意 HTML / CSS / JS / SVG 片段
  组合   上面任意内容拼成一个可运行页面</div>
<p><b>自动媒体识别：</b>只要图片或链接指向 data URI / 音视频扩展名，预览会自动把它升级成对应播放器或下载卡片 —— 不需要记任何新语法，把 <code>data:image/...</code> 换成 <code>data:audio/...</code> 就行。</p>
<div class="g-note"><b>安全模型：</b>可运行 HTML 放进 <code>&lt;iframe sandbox="allow-scripts allow-forms ..."&gt;</code>，<b>不含 allow-same-origin</b>，里面的脚本读不到父页面的文档、localStorage 与 Cookie，无法跳转或改写墨笺界面；高度通过 postMessage 自适应。状态栏「开放渲染」徽章或设置里的开关可一键关闭沙箱运行（关闭后只显示源码）。</div>
<div class="g-note g-warn"><b>体积提示：</b>base64 会把文件放大约 33%，且 localStorage 通常只有 5 MB 左右。建议：小图 / 短音频内嵌，大文件用外链；超过 1 MB 时媒体工厂会给出提示。导出独立 HTML 时所有 data URI 会完整保留，文件可离线打开。</div>`},

{id:'run',icon:'10',t:'可运行 HTML / CSS / JS 沙箱',keys:'html run 运行 脚本 iframe sandbox srcdoc css 注入 javascript 交互 高度 重新运行 独立HTML',
 html:`<p>把「写完的 HTML」直接变成预览里<b>能点、能算、能动</b>的小应用。适合：交互演示、表单、Canvas 动画、D3/Chart 小图（自行在 head 里引 CDN）、数学实验、小游戏、原型页面。</p>
<div class="g-syn">
<div class="g-row"><div class="g-k"><code>\`\`\`html:run</code></div><div class="g-v">完整 HTML 片段放进沙箱 iframe 运行，<b>script 会真正执行</b>。</div></div>
<div class="g-row"><div class="g-k"><code>\`\`\`html</code></div><div class="g-v">等价于 <code>html:run</code>；<code>\`\`\`embed</code> / <code>\`\`\`frame</code> 同样。</div></div>
<div class="g-row"><div class="g-k"><code>\`\`\`html:inline</code></div><div class="g-v">不加 iframe，直接把 HTML 片段插入预览 DOM（静态展示，脚本不执行）。</div></div>
<div class="g-row"><div class="g-k"><code>\`\`\`css</code></div><div class="g-v">把 CSS 注入整个预览区，可自定义任意 class / 字体 / 动画 / 主题覆盖。</div></div>
<div class="g-row"><div class="g-k"><code>\`\`\`js:run</code></div><div class="g-v">纯 JavaScript 片段在沙箱里运行，可操作 document、绘制 Canvas、发 fetch。</div></div>
<div class="g-row"><div class="g-k"><code>\`\`\`iframe</code></div><div class="g-v">内容第一行写 URL，嵌入外部页面（受对方 X-Frame-Options 限制）；<b>v5.1</b> 同样带「运行 / 源码」切换框。</div></div>
<div class="g-row"><div class="g-k"><code>\`\`\`md</code></div><div class="g-v">嵌套渲染一段普通 Markdown，适合做「文档里的文档」。</div></div>
<div class="g-row"><div class="g-k"><code>{height=320 bg=#f8f9fd}</code></div><div class="g-v">围栏属性：height / h（初始高度）、bg / fg（背景前景色）、title / head（额外 head 内容）、plain（隐藏工具条）。</div></div>
<div class="g-row"><div class="g-k"><code>:::raw run</code></div><div class="g-v">容器写法：把整个容器内容当 HTML 运行；不写 run 时原样插入 DOM。</div></div>
<div class="g-row"><div class="g-k"><code>@embed[标题](data:text/html;base64,...)</code></div><div class="g-v">把 base64 编码的 HTML 文档解码后运行，适合把整页存进文档。</div></div>
<div class="g-row"><div class="g-k"><code>◈ 运行 / &lt;/&gt; 源码</code></div><div class="g-v">可运行 HTML、脚本沙箱、<code>\`\`\`iframe</code>、<code>@embed</code>、<code>:::raw run</code> 的工具条都有分段按钮。<b>v5.2 起「源码」不再是容器里的一段裸文本，而是与普通代码块完全一致的卡片</b>：macOS 窗口栏、语言标签、语法高亮、行号、复制按钮，可折叠长代码逻辑也相同；导出的独立 HTML 里同样可用。</div></div>
<div class="g-row"><div class="g-k"><code>▸ 查看 / 复制源码</code></div><div class="g-v"><b>v5.1 新增</b>：<code>\`\`\`html:inline</code>、<code>\`\`\`css</code>、<code>\`\`\`svg</code>、<code>:::raw</code>（不带 run）卡片底部带一个可展开的源码折叠块，点开即可看到并选中复制原始 HTML / CSS / SVG 文本，不影响上方渲染效果。</div></div>
</div>
<div class="g-pre">\`\`\`html:run {height=220 title=计数器}
&lt;h3&gt;一个能点的小组件&lt;/h3&gt;
&lt;button id="b"&gt;点我 +1&lt;/button&gt;
&lt;p&gt;计数：&lt;b id="n"&gt;0&lt;/b&gt;&lt;/p&gt;
&lt;script&gt;
  let i = 0;
  b.onclick = () =&gt; n.textContent = ++i;
&lt;/script&gt;
\`\`\`

\`\`\`css
.pv-card2 { border-radius: 22px; }
\`\`\`</div>
<div class="g-note">工具条提供「◈ 运行 / &lt;/&gt; 源码 / ↻ 重新运行 / ❐ 复制源码 / ⬇ 导出独立 HTML / ⛶ 全屏」。iframe 高度会随内容自动增长（ResizeObserver + postMessage），不需要手动调。导出的独立 HTML 保留 srcdoc 与全部切换按钮，离线打开照样能运行、能看源码。</div>
<div class="g-note g-warn"><b>限制：</b>① 沙箱内脚本不能访问父页面；② 长图导出无法捕获跨域 iframe，自动降级为「交互式内容请在 HTML 中查看」占位卡片；③ 外部 CDN 脚本需要联网；④ 关闭开放渲染后所有 iframe / 脚本 / 注入 CSS 停用。</div>`},

{id:'svg',icon:'11',t:'SVG 矢量图 · 三种写法',keys:'SVG 矢量 内联 base64 utf8 下载 PNG 图生图 代码画图',
 html:`<p>SVG 是「用代码写的图片」，在墨笺里有三种等价入口，全部可无损放大、可导出。</p>
<div class="g-syn">
<div class="g-row"><div class="g-k"><code>\`\`\`svg</code></div><div class="g-v"><b>v5 新增</b>：围栏内写 SVG 源码，直接内联渲染；工具条可下载 SVG / PNG / 复制源码。</div></div>
<div class="g-row"><div class="g-k"><code>&lt;svg ...&gt;...&lt;/svg&gt;</code></div><div class="g-v">文档里直接写 SVG 标签，整块受保护、原样渲染。</div></div>
<div class="g-row"><div class="g-k"><code>![图](data:image/svg+xml;base64,...)</code></div><div class="g-v">base64 形式，与 PNG 完全一样走图片画框 / 图注 / 放大。</div></div>
<div class="g-row"><div class="g-k"><code>![图](data:image/svg+xml;utf8,&lt;svg...&gt;)</code></div><div class="g-v">URL 编码的 utf8 形式，也可直接用 <code>\`\`\`svg</code> 更省事。</div></div>
<div class="g-row"><div class="g-k"><code>\`\`\`chart</code></div><div class="g-v">不想手写坐标？用数据自动生成柱状 / 折线 / 饼图 SVG。</div></div>
<div class="g-row"><div class="g-k"><code>:::gallery</code></div><div class="g-v"><b>v5 新增</b>：把多张图片排成响应式画廊。</div></div>
</div>
<div class="g-pre">\`\`\`svg
&lt;svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320"&gt;
  &lt;defs&gt;&lt;linearGradient id="g"&gt;
    &lt;stop stop-color="#7c5cff"/&gt;&lt;stop offset="1" stop-color="#38bdf8"/&gt;
  &lt;/linearGradient&gt;&lt;/defs&gt;
  &lt;rect width="320" height="120" rx="18" fill="url(#g)"/&gt;
  &lt;text x="24" y="72" fill="white" font-size="28"&gt;Hello SVG ✦&lt;/text&gt;
&lt;/svg&gt;
\`\`\`</div>
<div class="g-note">媒体工厂里可以粘贴 SVG 文本，一键转成 <code>data:image/svg+xml;base64,...</code> 并插入编辑器，适合把设计稿塞进单文件文档。</div>`},

{id:'media',icon:'12',t:'音频 / 视频 / 任意文件嵌入',keys:'音频 视频 audio video mp3 mp4 base64 data URI 媒体工厂 本地文件 下载 PDF 字体',
 html:`<p><b>「既然能 base64 写图片，就一定可以写音频」</b> —— v5 把它做成了完整能力：任何能转成 data URI 的文件，都能成为文档的一部分，离线打开也能播放 / 下载。</p>
<div class="g-syn">
<div class="g-row"><div class="g-k"><code>![录音](data:audio/mpeg;base64,...)</code></div><div class="g-v">把图片语法里的 MIME 换成音频，自动识别并变成 <code>&lt;audio controls&gt;</code> 播放器。</div></div>
<div class="g-row"><div class="g-k"><code>![短片](data:video/mp4;base64,...)</code></div><div class="g-v">自动变成 <code>&lt;video controls&gt;</code>；支持 mp4 / webm / ogg。</div></div>
<div class="g-row"><div class="g-k"><code>[音乐](https://x/a.mp3)</code></div><div class="g-v">外链 .mp3 / .m4a / .wav / .mp4 / .webm 也会自动升级为播放器。</div></div>
<div class="g-row"><div class="g-k"><code>@audio[标题](url)</code></div><div class="g-v"><b>v5 新增</b>：显式音频卡片；<code>@video[...](...)</code> 是视频版。</div></div>
<div class="g-row"><div class="g-k"><code>@file[讲义](data:application/pdf;base64,...)</code></div><div class="g-v"><b>v5 新增</b>：任意文件卡片（PDF / 字体 / 文本 / 二进制），带下载与新窗口按钮。</div></div>
<div class="g-row"><div class="g-k"><code>{loop=1 autoplay=1 desc=说明}</code></div><div class="g-v">媒体指令尾部属性：循环、自动播放、描述文字、下载文件名。</div></div>
<div class="g-row"><div class="g-k"><code>\`\`\`audio</code></div><div class="g-v">媒体围栏：用 <code>src: / title: / desc: / loop: / autoplay:</code> 逐行配置。</div></div>
<div class="g-row"><div class="g-k"><code>:::media</code></div><div class="g-v">等价的容器写法；<code>type:</code> 可强制指定 audio / video / pdf。</div></div>
<div class="g-row"><div class="g-k"><b>⬡ 媒体嵌入工厂</b></div><div class="g-v">顶栏按钮：选择本地任意文件 → 自动转 base64 → 生成对应语法插入光标；也可粘贴 SVG 文本转 data URI。支持批量、复制 URI、删除。</div></div>
</div>
<div class="g-pre">@audio[一段环境音](data:audio/wav;base64,UklGR...){loop=1 desc=可直接播放}

\`\`\`video
src: https://example.com/demo.mp4
title: 产品演示
desc: 也可写 data:video/mp4;base64,......
\`\`\`

@file[项目讲义](data:application/pdf;base64,JVBERi0x...)</div>
<div class="g-note">卡片右上角显示 MIME 类型与「DATA URI」标记；播放器提供原生控件，另有「⬇ 下载 / ❐ 复制 URI / ↗ 新窗口」。媒体自动识别可在设置里关闭。</div>
<div class="g-note g-warn">浏览器对自动播放有策略限制，<code>autoplay</code> 通常需要配合 <code>muted</code> 或用户先交互；超大 base64 会拖慢渲染与 localStorage 保存，建议 &gt;1 MB 用外链。</div>`},

{id:'layout',icon:'13',t:'版式组件 · 标签页 / 卡片 / 分栏',keys:'标签页 tabs 卡片 cards 分栏 columns 画廊 gallery 签名 sign 步骤 steps 组件',
 html:`<p><b>v5 新增</b>一组「写文档也像做网页」的容器组件，全部支持内部完整 Markdown 与嵌套，移动端自动换行。</p>
<div class="g-syn">
<div class="g-row"><div class="g-k"><code>:::tabs</code> + <code>:::tab 名称</code></div><div class="g-v">标签页；点击切换，导出长图时所有页签内容会一起铺开印出。</div></div>
<div class="g-row"><div class="g-k"><code>:::cards</code> + <code>:::card ✦ 标题</code></div><div class="g-v">响应式卡片网格，自动轮换三套配色；标题第一个词当图标。</div></div>
<div class="g-row"><div class="g-k"><code>:::columns</code> + <code>:::col</code></div><div class="g-v">多栏并排，窄屏自动堆叠；别名 <code>:::cols</code>。</div></div>
<div class="g-row"><div class="g-k"><code>:::steps</code> + <code>:::step 标题</code></div><div class="g-v">带 STEP 序号的步骤时间线。</div></div>
<div class="g-row"><div class="g-k"><code>:::gallery</code></div><div class="g-v">图片画廊，内部每行写 <code>![说明](url)</code>。</div></div>
<div class="g-row"><div class="g-k"><code>:::sign</code></div><div class="g-v">右对齐的签名 / 落款卡片。</div></div>
<div class="g-row"><div class="g-k"><code>[progress:75 完成度]</code></div><div class="g-v">渐变进度条（标题含蓝/青/红/橙自动换色）。</div></div>
</div>

点上面的标签切换，内部支持 **强调** 与 \`代码\`。

<div class="g-note">所有自定义容器都支持<b>任意深度嵌套</b>，也可以写在引用里：外层用 <code>&gt;</code> 前缀即可。</div>`},

{id:'export',icon:'14',t:'导出 / 分享 / 打印 全解',keys:'导出 长图 PNG 独立HTML PDF 打印 Markdown 复制 快照 分享 隐藏文本 水印 倍率',
 html:`<p>右下角悬浮按钮打开导出面板；工具箱里也有全部文件操作。</p>
<div class="g-syn">
<div class="g-row"><div class="g-k"><code>▣ 高清长图</code></div><div class="g-v">html-to-image 把预览区渲染成 PNG；公式 / 导图 / SVG 都是矢量转内嵌。<b>v5.1 改为逐段精准切片</b>：每段只渲染该段可见内容再无缝拼接，长文档速度提升数倍、内存更稳；宽度、字号、1–4x 倍率、角标文字都可调。</div></div><div class="g-row"><div class="g-k"><code>◈ 运行 / 源码切换</code></div><div class="g-v"><b>v5.1 新增</b>：可运行 HTML、脚本沙箱、嵌入页面的工具条新增「◈ 运行 / &lt;/&gt; 源码」分段按钮，随时查看原始代码；导出的独立 HTML 里同样可用。</div></div><div class="g-row"><div class="g-k"><code>◉ 长图交互内容</code></div><div class="g-v"><b>v5.1 新增</b>：占位卡 / 显示源码 / 全部展开 三选一。决定标签页、折叠、剧透、长代码、可运行页面、播放器在静态长图里是印出说明、附带源码还是全部展开；HTML / CSS / SVG 的「查看源码」折叠块也会随之收起或印出。</div></div><div class="g-row"><div class="g-k"><code>▣ 超长自动分段</code></div><div class="g-v"><b>v5.1 新增</b>：超过浏览器画布上限时自动切成多张连续 PNG 并打包 ZIP（含 README 拼接说明），再长的文档也能完整导出；切片高度 800–2400 px 可调，设置里可强制分段。</div></div>
<div class="g-row"><div class="g-k"><code>▦ 二维码分享卡</code></div><div class="g-v"><b>v5.2 新增</b>：长图里每个被降级的音频 / 视频 / 可运行页面 / 嵌入页面旁都会生成二维码；图片末尾还有一张文档级二维码卡。扫码即可打开你设置的分享链接，或看到文档指纹与「打开独立 HTML」引导，收到图片的人也能找到交互内容。</div></div>
<div class="g-row"><div class="g-k"><code>◈ 独立 HTML</code></div><div class="g-v">单文件 HTML，包含全部排版 CSS、公式 SVG、思维导图 8 种布局视图与交互脚本；<b>v5 起可运行 iframe / 标签页 / 媒体同样保留</b>，离线可打开。</div></div>
<div class="g-row"><div class="g-k"><code>⎙ 打印 / PDF</code></div><div class="g-v">浏览器打印，自动隐藏界面、展开预览、去除交互按钮。</div></div>
<div class="g-row"><div class="g-k"><code>⬆ Markdown</code></div><div class="g-v">导出原始 .md 源码，可再导入继续编辑。</div></div>
<div class="g-row"><div class="g-k"><code>❐ 复制源码 / 正文 / HTML</code></div><div class="g-v">工具箱剪贴板区，正文是纯文本，HTML 含内联 SVG 公式。</div></div>
<div class="g-row"><div class="g-k"><code>◉ 隐藏文本与导出</code></div><div class="g-v">自动识别 5 类交互隐藏内容（缩写释义 / 剧透 / 折叠 / 长代码 / 导图分支），逐类决定长图里是否直接印出。</div></div>
<div class="g-row"><div class="g-k"><code>▤ 历史快照</code></div><div class="g-v">最多 10 份，可恢复 / 删除；重大修改前建议存一份。</div></div>
<div class="g-row"><div class="g-k"><code>↗ 分享</code></div><div class="g-v">支持系统分享的设备可直接分享 .md 或长图，否则自动下载。</div></div>
</div>
<div class="g-note"><b>v5.1 注意：</b>长图无法捕获跨域 iframe 内容，可运行 HTML 会按「交互内容」设置变成占位卡或附带源码；标签页、折叠、剧透等交互内容也按该设置静态化。独立 HTML 与打印 PDF 保留全部交互，不受此限制。</div>`},

{id:'settings',icon:'15',t:'设置项逐条说明',keys:'设置 主题 字体 字号 行距 实时渲染 公式 图表 行号 折叠 自动保存 震动 导图 布局 配色 编号 开放渲染 媒体',
 html:`<p>右上角齿轮打开设置；所有设置保存在本机，点「恢复默认设置」可复位。</p>
<div class="g-syn">
<div class="g-row"><div class="g-k"><code>预览主题</code></div><div class="g-v">纯白 / 纸墨 / 青提 / 夜读；预览工具条也能一键切换。</div></div>
<div class="g-row"><div class="g-k"><code>正文字体 / 字号 / 行距</code></div><div class="g-v">系统 / 衬线 / 圆体 / 等宽；字号 12–22 px，行距 1.4–2.3。</div></div>
<div class="g-row"><div class="g-k"><code>实时渲染</code></div><div class="g-v">停止输入 0.45 秒后自动刷新；关闭后需 Ctrl/⌘+Enter 手动渲染。</div></div>
<div class="g-row"><div class="g-k"><code>公式 / Mermaid / 行号 / 折叠</code></div><div class="g-v">分别控制 MathJax、图表、代码行号、超长代码自动收起。</div></div>
<div class="g-row"><div class="g-k"><code>标题自动编号</code></div><div class="g-v"><b>v5 新增</b>：关闭 / 数字 1.1 / 中文 一、（一）；可设起始层级 H1–H6。</div></div>
<div class="g-row"><div class="g-k"><code>导图节点编号 / 配色</code></div><div class="g-v"><b>v5 新增</b>：节点前显示 1 / 1.1；配色 紫 / 海 / 暖 / 森 / 灰 五套。</div></div>
<div class="g-row"><div class="g-k"><code>思维导图默认布局</code></div><div class="g-v">8 种：右向 / 左向 / 向下 / 向上 / 双侧 / 放射 / 组织结构 / 鱼骨因果。</div></div>
<div class="g-row"><div class="g-k"><code>开放渲染</code></div><div class="g-v"><b>v5 新增</b>：允许 iframe / 脚本 / CSS 注入 / data URI 媒体；关闭后显示源码而不运行。</div></div>
<div class="g-row"><div class="g-k"><code>媒体自动识别 / 沙箱高度</code></div><div class="g-v"><b>v5 新增</b>：data URI 与音视频链接自动升级为播放器；沙箱 iframe 初始高度 120–900 px。</div></div>
<div class="g-row"><div class="g-k"><code>导出图片参数</code></div><div class="g-v">宽度 500–1200 px、导出字号 10–26 px、1–4x 倍率、角标文字。</div></div><div class="g-row"><div class="g-k"><code>长图导出（v5.1）</code></div><div class="g-v">交互内容：占位卡 / 显示源码 / 全部展开；超长处理：自动分段 / 尽量单张 / 强制分段；切片高度 800–2400 px。</div></div>
<div class="g-row"><div class="g-k"><code>分享与二维码（v5.2）</code></div><div class="g-v"><b>长图里显示二维码</b>开关、<b>分享链接</b>输入框（建议指向你上传的独立 HTML）；链接过长会自动改用短引导，完整地址仍印在卡片上。</div></div>
<div class="g-row"><div class="g-k"><code>自动保存 / 轻触反馈</code></div><div class="g-v">localStorage 自动存稿；支持的设备提供轻微震动。</div></div>
</div>
<div class="g-note">单篇文档可用 <code>@numbering decimal</code>、<code>@set hnumBase=2</code> 覆盖全局编号设置；其它指令见第 07 章。</div>`},

  function mfHandleFiles(files){
    const list=Array.from(files||[]); if(!list.length) return;
    let left=list.length;
    list.forEach(f=>{
      const kind=mfKind(f);
      const fr=new FileReader();
      fr.onload=()=>{
        const uri=String(fr.result||'');
        mfItems.push({name:f.name,size:f.size,kind,uri,syntax:mfSyntax(f.name,uri,kind)});
        if(--left<=0){ mfRefresh(); toast('已转换 '+list.length+' 个文件，点「插入」写入文档'); }
      };
      fr.onerror=()=>{ if(--left<=0) mfRefresh(); toast('读取失败：'+f.name,true); };
      fr.readAsDataURL(f);
    });
  }
  function mfPaste(){
    const t=$('mfPaste'); const s=t?t.value.trim():'';
    if(!s){ toast('请先粘贴 SVG 或 HTML 文本',true); return; }
    const svg=/^\s*<svg[\s>]/i.test(s);
    const uri='data:'+(svg?'image/svg+xml':'text/html')+';base64,'+b64(s);
    const name=(svg?'粘贴的 SVG 图':'粘贴的 HTML 页面')+(svg?'.svg':'.html');
    mfItems.push({name,size:s.length,kind:svg?'image':'html',uri,syntax:mfSyntax(name,uri,svg?'image':'html')});
    mfRefresh(); toast('已生成 data URI（'+fmtSize(uri.length)+'）');
  }

      document.querySelectorAll('#guideNav button').forEach(b=>b.classList.toggle('on',b===gn));
      buzz(); return;
    }
    const mf=e.target.closest('[data-mf]');
    if(mf){
      const a=mf.dataset.mf;
      if(a==='drop'||e.target.closest('#mfDrop')){ $('mfFile')&&$('mfFile').click(); return; }
      if(a==='insertall'){
        if(!mfItems.length){ toast('列表为空',true); return; }
        if(mfItems.some(x=>x.size>1048576)) toast('含大文件，可能超出本地存储容量',false);
        insertRaw(mfItems.map(x=>x.syntax).join('\n\n')); closeSheet(); toast('已插入 '+mfItems.length+' 条媒体语法'); return;
      }
      if(a==='clear'){ mfItems=[]; mfRefresh(); toast('已清空'); return; }
      if(a==='paste'){ mfPaste(); return; }
      if(a==='guide'){ openSheet('guide'); return; }
      return;
    }
    const mi=e.target.closest('[data-mfi]');
    if(mi){
      const i=Number(mi.dataset.idx),x=mfItems[i]; if(!x)return;
      const a=mi.dataset.mfi;
      if(a==='insert'){
        if(x.size>1048576) toast('文件较大（'+fmtSize(x.size)+'），建议改用外链',false);
        insertRaw(x.syntax); closeSheet(); toast('已插入 '+x.name);

        copyText(x.uri).then(()=>toast('data URI 已复制（'+fmtSize(x.uri.length)+'）')).catch(()=>toast('复制失败',true));
      }else if(a==='remove'){ mfItems.splice(i,1); mfRefresh(); }
      buzz(); return;

    const sw=e.target.closest('[data-sw]');
    if(sw&&['openMode','mmNum','mediaAuto','svgInline'].indexOf(sw.dataset.sw)>=0) setTimeout(()=>render(),0);
    const sg=e.target.closest('[data-seg] button');

      if(k&&['hnum','hnumBase','mmPalette'].indexOf(k)>=0) setTimeout(()=>render(),0);

  /* ==========================================================
     5 · flowchart / graph 内置 SVG 兜底（官方 Mermaid 不可用时）
     支持：A[方] B(圆角) C((圆)) D{菱} E{{六边}} F[[卡]] G>旗]
           --> --- -.-> ==> 及链式、|标签|
     ========================================================== */
  function builtinFlowchartSVG(src){
    const raw=String(src||'').replace(/\r/g,'');
    const lines=raw.split('\n');
    const hi=lines.findIndex(l=>l.trim());
    const mh=(lines[hi]||'').trim().match(/^(?:flowchart|graph)\s*(LR|RL|TB|BT|TD)?\s*$/i);
    if(!mh) return null;
    const dir=(mh[1]||'TB').toUpperCase();
    const lr=/LR|RL/.test(dir), rev=/RL|BT/.test(dir);
    const stmts=lines.slice(hi+1).join('\n').split(/[;\n]/)
      .map(s=>s.replace(/%%.*$/,'').trim()).filter(Boolean);
    const nodes={},edges=[];
    function textLen(t){
      let n=0; for(const c of String(t)) n+=/[\u2e80-\u9fff]/.test(c)?15:8.4; return n;
    }
    function getNode(tok){
      const s=String(tok||'').trim().replace(/^\|[^|]*\|\s*/,'').replace(/\s*\|[^|]*\|\s*$/,'');
      if(!s) return null;
      const m=s.match(/^([\w\u4e00-\u9fa5]+)\s*(\[\[([\s\S]+)\]\]|\{\{([\s\S]+)\}\}|\(\(([\s\S]+)\)\)|\[([\s\S]+)\]|\(([\s\S]+)\)|\{([\s\S]+)\}|>([\s\S]+)\])?$/);
      if(!m) return null;
      const id=m[1];
      const label=(m[3]||m[4]||m[5]||m[6]||m[7]||m[8]||m[9]||id).replace(/<br\s*\/?>/gi,'\n');
      const sh=m[2]||'';
      let shape='rect';
      if(sh.indexOf('[[')===0) shape='rect';
      else if(sh.indexOf('{{')===0) shape='hex';
      else if(sh.indexOf('((')===0) shape='circle';
      else if(sh.indexOf('[')===0) shape='rect';
      else if(sh.indexOf('(')===0) shape='rounded';
      else if(sh.indexOf('{')===0) shape='diamond';
      else if(sh.indexOf('>')===0) shape='banner';
      const lines=label.split('\n');
      const w=Math.max(78,Math.max.apply(null,lines.map(textLen))+30), h=Math.max(40,lines.length*19+20);
      const explicit=!!m[2];   /* 裸 id 只是边的引用，不能覆盖此前定义的标签 */
      if(!nodes[id]) nodes[id]={id,label:lines,shape,w,h,in:0,out:0,layer:0,x:0,y:0};
      else if(explicit){ nodes[id].label=lines; nodes[id].shape=shape; nodes[id].w=w; nodes[id].h=h; }
      return id;
    }
    const EDGE_RE=/\s*(?:-\.->|==>|-->|---|-\.-|==|-\s+[^-]*?\s+->)\s*/;
    stmts.forEach(s=>{
      const parts=s.split(EDGE_RE).map(x=>x.trim()).filter(Boolean);
      if(parts.length<2){ getNode(parts[0]); return; }
      for(let i=0;i<parts.length-1;i++){
        const a=getNode(parts[i]),b=getNode(parts[i+1]);
        if(a&&b&&a!==b){ edges.push([a,b]); nodes[a].out++; nodes[b].in++; }
      }
    });
    const ids=Object.keys(nodes);
    if(!ids.length) return null;
    /* 最长路径分层（有上限，兼容环） */
    for(let k=0;k<ids.length+2;k++){
      let ch=false;
      edges.forEach(e=>{ if(nodes[e[1]].layer<nodes[e[0]].layer+1){ nodes[e[1]].layer=nodes[e[0]].layer+1; ch=true; } });
      if(!ch) break;
    }
    const layers={}; ids.forEach(i=>{ (layers[nodes[i].layer]=layers[nodes[i].layer]||[]).push(i); });
    const LK=Object.keys(layers).map(Number).sort((a,b)=>a-b);
    const GAP=lr?34:26, STEP=lr?92:76;
    let coord={};
    if(lr){
      let x=0;
      LK.forEach(L=>{
        const arr=layers[L]; let y=0;
        const maxH=Math.max.apply(null,arr.map(i=>nodes[i].h));
        arr.forEach(i=>{ coord[i]={x:x+nodes[i].w/2,y:y+maxH/2}; y+=maxH+GAP; });
        x+=Math.max.apply(null,arr.map(i=>nodes[i].w))+STEP;
      });
    }else{
      let y=0;
      LK.forEach(L=>{
        const arr=layers[L]; let x=0;
        const maxW=Math.max.apply(null,arr.map(i=>nodes[i].w));
        arr.forEach(i=>{ coord[i]={x:x+maxW/2,y:y+nodes[i].h/2}; x+=maxW+GAP; });
        y+=Math.max.apply(null,arr.map(i=>nodes[i].h))+STEP;
      });
    }
    ids.forEach(i=>{ const c=coord[i]; nodes[i].x=c.x; nodes[i].y=c.y; });
    if(rev){
      const max=lr?Math.max.apply(null,ids.map(i=>nodes[i].x)):Math.max.apply(null,ids.map(i=>nodes[i].y));
      ids.forEach(i=>{ if(lr) nodes[i].x=max-nodes[i].x; else nodes[i].y=max-nodes[i].y; });
    }
    /* 矩形边界交点：连线停在节点外缘，不穿文字 */
    function bp(n,tx,ty){
      const dx=tx-n.x,dy=ty-n.y,hw=n.w/2+3,hh=n.h/2+3;
      if(!dx&&!dy) return [n.x,n.y];
      const sx=dx?hw/Math.abs(dx):Infinity, sy=dy?hh/Math.abs(dy):Infinity;
      const s=Math.min(sx,sy);
      return [n.x+dx*s,n.y+dy*s];
    }
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    ids.forEach(i=>{ const n=nodes[i];
      minX=Math.min(minX,n.x-n.w/2);maxX=Math.max(maxX,n.x+n.w/2);
      minY=Math.min(minY,n.y-n.h/2);maxY=Math.max(maxY,n.y+n.h/2); });
    minX-=28;minY-=28;maxX+=28;maxY+=28;
    const W=Math.max(160,maxX-minX),H=Math.max(100,maxY-minY);
    const uid='bf'+(Math.random()*1e6|0);
    let defs='<defs><marker id="'+uid+'a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'+
      '<path d="M 0 0 L 10 5 L 0 10 z" fill="#8b7bd8"/></marker>'+
      '<linearGradient id="'+uid+'g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>';
    let ep='';
    edges.forEach((e,idx)=>{
      const a=nodes[e[0]],b=nodes[e[1]];
      const p1=bp(a,b.x,b.y),p2=bp(b,a.x,a.y);
      ep+='<path d="M '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' L '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+
        '" fill="none" stroke="#8b7bd8" stroke-opacity=".62" stroke-width="1.9" marker-end="url(#'+uid+'a)"/>';
    });
    let np='';
    ids.forEach((id,idx)=>{
      const n=nodes[id],x=n.x,y=n.y,w=n.w,h=n.h;
      const first=n.in===0;
      const fill=first?'url(#'+uid+'g)':'#f4f1ff', stroke=first?'none':'#7c5cff';
      const fg=first?'#ffffff':'#242a3d';
      let shape='';
      if(n.shape==='diamond') shape='<polygon points="'+(x)+','+(y-h/2)+' '+(x+w/2)+','+y+' '+x+','+(y+h/2)+' '+(x-w/2)+','+y+'" />';
      else if(n.shape==='hex'){ const q=w*.14;
        shape='<polygon points="'+(x-w/2)+','+y+' '+(x-w/2+q)+','+(y-h/2)+' '+(x+w/2-q)+','+(y-h/2)+' '+(x+w/2)+','+y+' '+(x+w/2-q)+','+(y+h/2)+' '+(x-w/2+q)+','+(y+h/2)+'" />'; }
      else if(n.shape==='circle') shape='<ellipse cx="'+x+'" cy="'+y+'" rx="'+(w/2)+'" ry="'+(h/2)+'" />';
      else if(n.shape==='banner') shape='<path d="M '+(x-w/2)+' '+(y-h/2)+' H '+(x+w/2)+' V '+(y+h/2)+' H '+(x-w/2)+' L '+(x-w/2+12)+' '+y+' Z" />';
      else shape='<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="'+(n.shape==='rounded'?h/2:11)+'" />';
      const lh=19,y0=y-(n.label.length-1)*lh/2;
      const tsp=n.label.map((t,i)=>'<tspan x="'+x.toFixed(1)+'" y="'+(y0+i*lh+5).toFixed(1)+'">'+esc2(t)+'</tspan>').join('');
      np+='<g fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(first?0:1.8)+'">'+shape+'</g>'+
        '<text fill="'+fg+'" font-size="14" font-weight="'+(first?700:560)+'" text-anchor="middle" stroke="none">'+tsp+'</text>';
    });
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+minX.toFixed(1)+' '+minY.toFixed(1)+' '+W.toFixed(1)+' '+H.toFixed(1)+
      '" width="'+Math.round(W)+'" height="'+Math.round(H)+'" class="mm-svg bf-svg" font-family="-apple-system,BlinkMacSystemFont,\'PingFang SC\',\'Microsoft YaHei\',sans-serif">'+
      defs+'<g>'+ep+'</g><g>'+np+'</g></svg>';
  }

  /* 官方 Mermaid 加载失败 / 单图解析失败时，用内置渲染器兜底 */
  const _mmShowSource=mmShowSource;
  mmShowSource=function(card,src,reason){

    const s=new XMLSerializer().serializeToString(svg);

  /* ==========================================================
     8 · 鱼骨因果：连线只走到节点边缘，子孙直角外展
     ========================================================== */
  function fishboneCompute(root,theme){
    const all=[];(function w(n){all.push(n);n.children.forEach(w);})(root);
    all.forEach(n=>{ n.m=mmMeasure(n); });
    const kids=root.children;
    const lw=[];all.forEach(n=>{lw[n.depth]=Math.max(lw[n.depth]||0,n.m.w);});
    const stepX=Math.max(190,(lw[1]||90)+120), branchLen=96;
    const extra=[];
    root.x=0; root.y=0;
    kids.forEach((c,i)=>{
      const sign=i%2?1:-1, bx=(i+1)*stepX;
      c.x=bx+18; c.y=sign*(branchLen+c.m.h/2+14);
      /* 一级分支：主干锚点 → 节点近侧边缘外 4px，绝不穿进文字 */
      extra.push([bx-stepX*0.36,0]);
      let cx=c.x+c.m.w/2+18;
      let cy=c.y+sign*(c.m.h/2+18);
      const sub=(n)=>{
        n.children.forEach(g=>{
          g.x=cx+g.m.w/2+22;
          g.y=cy;
          cy+=sign*(g.m.h+20);
          cx=g.x+g.m.w/2+14;
          sub(g);
        });
      };
      sub(c);
    });
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    const add=(x,y)=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);};
    all.forEach(n=>{ add(n.x-n.m.w/2,n.y-n.m.h/2); add(n.x+n.m.w/2,n.y+n.m.h/2); });
    extra.forEach(p=>add(p[0],p[1]));
    const mainEnd=kids.length?((kids.length)*stepX+stepX*0.62):root.m.w/2+70;
    add(root.m.w/2+6,0); add(mainEnd+16,0);
    minX-=34;minY-=34;maxX+=34;maxY+=34;
    /* 边缘交点 */
    function bp(n,tx,ty){
      const dx=tx-n.x,dy=ty-n.y,hw=n.m.w/2+3,hh=n.m.h/2+3;
      if(!dx&&!dy) return [n.x,n.y];
      const sx=dx?hw/Math.abs(dx):Infinity, sy=dy?hh/Math.abs(dy):Infinity;
      const s=Math.min(sx,sy); return [n.x+dx*s,n.y+dy*s];
    }
    const edges=[];
    /* 主干：从根节点右边缘出发 */
    if(kids.length) edges.push({d:'M '+(root.m.w/2+6).toFixed(1)+' 0 L '+mainEnd.toFixed(1)+' 0',branch:1,w:2.4,straight:1,trunk:1});
    /* 一级分支斜线 */
    kids.forEach((c,i)=>{
      const sign=i%2?1:-1, bx=(i+1)*stepX;
      const ty=sign*(branchLen+9);
      edges.push({d:'M '+(bx-stepX*0.36).toFixed(1)+' 0 L '+c.x.toFixed(1)+' '+ty.toFixed(1),branch:c.branch||i+1,w:2.4,straight:1});
      extra.push([c.x,ty]);
    });
    /* 子孙：直角折线，从父右边缘到子左边缘 */
    (function w(n){
      n.children.forEach(g=>{
        const p1=bp(n,g.x,n.y), x2=g.x-g.m.w/2-5, y2=g.y;
        edges.push({d:'M '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' H '+x2.toFixed(1)+
          (Math.abs(y2-n.y)>2?' V '+y2.toFixed(1):'')+' H '+(g.x-g.m.w/2-2).toFixed(1),
          branch:g.branch||1,w:1.7,straight:1});
        w(g);
      });
    })(root);
    return {nodes:all,edges,W:Math.max(160,maxX-minX),H:Math.max(110,maxY-minY),minX,minY,layout:'fishbone',theme};
  }
  const _mmComputeV51=mmCompute;

(function(){

  /* ---------- 极简 ZIP（store 模式，无外部依赖） ---------- */
  const CRC=(function(){ const t=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
  function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
  function utf8(s){ return new TextEncoder().encode(s); }
  function w16(dv,o,v){ dv.setUint16(o,v,true); }
  function w32(dv,o,v){ dv.setUint32(o,v>>>0,true); }
  function makeZip(files){
    const locals=[],centrals=[]; let off=0;
    files.forEach(f=>{
      const name=utf8(f.name), data=f.data, crc=crc32(data);
      const lh=new Uint8Array(30+name.length), ld=new DataView(lh.buffer);
      w32(ld,0,0x04034b50); w16(ld,4,20); w16(ld,6,0x0800); w16(ld,8,0);
      w16(ld,10,0); w16(ld,12,0); w32(ld,14,crc); w32(ld,18,data.length); w32(ld,22,data.length);
      w16(ld,26,name.length); w16(ld,28,0); lh.set(name,30);
      locals.push(lh,data);
      const ch=new Uint8Array(46+name.length), cd=new DataView(ch.buffer);
      w32(cd,0,0x02014b50); w16(cd,4,20); w16(cd,6,20); w16(cd,8,0x0800); w16(cd,10,0);
      w16(cd,12,0); w16(cd,14,0); w32(cd,16,crc); w32(cd,20,data.length); w32(cd,24,data.length);
      w16(cd,28,name.length); w16(cd,30,0); w16(cd,32,0); w16(cd,34,0); w16(cd,36,0);
      w32(cd,38,0); w32(cd,42,off); ch.set(name,46);
      centrals.push(ch);
      off+=lh.length+data.length;
    });
    let cdSize=0; centrals.forEach(c=>cdSize+=c.length);
    const end=new Uint8Array(22), ed=new DataView(end.buffer);
    w32(ed,0,0x06054b50); w16(ed,4,0); w16(ed,6,0);
    w16(ed,8,files.length); w16(ed,10,files.length);
    w32(ed,12,cdSize); w32(ed,16,off); w16(ed,20,0);
    return new Blob(locals.concat(centrals,[end]),{type:'application/zip'});
  }
