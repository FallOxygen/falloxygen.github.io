<!-- ==================== 应用外壳样式 ==================== -->
<style>
:root{
  color-scheme:dark;
  --a-bg:#0a0c14; --a-panel:#121522; --a-panel2:#1a1e30;
  --a-line:rgba(255,255,255,.09); --a-line2:rgba(255,255,255,.15);
  --a-fg:#eef0f8; --a-dim:#8d94ac; --a-faint:#606784;
  --violet:#7c5cff; --pink:#c084fc; --cyan:#38bdf8; --green:#3ddc97; --red:#ff6b78;
  --grad:linear-gradient(135deg,#7c5cff 0%,#a855f7 46%,#38bdf8 100%);
  --grad2:linear-gradient(135deg,#7c5cff,#c084fc);
  --shadow:0 14px 40px rgba(0,0,0,.38);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--a-fg);
  background:
    radial-gradient(760px 480px at 88% -8%,rgba(124,92,255,.22),transparent 62%),
    radial-gradient(660px 460px at -12% 108%,rgba(56,189,248,.16),transparent 62%),
    var(--a-bg);
  display:flex;flex-direction:column;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(9px + var(--safe-t)) 14px 9px;
  border-bottom:1px solid var(--a-line);
  background:rgba(15,18,30,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.logo{
  width:36px;height:36px;flex:none;border-radius:12px;background:var(--grad);
  display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;
  box-shadow:0 6px 18px rgba(124,92,255,.42);position:relative;
}
.logo::after{content:'';position:absolute;inset:0;border-radius:12px;border:1px solid rgba(255,255,255,.28)}
.brand-txt{min-width:0;flex:1}
.brand-txt b{display:block;font-size:13.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{display:block;font-size:10px;color:var(--a-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:6px}
.icon-btn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.045);border:1px solid var(--a-line);
  color:var(--a-dim);transition:.18s;flex:none;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.on{color:#c9bcff;border-color:rgba(124,92,255,.5);background:rgba(124,92,255,.16)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 语法快捷条 ---------- */
.toolstrip{
  flex:none;display:flex;gap:7px;overflow-x:auto;padding:9px 14px 10px;
  border-bottom:1px solid var(--a-line);scrollbar-width:none;
  background:rgba(10,12,20,.42);
}
.toolstrip::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:30px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:600;
  color:#c4c9dd;background:var(--a-panel2);border:1px solid var(--a-line);
  display:inline-flex;align-items:center;gap:5px;transition:.16s;white-space:nowrap;
}
.chip:active{transform:scale(.94);background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.5);color:#e6dcff}
.chip.hot{background:linear-gradient(135deg,rgba(124,92,255,.24),rgba(56,189,248,.16));border-color:rgba(124,92,255,.42);color:#ddd3ff}
.chip .k{font-family:ui-monospace,monospace;font-size:10px;opacity:.6}

/* ---------- 工作区 ---------- */
.stage{flex:1;display:flex;min-height:0;padding:10px;gap:10px;position:relative}
.pane{
  display:flex;flex-direction:column;min-height:0;min-width:0;
  border-radius:18px;overflow:hidden;border:1px solid var(--a-line);
  background:var(--a-panel);box-shadow:var(--shadow);
}
.editor-pane{flex:1 1 50%}
.preview-pane{flex:1 1 50%}
body[data-view="edit"] .preview-pane,
body[data-view="preview"] .editor-pane{display:none}
body[data-view="edit"] .editor-pane,
body[data-view="preview"] .preview-pane{flex:1 1 100%}
.pane-head{
  flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--a-line);background:rgba(255,255,255,.025);
}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.dot.g{background:var(--green)}.dot.v{background:var(--pink)}.dot.c{background:var(--cyan)}
.pane-title{font-size:10.5px;font-weight:700;letter-spacing:1.1px;color:#aeb5cd;text-transform:uppercase}
.pane-head .sp{flex:1}
.mini{
  font-size:11px;padding:5px 10px;border-radius:8px;color:var(--a-dim);
  border:1px solid var(--a-line);background:rgba(255,255,255,.03);transition:.15s;
}
.mini:active{background:rgba(124,92,255,.2);color:#fff}

/* 编辑器 */
.editor-wrap{flex:1;display:flex;min-height:0;position:relative}
#editor{
  flex:1;width:100%;border:0;outline:0;resize:none;
  background:#0e111b;color:#dfe4f2;
  font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,Menlo,monospace;
  font-size:16px;line-height:1.78;padding:16px 16px 40px;
  caret-color:#b79bff;-webkit-font-smoothing:antialiased;
}
#editor::placeholder{color:#4a5069}
#editor::selection{background:rgba(124,92,255,.4)}
.editor-foot{
  position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;
  padding:7px 10px;background:linear-gradient(0deg,rgba(14,17,27,.98),rgba(14,17,27,0));
  pointer-events:none;
}
.editor-foot .mini{pointer-events:auto;backdrop-filter:blur(6px)}

/* 预览外框 */
.preview-tools{
  flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;
  border-bottom:1px solid var(--a-line);background:rgba(255,255,255,.025);overflow-x:auto;scrollbar-width:none;
}
.preview-tools::-webkit-scrollbar{display:none}
.theme-pill{
  flex:none;font-size:11px;padding:5px 10px;border-radius:999px;
  color:var(--a-dim);border:1px solid var(--a-line);background:rgba(255,255,255,.03);
}
.theme-pill.on{color:#fff;background:var(--grad2);border-color:transparent;font-weight:600}
.demo-hint{
  flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;
  font-size:11.5px;color:#cbbcff;background:linear-gradient(90deg,rgba(124,92,255,.16),rgba(56,189,248,.08));
  border-bottom:1px solid rgba(124,92,255,.22);
}
.demo-hint b{color:#fff}
.demo-hint .go{margin-left:auto;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.12);font-size:11px;font-weight:600}
.demo-hint[hidden]{display:none}
#output{flex:1;overflow:auto;min-height:0;position:relative;-webkit-overflow-scrolling:touch}
#output::-webkit-scrollbar-thumb{background:rgba(120,130,160,.28)}
#output::-webkit-scrollbar-thumb:hover{background:rgba(120,130,160,.45)}

/* 空状态 */
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:40px 24px;color:var(--a-dim);
}
.empty .art{
  width:88px;height:88px;border-radius:26px;background:var(--grad);
  display:grid;place-items:center;font-size:40px;color:#fff;
  box-shadow:0 16px 40px rgba(124,92,255,.35);transform:rotate(-6deg);
}
.empty h3{margin:6px 0 0;font-size:16px;color:var(--a-fg)}
.empty p{margin:0;font-size:12.5px;line-height:1.7;max-width:260px}
.empty button{margin-top:6px;padding:9px 18px;border-radius:11px;background:var(--grad2);color:#fff;font-size:12.5px;font-weight:700}

/* 分隔条（桌面） */
.splitter{flex:0 0 12px;display:none;cursor:col-resize;position:relative;touch-action:none}
.splitter::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4px;height:44px;border-radius:6px;background:rgba(255,255,255,.14)}
.splitter.active::after{background:var(--violet)}
@media (min-width:861px){body[data-view="split"] .splitter{display:block}}
@media (max-width:860px){
  .stage{flex-direction:column;padding:8px;gap:8px}
  body[data-view="split"] .editor-pane,body[data-view="split"] .preview-pane{flex:1 1 50%}
  .splitter{display:none!important}
}

/* ---------- 状态条 / 底部导航 ---------- */
.statusbar{
  flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px;
  font-size:10.5px;color:var(--a-faint);border-top:1px solid var(--a-line);
  background:rgba(10,12,20,.5);
}
.statusbar .sdot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.statusbar b{color:#b9c0d6;font-weight:600}
.statusbar .sp{flex:1}
.statusbar .more{color:#aeb6cd}
.tabbar{
  flex:none;display:flex;align-items:stretch;gap:4px;padding:6px 8px calc(6px + var(--safe-b));
  border-top:1px solid var(--a-line);
  background:rgba(15,18,30,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.tab{
  flex:1;min-height:50px;border-radius:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--a-faint);
  font-size:10.5px;font-weight:600;transition:.18s;position:relative;
}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#ded4ff;background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(56,189,248,.1))}
.tab.on::before{content:'';position:absolute;top:5px;width:20px;height:3px;border-radius:3px;background:var(--grad)}
.fab{
  position:absolute;right:16px;bottom:calc(100px + var(--safe-b));
  width:54px;height:54px;border-radius:19px;background:var(--grad);
  display:grid;place-items:center;color:#fff;z-index:25;
  box-shadow:0 12px 30px rgba(124,92,255,.5),0 2px 0 rgba(255,255,255,.2) inset;
  transition:.2s;
}
.fab:active{transform:scale(.9)}
.fab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab.busy{opacity:.75;pointer-events:none}
.spin{width:20px;height:20px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 底部抽屉 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(4,6,12,.62);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.25s;z-index:40;
}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-height:min(86vh,760px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1a1e30 0%,#121624 100%);
  border-top:1px solid var(--a-line2);border-radius:24px 24px 0 0;
  box-shadow:0 -18px 50px rgba(0,0,0,.5);
  transform:translateY(102%);transition:transform .32s cubic-bezier(.22,1,.36,1);
  padding-bottom:var(--safe-b);
}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.24);margin:9px auto 2px;flex:none}
.sheet-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 18px 12px;border-bottom:1px solid var(--a-line)}
.sheet-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.3px}
.sheet-head .sp{flex:1}
.sheet-head .x{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);color:var(--a-dim);font-size:15px;display:grid;place-items:center}
.sheet-body{flex:1;overflow:auto;padding:14px 16px 26px;-webkit-overflow-scrolling:touch}
.sec{margin-bottom:18px}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--a-faint);text-transform:uppercase;margin:0 0 9px 3px}
.card{background:rgba(255,255,255,.035);border:1px solid var(--a-line);border-radius:15px;overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--a-line);min-height:50px}
.row:last-child{border-bottom:0}
.row .ri{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(124,92,255,.16);color:#cbbcff;font-size:15px}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:13px;font-weight:600}
.row .rt small{display:block;font-size:10.5px;color:var(--a-faint);margin-top:2px;line-height:1.45}
.row .rv{font-size:11.5px;color:var(--a-dim);flex:none}
.row.act:active{background:rgba(124,92,255,.12)}
.seg{display:flex;gap:5px;padding:5px;background:rgba(0,0,0,.22);border-radius:12px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:8px 6px;border-radius:9px;font-size:11.5px;color:var(--a-dim);font-weight:600;transition:.16s}
.seg button.on{background:var(--grad2);color:#fff;box-shadow:0 3px 10px rgba(124,92,255,.3)}
.sw{position:relative;width:42px;height:24px;border-radius:999px;background:#333950;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#98a0ba;transition:.2s}
.sw.on{background:var(--violet)}
.sw.on::after{left:21px;background:#fff}
.range-row{padding:13px 14px;border-bottom:1px solid var(--a-line)}
.range-row:last-child{border-bottom:0}
.range-lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}
.range-lab b{color:#cdbcff;font-weight:700}
input[type=range]{width:100%;height:5px;border-radius:5px;background:#333950;appearance:none;-webkit-appearance:none;outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:4px solid var(--violet);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--violet)}
.inp{
  width:100%;background:rgba(0,0,0,.25);border:1px solid var(--a-line);
  border-radius:11px;padding:11px 13px;color:var(--a-fg);font-size:13px;outline:none;
}
.inp:focus{border-color:rgba(124,92,255,.65)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.6}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;font-size:13px;font-weight:650;transition:.16s;
  background:rgba(255,255,255,.06);border:1px solid var(--a-line);color:var(--a-fg);
}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.35)}
.btn.ghost{background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.4);color:#d3c6ff}
.btn.danger{color:#ffb3bb;border-color:rgba(255,107,120,.35);background:rgba(255,107,120,.1)}
.btn.full{width:100%}
.btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.btn-grid .btn{padding:12px 8px;font-size:12px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat-cell{background:rgba(255,255,255,.04);border:1px solid var(--a-line);border-radius:13px;padding:13px 8px;text-align:center}
.stat-cell b{display:block;font-size:19px;font-weight:750;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-cell small{display:block;font-size:10px;color:var(--a-faint);margin-top:4px}
.toc-list{display:flex;flex-direction:column;gap:2px}
.toc-item{
  display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;
  font-size:12.5px;color:#c3cadb;border-left:2px solid transparent;transition:.15s;line-height:1.45;
}
.toc-item.lv2{padding-left:24px;font-size:12px}
.toc-item.lv3{padding-left:38px;font-size:11.5px;color:var(--a-dim)}
.toc-item.lv4,.toc-item.lv5,.toc-item.lv6{padding-left:50px;font-size:11px;color:var(--a-faint)}
.toc-item.on{background:rgba(124,92,255,.14);border-left-color:var(--violet);color:#fff}
.snap-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--a-line)}
.snap-item:last-child{border-bottom:0}
.snap-item .si{flex:1;min-width:0}
.snap-item .si b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap-item .si small{display:block;font-size:10.5px;color:var(--a-faint);margin-top:3px}
.snap-item button{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--a-dim);font-size:13px;flex:none}
.empty-note{text-align:center;color:var(--a-faint);font-size:12px;padding:26px 10px;line-height:1.8}
/* 隐藏文本识别面板 */
.rv-row{cursor:pointer;user-select:none}
.rv-row:active{background:rgba(124,92,255,.1)}
.rv-row.unused{opacity:.48}
.rv-count{
  font-style:normal;font-size:10px;font-weight:700;margin-left:7px;padding:1px 7px;
  border-radius:6px;color:#cbbcff;background:rgba(124,92,255,.16);vertical-align:1px;
}
.rv-row.unused .rv-count{color:var(--a-faint);background:rgba(255,255,255,.07)}
.find-res{font-size:11.5px;color:var(--a-dim);margin:8px 3px 0}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,14px);
  max-width:84vw;padding:10px 16px;border-radius:13px;font-size:12.5px;line-height:1.5;
  background:rgba(28,32,50,.96);border:1px solid var(--a-line2);color:#fff;
  box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:60;
  backdrop-filter:blur(12px);text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:rgba(255,107,120,.6);background:rgba(58,26,34,.96)}

/* 图片放大 */
.lightbox{
  position:fixed;inset:0;z-index:70;background:rgba(5,7,12,.94);
  display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);
}
.lightbox.show{display:flex;animation:fade .2s}
.lightbox img{max-width:100%;max-height:86vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lightbox .lb-x{position:absolute;top:calc(18px + var(--safe-t));right:18px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);font-size:19px;color:#fff}

/* 独立 HTML 里也能切换布局（预渲染 6 份视图，无需加载引擎） */
.mm-export-bar{
  display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
  padding:10px 12px 2px;
}
.mm-export-bar button{
  font-size:11px;color:var(--pv-accent);background:var(--pv-card);
  border:1px solid var(--pv-line);border-radius:7px;padding:5px 9px;
  cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
}
.mm-export-bar button:hover{border-color:var(--pv-accent)}
.mm-export-bar button.on{background:var(--grad2);color:#fff;border-color:transparent;font-weight:700}
.mm-view svg{width:100%!important;height:auto!important;max-width:none!important}

/* 公式 */
.preview-body mjx-container{display:inline-block;max-width:100%;color:var(--pv-fg)}
.math-block{
  position:relative;margin:1.25em 0;padding:16px 14px 14px;border-radius:14px;
  background:linear-gradient(135deg,var(--pv-tint),rgba(56,189,248,.05));
  border:1px solid var(--pv-line);box-shadow:var(--pv-shadow);text-align:center;
  overflow-x:auto;overflow-y:hidden;
}
.math-block::before{content:'';display:block;position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--grad2)}
.math-label{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  white-space:nowrap;word-break:keep-all;line-height:1.5;max-width:100%;
  font-size:10px;letter-spacing:.6px;color:var(--pv-accent);
  background:var(--pv-bg);border:1px solid var(--pv-line);border-radius:999px;
  padding:2px 10px;margin:0 0 8px;font-weight:700;opacity:.85;
  vertical-align:top;
}
.math-block mjx-container[display="true"]{display:block;margin:0!important;padding:2px 0!important;overflow:visible!important}

/* 提示块 */
.admonition{
  --ad:#7c5cff;position:relative;margin:1.2em 0;padding:13px 15px 13px 16px;
  border-radius:13px;background:var(--pv-card);border:1px solid var(--pv-line);
  border-left:4px solid var(--ad);box-shadow:var(--pv-shadow);
}
.admonition::before{content:'';position:absolute;inset:0;border-radius:13px;background:var(--ad);opacity:.045;pointer-events:none}
.admonition .ad-head{display:flex;align-items:center;gap:8px;font-size:.9em;font-weight:750;color:var(--ad);margin-bottom:6px}
.admonition .ad-ico{
  width:20px;height:20px;border-radius:7px;background:var(--ad);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;
}
.admonition p{margin:.35em 0;font-size:.95em}
.admonition > *:last-child{margin-bottom:0}
.admonition.info{--ad:#3b82f6}.admonition.tip{--ad:#8b5cf6}
.admonition.success{--ad:#10b981}.admonition.warning{--ad:#f59e0b}
.admonition.danger{--ad:#ef4444}.admonition.note{--ad:#64748b}
.admonition .ad-head .ad-tag{margin-left:auto;font-size:9px;letter-spacing:1px;opacity:.6;text-transform:uppercase}

/* 折叠块 */
.preview-body details{
  margin:1.1em 0;border:1px solid var(--pv-line);border-radius:12px;
  background:var(--pv-card);overflow:hidden;box-shadow:var(--pv-shadow);
}
.preview-body summary{
  padding:11px 14px;font-weight:700;font-size:.94em;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:9px;
}
.preview-body summary::-webkit-details-marker{display:none}
.preview-body summary::before{
  content:'';width:0;height:0;border-left:6px solid var(--pv-accent);
  border-top:5px solid transparent;border-bottom:5px solid transparent;transition:.2s;flex:none;
}
.preview-body details[open] summary::before{transform:rotate(90deg)}
.preview-body details > *:not(summary){margin:0 14px 12px}

/* 脚注 */
.preview-body .footnotes{
  margin-top:2.2em;padding-top:14px;border-top:1px dashed var(--pv-line);font-size:.86em;color:var(--pv-mute)
}
.preview-body .footnotes ol{padding-left:1.4em;list-style:decimal}
.preview-body .footnotes li{margin:.3em 0}
.preview-body .footnotes li::before{display:none!important}
.preview-body .fnref{font-size:.72em;line-height:0;vertical-align:super}
.preview-body .fnref a{color:var(--pv-accent);text-decoration:none;background:none;font-weight:800;padding:0 .18em}
.preview-body .fnref a:hover{background:none;color:var(--pv-accent2)}
.preview-body .footnotes::before{content:'注释';display:block;font-size:10px;letter-spacing:1.5px;font-weight:700;color:var(--pv-accent);margin-bottom:8px}

/* ========== 扩展语法 ========== */
.preview-body ins{
  text-decoration:none;color:#0f7a55;background:linear-gradient(180deg,transparent 62%,rgba(61,220,151,.3) 62%);
  border-bottom:1.5px dashed rgba(16,160,110,.55);padding:0 .12em;
}
[data-theme="night"] .preview-body ins{color:#7ee2b8}
.preview-body .spoiler{
  position:relative;display:inline-block;padding:0 .35em;border-radius:6px;cursor:pointer;
  background:linear-gradient(135deg,#3a3550,#2a3142);color:transparent;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:.3s;user-select:none;
}
.preview-body .spoiler::after{content:'点击揭示';position:absolute;inset:0;display:grid;place-items:center;
  font-size:.68em;letter-spacing:.5px;color:#b9b0d8;pointer-events:none}
.preview-body .spoiler.revealed{background:var(--pv-tint);color:var(--pv-fg);box-shadow:none;user-select:auto}
.preview-body .spoiler.revealed::after{display:none}
.preview-body abbr.pv-abbr{
  text-decoration:none;border:0;cursor:pointer;position:relative;font-weight:650;
  color:var(--pv-accent);padding:0 .08em;border-radius:4px;
  background:linear-gradient(180deg,transparent 70%,rgba(124,92,255,.3) 70%);
}
.preview-body abbr.pv-abbr::before{
  content:'?';font-size:.6em;vertical-align:super;opacity:.65;margin-left:1px;font-weight:700;
}
.preview-body abbr.pv-abbr::after{
  content:attr(data-def);display:none;position:absolute;left:50%;top:calc(100% + 10px);
  transform:translateX(-50%);z-index:6;min-width:150px;max-width:240px;width:max-content;
  padding:10px 13px;border-radius:12px;font-size:11.5px;font-weight:500;line-height:1.65;
  color:#fff;background:#242a42;border:1px solid rgba(255,255,255,.14);
  box-shadow:0 12px 30px rgba(0,0,0,.34);white-space:normal;letter-spacing:0;text-align:left;
}
.preview-body abbr.pv-abbr.open::after,.preview-body abbr.pv-abbr:focus-visible::after{display:block}
.preview-body abbr.pv-abbr:focus-visible{outline:2px solid var(--pv-accent);outline-offset:2px}
.preview-body .pv-emoji{font-size:1.08em;line-height:1;display:inline-block;vertical-align:-.08em}
.preview-body sub,.preview-body sup{font-size:.7em;color:var(--pv-accent);font-weight:650;line-height:0}
.preview-body .h-anchor{display:none}
.preview-body kbd{margin:0 .1em}

/* 定义列表 */
.pv-dl{margin:1.15em 0;padding:14px 16px;border-radius:14px;background:var(--pv-card);
  border:1px solid var(--pv-line);box-shadow:var(--pv-shadow)}
.pv-dl dt{font-weight:750;color:var(--pv-fg);margin:.55em 0 .2em;padding-left:.7em;position:relative}
.pv-dl dt:first-child{margin-top:0}
.pv-dl dt::before{content:'';position:absolute;left:0;top:.28em;width:3px;height:.8em;border-radius:3px;background:var(--grad2)}
.pv-dl dd{margin:.15em 0 .5em 1.1em;padding-left:.9em;color:var(--pv-soft);
  border-left:1px solid var(--pv-line);font-size:.95em;line-height:1.75}
.pv-dl dd:last-child{margin-bottom:0}

/* 表标题 */
.table-caption{
  padding:9px 14px;font-size:.8em;color:var(--pv-mute);text-align:center;
  border-top:1px solid var(--pv-line2);background:var(--pv-card);letter-spacing:.3px;
}
.table-caption::before{content:'表 · ';color:var(--pv-accent);font-weight:700}

/* 任务状态 */
.task-cancel{opacity:.58}
.task-cancel > *{text-decoration:line-through;text-decoration-color:rgba(255,107,120,.6)}
.task-progress input[type="checkbox"]:checked{background:linear-gradient(135deg,#f59e0b,#f97316)!important}
.task-progress::after{
  content:'进行中';font-size:9px;color:#d98a1f;background:rgba(245,158,11,.14);
  border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px;
}

/* 代码块文件名 */
.code-filename{
  font-size:10.5px;color:#8ea0c0;font-family:ui-monospace,monospace;
  padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.06);
  border:1px solid #2b3346;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* 文档内目录 */
.inline-toc{
  margin:1.35em 0;padding:15px 16px 12px;border-radius:15px;
  background:linear-gradient(135deg,var(--pv-tint),rgba(56,189,248,.05));
  border:1px solid var(--pv-line);box-shadow:var(--pv-shadow);
}
.inline-toc .it-t{
  font-size:10px;font-weight:750;letter-spacing:1.4px;color:var(--pv-accent);
  text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:8px;
}
.inline-toc .it-t::after{content:'';flex:1;height:1px;background:var(--pv-line)}
.it-list{display:flex;flex-direction:column;gap:1px}
.it-item{
  display:block;width:100%;text-align:left;padding:6px 10px;border-radius:8px;
  font-size:.9em;color:var(--pv-soft);border-left:2px solid transparent;transition:.16s;line-height:1.5;
}
.it-item.lv2{padding-left:22px;font-size:.86em}
.it-item.lv3{padding-left:36px;font-size:.82em;color:var(--pv-mute)}
.it-item.lv4,.it-item.lv5,.it-item.lv6{padding-left:48px;font-size:.8em;color:var(--pv-mute)}
.it-item:hover{background:rgba(124,92,255,.1);color:var(--pv-fg)}
.it-item.on{background:rgba(124,92,255,.16);border-left-color:var(--pv-accent);color:var(--pv-fg);font-weight:650}
.it-empty{font-size:.85em;color:var(--pv-mute)}

/* 目录跳转落点高亮 */
@keyframes tocFlash{
  0%{background:rgba(124,92,255,.24);box-shadow:-8px 0 0 rgba(124,92,255,.5)}
  100%{background:transparent;box-shadow:-8px 0 0 transparent}
}
.preview-body h1.toc-flash,.preview-body h2.toc-flash,.preview-body h3.toc-flash,
.preview-body h4.toc-flash,.preview-body h5.toc-flash,.preview-body h6.toc-flash{
  animation:tocFlash 1.5s ease-out;border-radius:8px;
}

/* 导出图片专用：避开渲染库对 border-image / 伪元素覆盖层的失真 */
.export-compact{line-height:1.72;color:#24292f}
.export-compact h1,.export-compact blockquote{
  border-image:none!important;background:#fff!important;
}
.export-compact h1{border-left:4px solid #7c5cff!important}
.export-compact blockquote{
  border-left:4px solid #7c5cff!important;background:#f8f7ff!important;color:#4a5568!important;
}
.export-compact blockquote blockquote{background:#eef7ff!important;border-left-color:#38bdf8!important}
.export-compact .admonition::before{display:none!important}
.export-compact .admonition{background:#fafbff!important}
.export-compact .math-block{background:#f8f7ff!important}
.export-compact .math-label{display:none!important}
.export-compact .mermaid-card.mm-card,.export-compact .mm-canvas{overflow:visible!important}
.export-compact .mm-btn,.export-compact .mm-tools,.export-compact .mm-menu{display:none!important}
.export-compact abbr.pv-abbr::after,.export-compact abbr.pv-abbr::before{display:none!important}
/* 缩写释义：导出时直接印成可见小标签，不依赖点击气泡 */
.preview-body .rv-abbr{display:inline;white-space:normal}
.preview-body .rv-abbr b{
  color:#6b37d6;font-weight:700;background:var(--pv-inline-bg);
  border-bottom:1px dotted var(--pv-accent);border-radius:4px;padding:0 .12em;
}
.preview-body .rv-def{
  display:inline-block;margin:0 .15em .1em .35em;padding:.1em .5em;
  font-size:.76em;line-height:1.55;color:var(--pv-soft);font-weight:500;
  background:var(--pv-tint);border:1px solid var(--pv-line);border-radius:7px;
  vertical-align:baseline;white-space:normal;letter-spacing:0;
}
/* 剧透：仅在 .revealed 时露出文字，未开启时保留遮罩 */
.export-compact .spoiler.revealed{background:#f3efff!important;color:#4a3d70!important;box-shadow:none!important}
.export-compact .spoiler.revealed::after{display:none!important}
.export-compact .spoiler:not(.revealed){
  background:linear-gradient(135deg,#3a3550,#2a3142)!important;
  color:transparent!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)!important;
}
.export-compact .spoiler:not(.revealed)::after{
  content:'已隐藏';display:grid!important;place-items:center;color:#c9c2e6!important;
  font-size:.68em;letter-spacing:.5px;
}
.export-compact .rv-fold-note{
  padding:7px 14px;background:#f6f7fb;color:#8a92a8;font-size:11px;text-align:center;
  border-top:1px solid #e7eaf3;
}
.export-compact .toc-flash{animation:none!important}
.export-compact .code-copy,.export-compact .code-expand,.export-compact .table-hint,.export-compact .code-fade{display:none!important}
.export-compact .table-wrap{overflow:visible}
.export-compact .math-block{box-shadow:none}
.export-watermark{
  margin-top:34px;padding-top:14px;border-top:1px solid #eaecef;
  display:flex;align-items:center;gap:8px;font-size:11px;color:#9aa1b1;letter-spacing:.3px;
}
.export-watermark i{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#7c5cff,#38bdf8);display:block}
@media (max-width:600px){
  #output.preview-body{padding:20px 15px 48px}
  .preview-body h1{font-size:1.55em}
  .preview-body th,.preview-body td{padding:9px 11px}
  .code-line{padding:0 10px}
  .line-no{margin-right:9px}
}

/* ==================================================================
   墨笺 v5 · 增强层样式
   开放渲染 / 扩展语法 / 标题编号 / 媒体 / 指南
   ================================================================== */

/* ---------- 标题自动编号 ---------- */
.preview-body .pv-hnum{
  display:inline-block;margin-right:.42em;padding:.02em .46em;border-radius:7px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.68em;font-weight:800;
  line-height:1.55;vertical-align:.12em;letter-spacing:0;
  color:#fff;background:var(--grad2);box-shadow:0 2px 7px rgba(124,92,255,.28);
}
.preview-body[data-hnum="cn"] .pv-hnum{
  font-family:inherit;background:var(--pv-tint);color:var(--pv-accent);
  border:1px solid var(--pv-line);box-shadow:none;
}
.preview-body h1 .no-num,.preview-body h2 .no-num,.preview-body h3 .no-num{display:none}

/* ---------- 标签页 ---------- */
.pv-tabs{margin:1.25em 0;border:1px solid var(--pv-line);border-radius:15px;overflow:hidden;background:var(--pv-card);box-shadow:var(--pv-shadow)}
.pv-tabbar{display:flex;gap:3px;padding:7px 8px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--pv-line);background:var(--pv-bg)}
.pv-tabbar::-webkit-scrollbar{display:none}
.pv-tab{flex:none;padding:8px 14px 9px;border-radius:10px 10px 0 0;font-size:.86em;font-weight:650;color:var(--pv-mute);cursor:pointer;border:1px solid transparent;border-bottom:0;white-space:nowrap;transition:.16s;background:transparent;font-family:inherit}
.pv-tab:hover{color:var(--pv-fg);background:var(--pv-tint)}
.pv-tab.on{color:var(--pv-accent);background:var(--pv-card);border-color:var(--pv-line);box-shadow:0 -3px 0 var(--grad2) inset}
.pv-tabpanes{padding:4px 16px 14px}
.pv-pane{display:none}
.pv-pane.on{display:block}
.pv-pane > *:first-child{margin-top:.7em}
.pv-pane > *:last-child{margin-bottom:0}

/* ---------- 时间线 ---------- */
.pv-timeline{margin:1.3em 0;padding:4px 0 4px 2px;position:relative}
.pv-timeline::before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--pv-accent),rgba(56,189,248,.25));border-radius:2px}
.pv-tl-item{position:relative;padding:0 0 1.05em 38px;min-height:34px}
.pv-tl-item:last-child{padding-bottom:0}
.pv-tl-item::before{content:'';position:absolute;left:5px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--pv-bg);border:3px solid var(--pv-accent);box-shadow:0 0 0 4px rgba(124,92,255,.12);z-index:1}
.pv-tl-item:nth-child(3n+2)::before{border-color:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.13)}
.pv-tl-item:nth-child(3n)::before{border-color:#3ddc97;box-shadow:0 0 0 4px rgba(61,220,151,.13)}
.pv-tl-time{display:inline-block;font-size:.76em;font-weight:800;letter-spacing:.3px;color:var(--pv-accent);background:var(--pv-tint);border:1px solid var(--pv-line);border-radius:7px;padding:1px 8px;margin-bottom:4px}
.pv-tl-title{font-weight:750;font-size:1em;color:var(--pv-fg);margin:0 0 2px}
.pv-tl-body{font-size:.92em;color:var(--pv-soft);line-height:1.7}
.pv-tl-body p{margin:.25em 0}

/* ---------- 卡片 / 分栏 ---------- */
.pv-grid{display:grid;gap:12px;margin:1.25em 0;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.pv-cols{display:grid;gap:14px;margin:1.25em 0;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.pv-cols > .pv-col{padding:0 4px;border-left:2px solid var(--pv-line)}
.pv-cols > .pv-col:first-child{border-left:0}
.pv-card2{padding:14px 15px;border-radius:14px;background:var(--pv-card);border:1px solid var(--pv-line);box-shadow:var(--pv-shadow);transition:.18s}
.pv-card2:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(30,36,72,.12)}
.pv-card2 .pc-ico{width:32px;height:32px;border-radius:10px;background:var(--grad2);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:800;margin-bottom:9px;box-shadow:0 5px 14px rgba(124,92,255,.3)}
.pv-card2 h4{margin:0 0 5px!important;font-size:1em!important;color:var(--pv-fg)!important;padding:0!important}
.pv-card2 h4::after{display:none!important}
.pv-card2 p{margin:.3em 0;font-size:.9em;color:var(--pv-soft);line-height:1.7}
.pv-card2 > *:last-child{margin-bottom:0}
.pv-card2.accent-a{background:linear-gradient(135deg,var(--pv-tint),rgba(56,189,248,.06))}
.pv-card2.accent-b{background:linear-gradient(135deg,rgba(61,220,151,.1),var(--pv-card))}
.pv-card2.accent-c{background:linear-gradient(135deg,rgba(245,158,11,.1),var(--pv-card))}

/* ---------- 进度条 ---------- */
.pv-progress{margin:1.05em 0;padding:12px 14px;border-radius:13px;background:var(--pv-card);border:1px solid var(--pv-line);box-shadow:var(--pv-shadow)}
.pv-progress .pp-head{display:flex;justify-content:space-between;align-items:baseline;font-size:.86em;font-weight:700;margin-bottom:8px;color:var(--pv-fg)}
.pv-progress .pp-head b{font-family:ui-monospace,monospace;color:var(--pv-accent);font-size:1.02em}
.pv-progress .pp-track{height:10px;border-radius:999px;background:var(--pv-line);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.pv-progress .pp-fill{height:100%;border-radius:999px;background:var(--grad);transition:width .6s cubic-bezier(.22,1,.36,1);position:relative}
.pv-progress .pp-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:ppShine 2.6s linear infinite}
@keyframes ppShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pv-progress.warm .pp-fill{background:linear-gradient(90deg,#f59e0b,#fb7185)}
.pv-progress.cool .pp-fill{background:linear-gradient(90deg,#38bdf8,#3ddc97)}

/* ---------- 徽章 / 按钮 / 注音 ---------- */
.pv-badge{display:inline-block;font-size:.72em;font-weight:800;line-height:1.6;padding:.08em .6em;border-radius:999px;vertical-align:.12em;letter-spacing:.2px;color:#fff;background:var(--grad2);white-space:nowrap}
.pv-badge.b-blue{background:linear-gradient(135deg,#3b82f6,#38bdf8)}
.pv-badge.b-green{background:linear-gradient(135deg,#10b981,#3ddc97)}
.pv-badge.b-orange{background:linear-gradient(135deg,#f59e0b,#fb923c)}
.pv-badge.b-red{background:linear-gradient(135deg,#ef4444,#fb7185)}
.pv-badge.b-gray{background:linear-gradient(135deg,#64748b,#94a3b8)}
.pv-badge.b-outline{background:transparent;color:var(--pv-accent);border:1px solid var(--pv-accent)}
.pv-btn{display:inline-flex;align-items:center;gap:6px;padding:.42em 1.05em;margin:.15em .25em .15em 0;border-radius:10px;font-size:.86em;font-weight:750;text-decoration:none!important;background:var(--grad)!important;color:#fff!important;box-shadow:0 5px 14px rgba(124,92,255,.28);transition:.16s;cursor:pointer}
.pv-btn:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(124,92,255,.4)}
.pv-btn.ghost{background:transparent!important;color:var(--pv-accent)!important;border:1px solid var(--pv-accent);box-shadow:none}
.pv-btn.soft{background:var(--pv-tint)!important;color:var(--pv-accent)!important;box-shadow:none}
.pv-btn.danger{background:linear-gradient(135deg,#ef4444,#fb7185)!important;box-shadow:0 5px 14px rgba(239,68,68,.25)}
.preview-body ruby{ruby-position:over}
.preview-body rt{font-size:.55em;color:var(--pv-accent);font-weight:600;letter-spacing:0;transform:translateY(2px)}
.preview-body .pv-ruby{border-bottom:1px dotted rgba(124,92,255,.45)}

/* ---------- 公式编号 ---------- */
.pv-eqtag{position:absolute;right:12px;bottom:9px;font-family:ui-monospace,monospace;font-size:.78em;font-weight:700;color:var(--pv-accent);background:var(--pv-bg);border:1px solid var(--pv-line);border-radius:7px;padding:1px 8px}
.pv-eqref{font-family:ui-monospace,monospace;font-weight:750;color:var(--pv-accent);background:var(--pv-tint);border-radius:5px;padding:0 .3em}

/* ---------- 图注 / 画廊 / 图片对齐 ---------- */
.pv-figcap{margin-top:8px;font-size:.8em;color:var(--pv-mute);text-align:center}
.pv-figcap::before{content:'图 · ';color:var(--pv-accent);font-weight:700}
.pv-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:1.25em 0}
.pv-gallery .img-frame{margin:0}
.pv-gallery .img-frame img{width:100%;height:130px;object-fit:cover}
.img-frame.align-left{text-align:left}
.img-frame.align-right{text-align:right}
.img-frame.align-center{text-align:center}

/* ---------- 数据图表（自绘 SVG） ---------- */
.pv-chart{margin:1.3em 0;padding:16px 14px 12px;border-radius:15px;background:var(--pv-card);border:1px solid var(--pv-line);box-shadow:var(--pv-shadow);overflow-x:auto}
.pv-chart .ch-title{font-size:.9em;font-weight:750;color:var(--pv-fg);margin:0 0 10px 2px;display:flex;align-items:center;gap:8px}
.pv-chart .ch-title::before{content:'';width:4px;height:14px;border-radius:3px;background:var(--grad2)}
.pv-chart svg{display:block;max-width:100%;height:auto;margin:0 auto}
.pv-chart .ch-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:9px;font-size:.76em;color:var(--pv-soft)}
.pv-chart .ch-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.pv-chart .ch-err{font-family:ui-monospace,monospace;font-size:11px;color:var(--pv-mute);white-space:pre-wrap}

/* ---------- CSV / JSON 表 ---------- */
.pv-dtable{margin:1.2em 0;border-radius:14px;overflow:hidden;border:1px solid var(--pv-line);background:var(--pv-bg);box-shadow:var(--pv-shadow)}
.pv-dtable .dt-head{padding:8px 14px;font-size:.78em;font-weight:750;letter-spacing:.6px;color:var(--pv-accent);background:var(--pv-tint);border-bottom:1px solid var(--pv-line);text-transform:uppercase}
.pv-dtable .dt-scroll{overflow-x:auto}
.pv-dtable table{display:table;width:100%;margin:0;border-collapse:collapse;font-size:.9em;box-shadow:none;border-radius:0}
.pv-dtable th,.pv-dtable td{padding:8px 12px;border-bottom:1px solid var(--pv-line2);border-right:1px solid var(--pv-line2);text-align:left}
.pv-dtable th{background:var(--pv-card);font-weight:750;white-space:nowrap}
.pv-dtable tr:last-child td{border-bottom:0}
.pv-json{margin:1.2em 0;padding:13px 15px;border-radius:13px;background:#0f1320;color:#d8e2f5;font-family:ui-monospace,monospace;font-size:.8em;line-height:1.75;overflow-x:auto;white-space:pre-wrap;word-break:break-word;border:1px solid #262d40}
.pv-json .jk{color:#8fd0ff}.pv-json .js{color:#a5d6ff}.pv-json .jn{color:#79c0ff}.pv-json .jb{color:#ff8a80}

/* ---------- 开放渲染：媒体与可运行 HTML ---------- */
.pv-media{margin:1.25em 0;padding:13px 15px;border-radius:15px;background:linear-gradient(135deg,var(--pv-tint),rgba(56,189,248,.05));border:1px solid var(--pv-line);box-shadow:var(--pv-shadow)}
.pv-media .pm-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:.9em;font-weight:750;color:var(--pv-fg)}
.pv-media .pm-ico{width:28px;height:28px;border-radius:9px;background:var(--grad2);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.pv-media .pm-tag{margin-left:auto;font-size:.68em;font-weight:700;color:var(--pv-accent);background:var(--pv-bg);border:1px solid var(--pv-line);border-radius:999px;padding:2px 8px;letter-spacing:.4px}
.pv-media audio{display:block;width:100%;height:40px;margin:2px 0}
.pv-media video{display:block;width:100%;max-height:420px;border-radius:11px;background:#000;margin:2px 0}
.pv-media .pm-desc{font-size:.8em;color:var(--pv-mute);margin-top:8px;line-height:1.6}
.pv-media .pm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.pv-media .pm-actions a,.pv-media .pm-actions button{font-size:.76em;font-weight:700;padding:5px 11px;border-radius:8px;text-decoration:none;background:var(--pv-bg);border:1px solid var(--pv-line);color:var(--pv-accent);cursor:pointer;font-family:inherit}
.pv-media .pm-actions a:hover,.pv-media .pm-actions button:hover{background:var(--grad2);color:#fff;border-color:transparent}
.pv-media .pm-file{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--pv-bg);border:1px dashed var(--pv-line);font-size:.84em;color:var(--pv-soft)}
.pv-media .pm-file b{color:var(--pv-fg)}
.live-frame{margin:1.3em 0;border-radius:15px;overflow:hidden;border:1px solid var(--pv-line);background:var(--pv-card);box-shadow:var(--pv-shadow)}
.live-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 11px;border-bottom:1px solid var(--pv-line);background:linear-gradient(180deg,var(--pv-bg),var(--pv-card))}
.live-tools .lt-tag{font-size:.7em;font-weight:800;letter-spacing:.7px;color:#fff;background:var(--grad2);border-radius:6px;padding:3px 8px;white-space:nowrap}
.live-tools .lt-name{font-size:.8em;font-weight:700;color:var(--pv-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44%}
.live-tools .sp{flex:1}
.live-tools button{font-size:.72em;font-weight:700;padding:4px 9px;border-radius:7px;border:1px solid var(--pv-line);background:var(--pv-bg);color:var(--pv-accent);cursor:pointer;font-family:inherit;white-space:nowrap}
.live-tools button:hover{background:var(--grad2);color:#fff;border-color:transparent}
.live-frame iframe{display:block;width:100%;border:0;background:#fff;min-height:120px}
.live-frame.plain{padding:0}
.live-frame.plain .live-tools{display:none}
.live-ph{padding:22px 16px;text-align:center;font-size:.84em;color:var(--pv-mute);line-height:1.8}
.live-ph b{color:var(--pv-accent)}
.pv-raw{margin:1.2em 0;padding:14px 16px;border-radius:13px;background:var(--pv-card);border:1px dashed var(--pv-line);font-size:.9em;color:var(--pv-soft);line-height:1.75}
.pv-raw b{color:var(--pv-accent)}
.pv-htmlbox{margin:1.2em 0;padding:2px}
.pv-htmlbox > *:first-child{margin-top:.4em}
.pv-security{margin:1.2em 0;padding:11px 14px;border-radius:12px;font-size:.84em;line-height:1.75;color:#8a5a1e;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28)}
[data-theme="night"] .pv-security{color:#fcd34d;background:rgba(245,158,11,.1)}

/* ---------- 外壳：使用指南抽屉 ---------- */
.guide-top{position:sticky;top:0;z-index:3;padding:2px 0 10px;background:linear-gradient(180deg,#1a1e30 82%,rgba(26,30,48,0))}
.guide-search{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--a-line);border-radius:11px;padding:10px 13px;color:var(--a-fg);font-size:12.5px;outline:none}
.guide-search:focus{border-color:rgba(124,92,255,.65)}
.guide-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:9px}
.guide-nav::-webkit-scrollbar{display:none}
.guide-nav button{flex:none;font-size:11px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--a-line);color:var(--a-dim);font-weight:650;white-space:nowrap}
.guide-nav button.on{background:var(--grad2);color:#fff;border-color:transparent}
.g-sec{margin-bottom:16px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid var(--a-line);overflow:hidden}
.g-sec.hide{display:none}
.g-sec > h3{margin:0;padding:12px 14px;font-size:13px;font-weight:750;color:#e7dcff;background:linear-gradient(90deg,rgba(124,92,255,.16),transparent);border-bottom:1px solid var(--a-line);display:flex;align-items:center;gap:8px}
.g-sec > h3 i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--grad2);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.g-body{padding:12px 14px 14px;font-size:11.8px;line-height:1.85;color:#c3cadb}
.g-body p{margin:0 0 9px}
.g-body b,.g-body strong{color:#e8dcff;font-weight:700}
.g-body ul{margin:6px 0 9px;padding-left:18px}
.g-body li{margin:4px 0}
.g-body .g-note{margin:9px 0 0;padding:9px 11px;border-radius:10px;font-size:11px;line-height:1.75;color:#b9c2d8;background:rgba(56,189,248,.08);border-left:3px solid #38bdf8}
.g-body .g-warn{background:rgba(245,158,11,.09);border-left-color:#f59e0b}
.g-syn{display:flex;flex-direction:column;gap:7px;margin:9px 0}
.g-row{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--a-line)}
.g-row code,.g-body code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.8px;color:#cbbcff;background:rgba(124,92,255,.12);padding:1px 5px;border-radius:5px;word-break:break-all}
.g-row .g-k{flex:0 0 38%;min-width:0}
.g-row .g-v{flex:1;min-width:0;color:#aeb7cd;font-size:11px;line-height:1.7}
.g-pre{margin:9px 0;padding:11px 12px;border-radius:10px;background:#0d111b;border:1px solid #262d3f;color:#d9e2f4;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.8px;line-height:1.7;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.g-sec .g-hit{position:absolute}
.guide-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:6px}
.guide-empty{text-align:center;color:var(--a-faint);font-size:12px;padding:30px 10px}
.guide-badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:6px;background:rgba(61,220,151,.16);color:#7ee2b8;margin-left:auto}
.guide-badge.new{background:rgba(124,92,255,.2);color:#cbbcff}

/* ---------- 外壳：媒体工厂 ---------- */
.mf-drop{border:1.5px dashed rgba(124,92,255,.45);border-radius:14px;padding:18px 14px;text-align:center;background:rgba(124,92,255,.06);cursor:pointer;transition:.18s}
.mf-drop:active{transform:scale(.98);background:rgba(124,92,255,.14)}
.mf-drop b{display:block;font-size:13px;color:#e6dcff;margin-bottom:4px}
.mf-drop small{font-size:10.5px;color:var(--a-dim);line-height:1.7}
.mf-list{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.mf-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--a-line)}
.mf-item .fi{width:28px;height:28px;border-radius:8px;background:var(--grad2);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.mf-item .ft{flex:1;min-width:0}
.mf-item .ft b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mf-item .ft small{display:block;font-size:10px;color:var(--a-faint);margin-top:2px}
.mf-item button{font-size:10.5px;padding:5px 9px;border-radius:8px;background:rgba(124,92,255,.16);color:#d3c6ff;flex:none;font-weight:700}
.mf-item button.rm{background:rgba(255,107,120,.12);color:#ffb3bb}
.mf-opt{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.mf-opt .mini{pointer-events:auto}
.mf-hint{font-size:10.5px;color:var(--a-faint);line-height:1.8;margin-top:11px}

/* 状态栏开放模式标识 */
.statusbar .open-badge{display:inline-flex;align-items:center;gap:4px;color:#7ee2b8;font-weight:700;cursor:pointer}
.statusbar .open-badge.off{color:#ffb3bb}
.statusbar .open-badge i{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}

/* 导出 / 打印：隐藏交互控件 */
.export-compact .live-tools,.export-compact .pm-actions,.export-compact .pv-tabbar{display:none!important}
/* 标签页：默认只印当前标签；JS 的「全部展开」策略会给每个面板加 .on */
.export-compact .pv-pane{display:none}
.export-compact .pv-pane.on{display:block}
.export-compact .pv-tabpanes{padding-top:0}
@media print{
  .live-tools,.pm-actions{display:none!important}
  .pv-pane{display:block!important}
  .live-frame{break-inside:avoid}
}

/* ==================== v5.1 · 运行 / 源码切换 ==================== */
.live-viewseg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:rgba(0,0,0,.22);margin-right:4px;vertical-align:middle}
.live-viewseg button{font-size:10.5px;padding:4px 8px;border-radius:7px;color:var(--a-dim);font-weight:700;white-space:nowrap;transition:.15s}
.live-viewseg button.on{background:var(--grad2);color:#fff;box-shadow:0 2px 8px rgba(124,92,255,.3)}
.live-frame .live-view{display:block}
/* 源码视图 = 与普通代码块完全一致的 DOM / 高亮 / 行号 / 复制按钮 */
.live-frame .live-src-code{display:none;margin:0;border-top:1px solid var(--a-line)}
.live-frame.show-source .live-view{display:none}
.live-frame.show-source .live-src-code{display:block}
.live-frame .live-src-code pre{margin:0;border-radius:0}
.live-frame .live-src-code .pre-tools{border-radius:0}
.live-frame.off .live-view{padding:10px}
.live-frame.off .pv-security{margin:0}
/* 独立 HTML 导出页里同样可用 */
body:not(.app-shell) .live-src{background:#f7f8fc;color:#242a3d;border-color:#e7eaf3}
@media (max-width:520px){
  .live-viewseg button{font-size:10px;padding:4px 6px}
  .live-tools{flex-wrap:wrap}
}

/* ==================== v5.1 · 长图静态化 ==================== */
.img-static-note{font-size:12px;line-height:1.75;padding:11px 14px;border-radius:12px;
  background:rgba(124,92,255,.07);border:1px dashed rgba(124,92,255,.32);color:#5b6178;margin:10px 0}
.img-static-note b{color:#6b37d6}
.img-static-note small{color:#8a92a8}
.img-static-note .g-pre{margin-top:9px;font-size:11px;line-height:1.6;max-height:230px;overflow:hidden;
  background:#f7f8fc;color:#3b4055;border-radius:9px;padding:10px 12px}
.img-pane-label{font-weight:700;color:#6b37d6;font-size:12.5px;margin:2px 0 9px;padding-left:2px}
.export-compact .pv-tabs.img-static .pv-tab{cursor:default}
.export-compact .pv-tabs.img-static .pv-tab::after{display:none}

/* ==================== v5.1 · 提示条双按钮 ==================== */
.demo-hint .go{margin-left:auto}
.demo-hint .go + .go{margin-left:6px}
.demo-hint .go.hot{background:var(--grad2);color:#fff}
.demo-hint > span{flex:1;min-width:0}

/* ==================== v5.1 · 内置流程图 ==================== */
.mermaid-card.mm-builtin .mm-canvas{overflow-x:auto;padding:12px 8px;text-align:center}
.mermaid-card.mm-builtin .bf-svg{max-width:100%;height:auto}
.mermaid-card.mm-builtin .mm-cap{justify-content:center}


/* ==================== v5.1 · HTML / CSS / SVG 源码查看 ==================== */
.src-toggle{margin-top:10px;border-top:1px dashed var(--pv-line2);padding-top:8px}
.src-toggle>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;color:var(--pv-accent);letter-spacing:.2px;user-select:none}
.src-toggle>summary::-webkit-details-marker{display:none}
.src-toggle>summary::before{content:'▸';font-size:12px;transition:transform .18s}
.src-toggle[open]>summary::before{transform:rotate(90deg)}
.src-toggle>summary:hover{text-decoration:underline}
.src-toggle .g-pre{margin:8px 0 0;max-height:380px;overflow:auto;font-size:11.5px;line-height:1.65;
  background:rgba(0,0,0,.045);color:var(--pv-fg);border-radius:10px;padding:11px 13px;
  white-space:pre-wrap;word-break:break-word}
.pv-htmlbox .html-view{min-width:0}
@media print{.src-toggle{display:none}}

/* ==================== v5.2 · 二维码 ==================== */
.qr-wrap{margin:16px 0}
.qr-card{display:flex;align-items:center;gap:16px;padding:14px 16px;margin:12px 0;
  border-radius:16px;border:1px solid var(--pv-line);
  background:linear-gradient(135deg,rgba(124,92,255,.07),rgba(56,189,248,.05)),var(--pv-card);
  box-shadow:0 6px 22px rgba(28,32,54,.05)}
.qr-card.small{padding:10px 12px;margin:9px 0;gap:12px;border-radius:13px}
.qr-img{flex:none;line-height:0;background:#fff;padding:7px;border-radius:11px;
  border:1px solid var(--pv-line2);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.qr-img .qr-svg{display:block;width:104px;height:104px}
.qr-card.small .qr-img{padding:5px;border-radius:9px}
.qr-card.small .qr-img .qr-svg{width:76px;height:76px}
.qr-txt{min-width:0;flex:1}
.qr-txt b{display:block;font-size:13.5px;color:var(--pv-fg);font-weight:750;letter-spacing:.2px}
.qr-card.small .qr-txt b{font-size:12.5px}
.qr-txt small{display:block;font-size:11px;color:var(--pv-mute);line-height:1.7;margin-top:4px}
.qr-txt code{display:block;margin-top:7px;font-size:10.5px;line-height:1.6;color:#6b37d6;
  word-break:break-all;background:rgba(124,92,255,.08);padding:5px 8px;border-radius:7px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.qr-doc{display:flex;align-items:center;gap:18px;margin:26px 0 10px;padding:18px 20px;
  border-radius:18px;border:1px dashed rgba(124,92,255,.35);
  background:linear-gradient(120deg,rgba(124,92,255,.09),rgba(56,189,248,.06))}
.qr-doc-l{flex:1;min-width:0}
.qr-doc-l b{display:block;font-size:14px;color:var(--pv-accent);font-weight:750}
.qr-doc-l p{margin:7px 0;font-size:11.8px;line-height:1.85;color:var(--pv-soft)}
.qr-doc-l code{display:block;font-size:10.8px;word-break:break-all;color:#6b37d6;
  background:rgba(255,255,255,.7);padding:7px 10px;border-radius:8px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.qr-doc-r{flex:none;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--pv-line2);
  box-shadow:0 4px 16px rgba(28,32,54,.08)}
.qr-doc-r .qr-svg{display:block}
@media (max-width:620px){
  .qr-doc{flex-direction:column;align-items:flex-start;gap:12px;padding:15px}
  .qr-card{gap:11px;padding:11px}
  .qr-img .qr-svg{width:86px;height:86px}
}

/* ==================== v5.2 · 编辑器拖放 ==================== */
#editor.drag-over{box-shadow:inset 0 0 0 2px var(--violet),inset 0 0 40px rgba(124,92,255,.15)}
#cursorPos{font-variant-numeric:tabular-nums}

/* ==================== v5.2 · 预览精修（简约 + 多彩） ==================== */
/* 各类卡片统一：柔和渐变顶边 + 细彩边 + 轻阴影，避免过度装饰 */
.pv-card2,.admonition,.img-frame,.table-shell,.pv-media,.qr-card,.pv-progress{
  border:1px solid var(--pv-line)!important;
  box-shadow:0 4px 18px rgba(28,32,54,.045)!important}
.pv-card2{position:relative;overflow:hidden}
.pv-card2::before,.admonition::before,.img-frame::before,.table-shell::before,.pv-media::before{
  content:'';position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,#7c5cff,#a855f7,#38bdf8,#3ddc97);opacity:.75}
.admonition,.img-frame,.table-shell,.pv-media{position:relative}
/* 标签页：当前标签更清晰，面板内边距统一 */
.pv-tabs{border-radius:15px;overflow:hidden;border:1px solid var(--pv-line)}
.pv-tabbar{background:linear-gradient(90deg,rgba(124,92,255,.07),rgba(56,189,248,.05))}

  const s=String(text==null?'':text);

     失败再试 Clipboard API，最后再兜底一次，彻底避免「复制失败」。 */
  function legacy(){
    const ta=document.createElement('textarea');
    ta.value=s; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:-9999px;width:1px;height:1px;opacity:1;border:0;padding:0;z-index:99999;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ ta.setSelectionRange(0,s.length); }catch(e){}
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
    ta.remove(); return ok;

  if(legacy()) return Promise.resolve();
  if(navigator.clipboard && window.isSecureContext)

  return legacy()?Promise.resolve():fail();

  });
  // 键盘按键 [[Ctrl]] + [[C]]
  t=t.replace(/\[\[([^\]\n]+)\]\]/g,(m,k)=>'<kbd>'+esc(k)+'</kbd>');
  // 插入 ++text++
  t=t.replace(/\+\+([^+\n]+)\+\+/g,(m,x)=>'<ins>'+x+'</ins>');
  // 剧透 ||text||
  t=t.replace(/\|\|([^|\n]+)\|\|/g,(m,x)=>'<span class="spoiler" title="点击揭示">'+x+'</span>');
  // 荧光高亮 ==text==
  t=t.replace(/==([^=\n]+)==/g,(m,x)=>'<mark>'+x+'</mark>');
  // 上标 X^2^
  t=t.replace(/\^([^\s^\n]+)\^/g,(m,x)=>'<sup>'+x+'</sup>');
  // 下标 H~2~O（避开 ~~删除线~~）
  t=t.replace(/~([^\s~\n]+)~/g,(m,x,off,whole)=>{
    if(whole.charAt(off-1)==='~'||whole.charAt(off+m.length)==='~') return m;
    return '<sub>'+x+'</sub>';
  });
  // 缩写 *[X]: 全称
  (abbrs||[]).forEach(pair=>{
    const re=new RegExp('(^|[^\\w])('+escRe(pair[0])+')(?=$|[^\\w])','g');
    t=t.replace(re,(m,pre,w)=>pre+
      '<abbr class="pv-abbr" data-def="'+esc(pair[1])+'" title="'+esc(pair[1])+
      '" tabindex="0" role="button">'+w+'</abbr>');
  });
  return t;
}

/* ---------- 围栏代码块：逐行扫描，支持缩进 / ~~~ / 信息串 ---------- */
function parseInfo(info){
  let m=info.match(/^([^\s:{]+)\s*:\s*([^\s{]+)/);
  if(m) return { lang:m[1], filename:m[2] };
  m=info.match(/title\s*=\s*["']([^"']+)["']/);
  const first=info.split(/\s+/)[0]||'';
  return { lang:first.replace(/^\./,''), filename:m?m[1]:'' };
}
function stripQuote(line, q){
  if(!q) return line;
  if(line.indexOf(q)===0) return line.slice(q.length);
  return line.replace(/^[ \t]*>[ \t]*/,'');
}
function extractFences(src, st){
  const lines=src.split('\n'), out=[]; let i=0;
  while(i<lines.length){
    const m=lines[i].match(/^([ \t]*)((?:>[ \t]*)*)(`{3,}|~{3,})[ \t]*([^\n]*)$/);
    if(!m){ out.push(lines[i]); i++; continue; }
    const indent=m[1], quote=m[2], fence=m[3], info=m[4].trim(), body=[]; i++;
    while(i<lines.length){
      const cm=lines[i].match(/^([ \t]*)(?:>[ \t]*)*(`{3,}|~{3,})[ \t]*$/);
      if(cm && cm[2].charAt(0)===fence.charAt(0) && cm[2].length>=fence.length){ i++; break; }
      const raw=stripQuote(lines[i],quote);
      body.push(raw.indexOf(indent)===0 ? raw.slice(indent.length) : raw);
      i++;
    }
    const p=parseInfo(info);
    const idx=st.code.push({ lang:p.lang, filename:p.filename, code:body.join('\n') })-1;
    // 带引用前缀时不插空行，避免把连续的 blockquote 拆成多块
    if(quote) out.push(quote+tk('C',idx));
    else out.push('', tk('C',idx), '');
  }
  return out.join('\n');
}

/* ---------- 容器 ::: / !!! / ??? / >>> 支持任意深度嵌套 ---------- */
function extractContainers(src, st, depth){
  if(depth>8) return src;
  const lines=src.split('\n'), out=[]; let i=0;
  const OPEN=/^([ \t]*)((?:>[ \t]*)*)(:::|!!!|\?\?\?|>>>)[ \t]*([^\n]*)$/;
  while(i<lines.length){
    const m=lines[i].match(OPEN);
    if(!m || !m[4].trim()){ out.push(lines[i]); i++; continue; }
    const marker=m[3], quote=m[2], head=m[4].trim(), body=[];
    let dep=1; i++;
    while(i<lines.length){
      const om=lines[i].match(OPEN);
      if(om && !om[4].trim()){
        dep--;
        if(dep===0){ i++; break; }
        body.push(stripQuote(lines[i],quote)); i++; continue;
      }
      if(om && om[4].trim()) dep++;
      body.push(stripQuote(lines[i],quote)); i++;
    }
    const inner=marked.parse(compile(body.join('\n'), st, depth+1));
    let html;
    if(marker==='???'||marker==='>>>'||/^(spoiler|details|fold)\b/i.test(head)){
      const title=head.replace(/^(spoiler|details|fold)\b\s*/i,'');
      html='<details class="pv-details"><summary>'+
        (title?marked.parseInline(compile(title,st,depth+1)):'点击展开')+'</summary>'+inner+'</details>';
    }else{
      const hm=head.match(/^([A-Za-z]+)\s*([\s\S]*)$/);
      const rawType=(hm&&hm[1]||'').toLowerCase();
      const t=ADMO_TYPES.indexOf(rawType)>=0?rawType:'note';
      const title=ADMO_TYPES.indexOf(rawType)>=0?(hm[2]||''):head;
      html='<div class="admonition '+t+'"><div class="ad-head"><span class="ad-ico">'+
        (ADMO_ICONS[t]||'✎')+'</span>'+marked.parseInline(compile(title||ADMO_NAMES[t],st,depth+1))+
        '<span class="ad-tag">'+t+'</span></div>'+inner+'</div>';
    }
    const idx=st.raw.push(html)-1;
    if(quote) out.push(quote+tk('R',idx));
    else out.push('', tk('R',idx), '');
  }
  return out.join('\n');
}

/* ---------- 定义列表（PHP Markdown Extra / Pandoc） ---------- */
function extractDefLists(src, st){
  const lines=src.split('\n'), out=[]; let i=0;
  const DEF=/^([ \t]*(?:>[ \t]*)*):[ \t]+(.+)$/;
  while(i<lines.length){
    const dm=lines[i].match(DEF);
    if(dm && out.length){
      const last=out.length-1;
      const quote=dm[1], term=out[last];
      const plain=term.replace(/^[ \t]*(?:>[ \t]*)*/,'');
      if(plain.trim() && !/^[ \t]*(#|>|\||[-*+][ \t]|```|~~~|\d+\.)/.test(plain)){
        const defs=[];
        while(i<lines.length){
          const d=lines[i].match(DEF); if(!d) break;
          defs.push('<dd>'+marked.parseInline(compile(d[2],st,9))+'</dd>');
          i++;
        }
        const html='<dl class="pv-dl"><dt>'+marked.parseInline(compile(plain.trim(),st,9))+'</dt>'+
          defs.join('')+'</dl>';
        const idx=st.raw.push(html)-1;
        out[last]=quote+tk('R',idx);
        continue;
      }
    }
    out.push(lines[i]); i++;
  }
  return out.join('\n');
}

/* ---------- 脚注 ---------- */
function extractFootnotes(src, st){
  const notes=[];
  src=src.replace(/^[ \t]*\[\^([^\]\s]+)\]:[ \t]*(.+)$/gm,(m,id,text)=>{
    notes.push({id,text:text.trim()}); return '';
  });
  if(!notes.length) return src;
  const map={}; notes.forEach((n,i)=>{ n.n=i+1; map[n.id]=n; });
  src=src.replace(/\[\^([^\]\s]+)\]/g,(m,id)=>{
    const n=map[id];
    return n? '<sup class="fnref"><a href="#fn-'+esc(n.id)+'">'+n.n+'</a></sup>' : m;
  });
  const list=notes.map(n=>'<li id="fn-'+esc(n.id)+'">'+
    marked.parseInline(inlineExt(n.text,st.abbrs||[]))+'</li>').join('');
  const idx=st.raw.push('<section class="footnotes"><ol>'+list+'</ol></section>')-1;
  return src+'\n\n'+tk('R',idx)+'\n\n';
}

/* ---------- 缩写定义 ----------
   定义可能写在文末、容器内或引用里，因此在最外层 compile 之前
   先对整篇原文做一次全局收集，再逐层移除定义行，保证任何位置都生效。 */
const ABBR_DEF_RE=/^[ \t]*(?:>[ \t]*)*\*\[([^\]]+)\]:[ \t]*(.+)$/gm;
function collectAbbrs(src, st){
  st.abbrs = st.abbrs || [];
  const list=[]; let m;
  const re=new RegExp(ABBR_DEF_RE.source,'gm');
  while((m=re.exec(src))){
    const k=m[1].trim(), v=m[2].trim();
    if(k && v) list.push([k,v]);
  }
  if(list.length){
    const seen=new Set(st.abbrs.map(x=>x[0].toLowerCase()));
    list.forEach(x=>{
      const key=x[0].toLowerCase();
      if(!seen.has(key)){ st.abbrs.push(x); seen.add(key); }
    });
  }
}
function extractAbbrs(src){
  return src.replace(ABBR_DEF_RE,'');
}

/* ---------- 图片尺寸 ![alt](url =200x80) ---------- */
function extractImgSizes(src, st){
  return src.replace(/(!\[[^\]]*\]\()([^\s)]+)((?:[ \t]+"[^"]*")?)[ \t]+=(\d+)(?:[x×](\d+))?(\))/g,
    (m,pre,url,title,w,h,end)=>{
      st.imgSizes.push({ src:url, w:Number(w), h:h?Number(h):null });
      return pre+url+(title||'')+end;
    });
}

/* ---------- 逐行块：自定义标题 id / [TOC] / 表标题 / 任务状态 ---------- */
function extractLineBlocks(src, st){
  const lines=src.split('\n');
  return lines.map(line=>{
    // 标题自定义 id  # 标题 {#my-id}
    let m=line.match(/^([ \t]*(?:>[ \t]*)*)(#{1,6}[ \t]+[\s\S]*?)[ \t]+\{#([A-Za-z][\w-]*)\}[ \t]*$/);
    if(m) return m[1]+m[2]+'<span class="h-anchor" data-id="'+esc(m[3])+'"></span>';
    // 文档内目录 [TOC]
    m=line.match(/^([ \t]*(?:>[ \t]*)*)\[TOC\][ \t]*$/i);
    if(m) return m[1] ? m[1]+tk('T',st.tocCount++) : '\n\n'+tk('T',st.tocCount++)+'\n\n';
    // 表标题 Table: xxx
    m=line.match(/^([ \t]*(?:>[ \t]*)*)Table:[ \t]*(.+)$/);
    if(m) return m[1]+'<div class="table-caption">'+esc(m[2])+'</div>';
    // 任务状态 [-] 取消 / [?] 进行中
    m=line.match(/^([ \t]*(?:>[ \t]*)*[-*+][ \t]+)\[([-?])\]([ \t]+)([\s\S]*)$/);
    if(m) return m[1]+'[x]'+m[3]+m[4]+'<span class="task-state" data-s="'+
      (m[2]==='-'?'cancel':'progress')+'"></span>';
    return line;
  }).join('\n');
}

/* ---------- 主编译入口 ---------- */
const BLOCK_MATH=[/\$\$([\s\S]+?)\$\$/g, /\\\[([\s\S]+?)\\\]/g];
const INLINE_MATH=[/\\\(([\s\S]+?)\\\)/g, /\$([^$\n]+?)\$/g];

function compile(src, st, depth){
  depth=depth||0;
  src=extractFences(src,st);
  // 在围栏抽取之后、容器递归之前全局收集：文末 / 容器内 / 引用内定义都生效，
  // 且代码块里演示用的 *[X]: 不会被误当成真实定义。
  if(depth===0) collectAbbrs(src, st);
  src=extractContainers(src,st,depth);
  src=extractDefLists(src,st);
  src=extractFootnotes(src,st);
  src=extractAbbrs(src);
  src=extractImgSizes(src,st);
  src=extractLineBlocks(src,st);

  // 块级公式
  BLOCK_MATH.forEach(re=>{ src=src.replace(re,(m,body)=>{
    const i=st.math.push({display:true,body:body.trim()})-1;
    return '\n\n'+tk('M',i)+'\n\n';
  }); });
  // 行内代码：支持多反引号与跨行
  src=src.replace(/(`+)([\s\S]*?)\1(?!`)/g,(m,fence,body,off,whole)=>{
    if(body.indexOf(fence)>=0 || whole.charAt(off-1)==='`') return m;
    const i=st.icode.push(body.replace(/\n/g,' '))-1;
    return tk('I',i);
  });
  // 行内公式：避开 \$ 转义、货币金额与 $5 ... $10 误判
  INLINE_MATH.forEach(re=>{ src=src.replace(re,(m,body,off,whole)=>{
    if(off>0 && /[\w\\]/.test(whole.charAt(off-1))) return m;
    if(/^\s|\s$/.test(body)) return m;
    const i=st.math.push({display:false,body:body.trim()})-1;
    return tk('M',i);
  }); });
  // 行内扩展（保护 HTML 标签 / 链接 / 占位符 / 代码）
  src=mapTextSegments(src, seg=>inlineExt(seg, st.abbrs||[]));
  return src;
}

/* ---------- 占位符解析：文本节点级精确替换 ---------- */
function findTokenNode(root, token){
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n=w.nextNode())) if(n.nodeValue.indexOf(token)>=0) return n;
  return null;
}
function replaceToken(root, token, makeNode, block){
  const n=findTokenNode(root,token); if(!n) return false;
  const p=n.parentNode;
  // 块级 token 独占一个段落时，整段替换为块元素（避免 <p><div> 非法嵌套）
  if(block && p && p.tagName==='P' && p.textContent.replace(token,'').trim()===''){
    p.parentNode.replaceChild(makeNode(),p);
    return true;
  }
  const parts=n.nodeValue.split(token), frag=document.createDocumentFragment();
  parts.forEach((s,i)=>{
    if(i>0) frag.appendChild(makeNode());
    if(s) frag.appendChild(document.createTextNode(s));
  });
  p.replaceChild(frag,n);
  return true;
}
function rawFragment(html){
  const d=document.createElement('div'); d.innerHTML=html;
  const f=document.createDocumentFragment();
  while(d.firstChild) f.appendChild(d.firstChild);
  return f;
}

/* ---------- 代码块 DOM ---------- */
function buildCodeBlock(blk){

        '<button type="button" class="mm-btn mm-zoomout" title="缩小">−</button>'+

  const lines = blk.code.split('\n').length;
  if(S.collapse && lines>16){
    wrap.classList.add('can-collapse','collapsed');
    ex.addEventListener('click',()=>{
      wrap.classList.toggle('collapsed');
      ex.textContent = wrap.classList.contains('collapsed') ? '展开全部' : '收起';
      buzz();
    });
